/* shared sub-tab ribbon — underline tabs, one component for every tab (UI_STANDARD P3) */

@media (max-width: 700px) {

}
/* A COLLAPSED COLUMN THAT STILL DOES NOT FIT. `dashboard.py` has collapsed .col-2/.col-3/.col-25 to a
   single `1fr` track below 1200px for a long time, and the public build repeats it — yet Big Picture
   still dragged the page sideways on a phone (public index measured 555 wide in a 360 viewport,
   2026-08-17). The collapse was working: the track was ONE column. It was 429px wide inside a 262px
   container, because a `1fr` track cannot shrink below its item's AUTOMATIC MINIMUM SIZE, and a grid
   item's default `min-width:auto` resolves to its min-content — here a wide table's. So the fix is not
   another breakpoint or a narrower font; it is telling the track it may shrink. `minmax(0, 1fr)` plus
   `min-width:0` on the items is the whole of it, and the `.scroll` wrappers already present then do
   what they were written to do. */
@media (max-width: 1200px) {
  .col-2, .col-25, .col-3 { grid-template-columns: minmax(0, 1fr) !important; }
  .col-2 > *, .col-25 > *, .col-3 > * { min-width: 0; }
}

:root{--bg:#f8fafc;--card:rgba(255,255,255,.95);--line:rgba(15,23,42,.08);--bull:#059669;--bear:#dc2626;--side:#475569;--conflict:#d97706;--txt:#0f172a;--mut:#475569;--hl:#2563eb;}

/* shared standalone-page shell — header (name/logo, top-left), body rhythm, footer */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;font-size:var(--fs-base);
  line-height:var(--lh-base);-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:var(--sp-8) var(--sp-5) 72px}
/* WIDE PAGES. 820px is a READING measure — right for about/, wrong for a view that was a dashboard
   tab an hour ago. Measured 2026-08-19 when Announcements moved out of index.html: the same three
   sections went from 1392px wide to 780px and ~60% taller, because a `.tabpanel` is capped at
   --page-max (1440) and `.wrap` at 820. Content identical, layout squeezed - which only a
   before/after comparison catches, since every render check still passed.
   Opt-in per page (`page_shell(..., wide=True)`) rather than widening `.wrap` for everyone: about/
   and the other prose pages want the reading measure they have. */
.wrap.wide{max-width:calc(var(--page-max) + var(--sp-5) * 2)}
/* ...AND THE PROSE DEFAULTS STOP AT THE DOOR. SHELL_CSS styles `p`/`li`/`ul` for READING pages
   (about/): 68ch measure, 8px between list items, muted colour. A panel transplanted off the
   dashboard is not prose — it is a component that already sizes itself — and those rules silently
   restyled it: measured 2026-08-19, the Announcements digest's theme list came out 355px instead of
   186px and section 1 grew from 1,989px to 2,957px on IDENTICAL text (7,147 characters both sides).
   Every render check passed; only a before/after against the pre-split page showed it.
   Scoped to `.wrap.wide` because that flag marks exactly the pages that carry app panels. */
.wrap.wide p,.wrap.wide li{max-width:none;color:inherit}
.wrap.wide li{margin-bottom:0}
.wrap.wide ul{margin:0;padding-left:0}
/* ...and the panel's FIRST child starts flush with the nav. SHELL_CSS gives `h2` a 24px top margin
   for reading pages; the IPO panel opens with an <h2> and the Announcements panel with a <div>, so
   one page sat 24px lower than the other under the same nav (measured 2026-08-19: content top 112 vs
   88). Scoped to the first child so headings BETWEEN sections keep their spacing — the gap is only
   wrong where it is the first thing under the nav. */
.wrap.wide .tabpanel > :first-child{margin-top:0}
/* THE NAV IS THE SAME NAV ON EVERY SURFACE (owner 2026-08-19: "the top nav height increases and
   white space above name is more as compared when I was on Big Picture"). Measured before this rule:
   dashboard nav top=0 h=48 item=40; /ipo/ and /announcements/ top=32 h=56 item=39 — because a
   standalone page wraps its content in `.wrap`, whose 32px reading-page padding sits ABOVE the nav,
   and `.sitenav` adds a bottom pad + rule the dashboard's bucket row does not have.
   Three declarations, one per difference, so a reader moving between pages sees one bar that does
   not move. Reading pages (about/) are untouched — they are not `.wide`. */
.wrap.wide{padding-top:0}
/* margin AND padding. SHELL_CSS gives `.sitenav` a 12px bottom margin for reading pages; leaving
   it here pushed app-page content to y=60 against the dashboard's 48, and on the Company page
   it opened a 12px hole between the site nav and the section ribbon that pins under it. The
   Company page is not `.wide` (it has its own wrapper rule), so it is named explicitly rather
   than left to inherit a fix that does not reach it. */
.wrap.wide .sitenav,.wrap:has(.co-page) .sitenav{padding-bottom:0;border-bottom:none;margin-bottom:0}
.wrap.wide .sitenav-a{height:40px;line-height:20px;display:inline-flex;align-items:center}

/* MOVED HERE FROM NAV_STICKY_CSS 2026-08-19, in the same pass that renamed it from `.note`. It had
   been sitting in a constant the reading pages do not load: `page_shell` composes TOKENS_CSS +
   BASE_ROOT_CSS + SHELL_CSS, so /about/ carried `class="note"` with no rule defining it and its
   disclaimer — the one block on the page that is meant to stand out — rendered as plain prose. It
   went unnoticed because the class WAS defined, just in the stylesheet the dashboard loads and this
   page does not; nothing was missing anywhere a grep would look.
   A reading-page component belongs in the reading-page shell. Leaving prose and component rules in
   NAV_STICKY_CSS is what produced the six inheritance defects of 2026-08-19 in the other direction,
   where panels moved onto a page and picked up rules meant for prose. */
.callout{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--hl);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:var(--sp-4) var(--sp-5);margin:var(--sp-6) 0;
  box-shadow:var(--sh-1)}
.callout h2{margin-top:0}

<style id="ipo-css">
.tabbar{display:flex;gap:6px;margin:0 0 18px;border-bottom:1px solid var(--line);}
.tabbtn{padding:10px 20px;border:none;background:none;font-family:'Outfit',sans-serif;font-size:var(--fs-base,14px);font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;transition:var(--transition);}

.gtbl table{border-collapse:separate;border-spacing:0;}

.gtbl th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
.gtbl th.sortable:hover{color:var(--hl);}
.gtbl td{white-space:nowrap;}
/* freeze the FIRST column (symbol/company/fund/lead) on horizontal scroll */
.gtbl td:first-child,.gtbl th:first-child{position:sticky;left:0;z-index:2;background:var(--card);box-shadow:inset -1px 0 0 var(--line);}
/* THE FIRST COLUMN IS CAPPED, because it is sticky and `.gtbl td` is nowrap — together those two
   make one long value take over the screen. Measured on Screens > New Listing: with the default
   filters the Symbol column is 117px; clicking Reset admits `DMRHYDROENGINEERINGANDINFRASTRUCTURES`
   (37 characters, a real symbol in sme_ipo_analysis.csv) and the column becomes 333px, the table
   2465 -> 3169px, and since column 1 is pinned to the left the reader sees a screenful of Symbol with
   every other column pushed off the right edge. Re-applying any filter drops that row and the column
   springs back — which is exactly what the owner reported on 2026-08-19, and why it looked like a
   render bug rather than one row of data.
   Wrapping rather than ellipsis: a truncated ticker is not identifiable, and this is the column the
   reader uses to identify the row. Set on `.gtbl` rather than `#sme-table` because the hazard is the
   shared sticky+nowrap pair, not this table — any gtbl with one long first cell has it. */
.gtbl td:first-child{max-width:22ch;white-space:normal;overflow-wrap:anywhere;}
.gtbl th:first-child{z-index:5;background:var(--g100);}
/* visual partition between predicted / actual column groups */
.gtbl .grpsep{border-left:2px solid var(--hl);}
/* owner-grain track record: clickable owner rows that expand to their house (vehicle) detail */
.gtbl tr.ownrow{cursor:pointer;}
.gtbl tr.ownrow:hover td{color:var(--hl);}
.gtbl tr.subrow td{color:var(--mut);font-size:var(--fs-xs,11px);background:var(--g100);}
.gtbl tr.subrow td:first-child{padding-left:26px;font-style:italic;}
.rowcount{font-size:var(--fs-sm,12.5px);color:var(--mut);margin:2px 2px 10px;}
/* The grain picker on the track-record table: three buttons that behave as one control, so they sit
   in their own group with no gap rather than floating among the filters. `.toggle`/`.toggle.active`
   already carry the look — this only says "these three are one thing". */
.pickgrp{display:flex;gap:0}
.pickgrp .toggle{border-radius:0;margin:0}
.pickgrp .toggle:first-child{border-radius:var(--r-sm,6px) 0 0 var(--r-sm,6px)}
.pickgrp .toggle:last-child{border-radius:0 var(--r-sm,6px) var(--r-sm,6px) 0}
.pickgrp .toggle+.toggle{border-left:none}
/* THE SELECTED GRAIN, LEGIBLE. With --bull undefined this button was white-on-white (invisible);
   with the token restored it inherited a blue link colour on green — legible but ~1.9:1. Stated
   outright here rather than left to inheritance: white on the green fill, ~4.5:1. */
.pickgrp .toggle.active{background:var(--bull);color:#fff;border-color:var(--bull)}
/* Calendar cells are text, not figures: the shared `.gtbl td` rule right-aligns everything, which
   turns a column of company names into a ragged left edge. `.tl` opts a cell back out. */
.gtbl td.tl{text-align:left}
/* NO VERTICAL SCROLLBOX (owner 2026-08-19: "remove the vertical scrolling"). `.scroll` caps its box
   at 520px and scrolls inside it — a scrollbar within a scrollbar, and on a 16-row calendar it hid
   rows for no reason. The pipeline is a short list by definition: it grows with the page instead.
   `overflow-x` stays auto so a narrow phone still scrolls the table sideways rather than the page. */
#cal-table.scroll{max-height:none;overflow-y:visible;overflow-x:auto}
/* Company cell: name on top, ticker + board underneath as one quiet line. */
#cal-table .calmeta{font-size:var(--fs-xs,11px);color:var(--mut);margin-top:2px}
/* Thesis is prose in a table — it wraps, and it is capped so one long sentence cannot push the
   dates off screen. The rest of the cells stay on one line. */
#cal-table td:nth-child(3){white-space:normal;min-width:30ch;max-width:46ch;line-height:1.4}
#cal-table td{vertical-align:top;padding-top:7px;padding-bottom:7px}
#cal-table a{color:var(--hl);text-decoration:none}
#cal-table a:hover{text-decoration:underline}
/* DAYS IS A COUNT, CENTRED (owner 2026-08-19). `.tl` left-aligns every calendar cell so company
   names do not sit ragged; a one-or-two digit countdown looks lost against that edge. Column 5. */
#cal-table td:nth-child(5),#cal-table th:nth-child(5){text-align:center}
/* THE COMPANY NAME WRAPS instead of holding the column open. `.gtbl td{white-space:nowrap}` made a
   long legal name push the Thesis column off the row — and the thesis is the reason the column is
   there. Capped so a wrapped name cannot swallow the table either. */
#cal-table td:nth-child(2){white-space:normal;min-width:18ch;max-width:26ch}
/* STATIC COLUMN WIDTHS ACROSS GRAIN SWITCHES (owner 2026-08-19: "the column width should stay
   static as columns are same"). A content-sized table re-measures itself on every render, so
   switching Lead manager -> Anchor owner -> Anchor house made the whole grid jump. `table-layout:
   fixed` sizes from the header row instead, and the name column is pinned so the numeric columns
   divide what is left evenly. The owner grain has ONE extra column (Vehicles), so it cannot be
   pixel-identical to the other two — it is stable, not identical. */
#tr-table table{table-layout:fixed;width:100%}
/* NARROW LAYOUT — THE CALENDAR BECOMES A LIST OF CARDS (owner 2026-08-19: "IPO calendar table mobile
   view can be better"). Eight columns — analyze, company, thesis, dates, days, doc, read, anchor —
   is a fair desktop table and an impossible phone one: at 375px it survived only because
   `overflow-x:auto` let the reader swipe it sideways, which means every row had to be read in two
   passes and the thesis, the reason the table exists, sat off-screen.

   Stacked, each row is one card: company first, thesis under it, then the facts as labelled lines,
   with Analyze last where an action belongs. DOM order is unchanged — `order` does the moving — so
   the sort, the header clicks and the public/internal column filter all keep working untouched.
   Labels come from `data-t`, which the renderer copies from the column header itself.

   The desktop rules this reverses are all width caps and alignments that only make sense in a grid:
   nth-child(2)/(3) hold columns open, nth-child(5) centres a countdown against a left-aligned edge.
   Each is restated here at equal specificity rather than shouted down with `!important`. */
@media (max-width:760px){
  #cal-table table,#cal-table tbody{display:block;width:100%}
  #cal-table tr:first-child{display:none}
  #cal-table tr{display:flex;flex-direction:column;padding:var(--sp-3) 0;
    border-bottom:1px solid var(--line)}
  #cal-table tr:last-child{border-bottom:0}
  #cal-table td{display:block;order:3;border:0;padding:2px 0;white-space:normal;text-align:left}
  #cal-table td[data-t]::before{content:attr(data-t);display:inline-block;min-width:10.5ch;
    font-size:var(--fs-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);
    font-weight:600}
  #cal-table td:nth-child(1){order:9;margin-top:var(--sp-2)}
  #cal-table td:nth-child(2){order:1;min-width:0;max-width:none;font-size:var(--fs-md)}
  #cal-table td:nth-child(3){order:2;min-width:0;max-width:none;color:var(--mut);
    margin-bottom:var(--sp-2)}
  #cal-table td:nth-child(5){text-align:left}
  /* the name, the thesis and the action speak for themselves — a label on them is noise */
  #cal-table td:nth-child(1)::before,#cal-table td:nth-child(2)::before,
  #cal-table td:nth-child(3)::before{display:none}
}
#tr-table th:first-child,#tr-table td:first-child{width:30%}
#tr-table td.nm{white-space:normal;overflow-wrap:anywhere}
#tr-table th,#tr-table td{overflow:hidden;text-overflow:ellipsis}
/* NARROW LAYOUT — THE TRACK RECORD SCROLLS SIDEWAYS INSTEAD OF SHRINKING (owner 2026-08-19: "table 2
   need left to right scroll as nothing is readable"). Eight or nine columns of `table-layout:fixed;
   width:100%` divide whatever they are given, so at 375px the name column got 112px and each of the
   seven figures about 37 — every cell then hit `text-overflow:ellipsis` and the table rendered as a
   grid of "Med…". A squeezed table is worse than a wide one: a reader can swipe, but cannot un-clip.

   So the phone gets the SAME table at a width its columns can actually hold, in a box that scrolls.
   This is the opposite treatment from the calendar directly above, and deliberately: the calendar is
   eight facts about ONE company, which read fine as a stacked card, while this is one metric compared
   ACROSS managers — the comparison lives in the column, so breaking the rows apart would destroy the
   only thing the table is for.

   `table-layout:fixed` is kept, so the columns are still sized from the header row and still hold
   still when the grain switches (owner 2026-08-19), which was the reason for it. Headers stop
   ellipsing here and wrap instead: at this width "Med List Gain %" fits on two lines and is legible,
   where clipped to one it is not. */
@media (max-width:760px){
  #tr-table{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #tr-table table{width:760px}
  #tr-table th:first-child,#tr-table td:first-child{width:190px}
  #tr-table th{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.25}
}

</style><style id="ipo-nav-sticky">
/* BOTH ROWS STAY PUT (owner 2026-08-18: "both should stay at top ... currently when I scroll down
   top nav goes away"). Row 1 pins to the viewport top; row 2 pins directly beneath it at --nav1-h,
   which NAV_STICKY_JS measures off the real row. A hard-coded offset is wrong the moment the row
   wraps, the type scale changes or a phone narrows it, and it fails as a gap or an overlap rather
   than as an error. The background is load-bearing, not decoration: a transparent sticky row lets
   the content scroll straight through it. */
:root{--nav1-h:44px}
.tabbar-buckets,.sitenav{position:sticky;top:0;z-index:41;background:var(--bg)}
.tabbar,.co-sub{position:sticky;top:var(--nav1-h);z-index:40;background:var(--bg)}
/* LESS AIR ABOVE AND BETWEEN (owner 2026-08-18: "lot of space above and in between second nav").
   The dashboard put 24px of body padding above row 1, each row then carried its own margin, and the
   reader met three gaps before the first word of content. The padding moves ONTO the sticky rows so
   the frozen strip keeps its breathing room while the page starts higher. */
body{padding-top:0}
.tabbar-buckets{padding-top:var(--sp-2)}
.tabbar{margin-bottom:var(--sp-3)}
.sitenav{padding-top:var(--sp-2);margin-bottom:0}
.co-sub{margin-top:0}
.wrap:has(.co-page){padding-top:0}
/* ── PHONE: THE NAV GOES TO THE BOTTOM (owner 2026-08-19) ─────────────────────────────────────────
   A thumb reaches the bottom of a phone; the top of a 6" screen is the hardest place to tap. The bar
   is fixed there, scrolls horizontally rather than wrapping (five sections will not fit across
   375px), and the page gets bottom padding equal to the bar so the last row of content is not
   sitting underneath it — a fixed bar without that padding hides content and nothing looks broken.
   The STICKY-TOP rules are explicitly undone here: an element cannot be sticky at the top and fixed
   at the bottom, and leaving both in place is how one of them silently wins. */
@media (max-width:700px){
  /* ── PHONE LAYOUT (owner 2026-08-19) ─────────────────────────────────────────────────────────
     Three parts, in the order a thumb meets them:
       1. the BRAND sits in a fixed header at the TOP — it is identity, not navigation, and it was
          riding in the bottom bar taking 127px of a 375px screen (measured), which is most of why
          that bar scrolled sideways at all;
       2. the SECTIONS sit in a fixed bar at the BOTTOM, app-style, with the SEARCH BUTTON in the
          middle of them;
       3. nothing scrolls sideways: the items share the width instead (`flex:1 1 0` + `min-width:0`),
          because a nav you have to swipe hides its own options.
     Content is padded clear of both bars — a fixed bar without that padding hides content and
     nothing looks broken. */
  .tabbar-buckets,.sitenav{
    position:fixed;top:auto;bottom:0;left:0;right:0;z-index:60;
    margin:0;padding:2px 4px;background:var(--card,#fff);
    border-top:1px solid var(--line);border-bottom:none;
    box-shadow:0 -2px 10px rgba(15,23,42,.08);
    display:flex;flex-wrap:nowrap;overflow:visible;gap:0;align-items:stretch}
  /* the brand leaves the bar and becomes the top header */
  .tabbar-buckets .sitenav-logo,.sitenav .sitenav-logo,
  .tabbar-buckets>a:first-child,.sitenav>a:first-child{
    position:fixed;top:0;left:0;right:0;height:44px;z-index:61;
    display:flex;align-items:center;gap:8px;margin:0;padding:0 12px;
    background:var(--card,#fff);border-bottom:1px solid var(--line);border-right:none;
    box-shadow:0 1px 6px rgba(15,23,42,.06)}
  /* every remaining item shares the bar equally, so nothing overflows */
  .tabbar-buckets .bkbtn,.tabbar-buckets .pagelink,.sitenav-a,.cosearch{
    flex:1 1 0;min-width:0;height:44px;padding:0 2px;
    font-size:var(--fs-xs,12px);text-align:center;justify-content:center;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  /* SEARCH IN THE MIDDLE: DOM order is [brand, section, section, ..., search], and `order` puts the
     search between the second and third section without changing the markup either shell emits. */
  .tabbar-buckets>*:nth-child(2),.sitenav>*:nth-child(2){order:10}
  .tabbar-buckets>*:nth-child(3),.sitenav>*:nth-child(3){order:20}
  /* specificity: the nth-child rules below are (0,2,0) and a bare `.cosearch` is (0,1,0), so the
     search kept landing at the END with order:50. Matched depth, so the middle wins. */
  .tabbar-buckets .cosearch,.sitenav .cosearch{order:25;flex:0 0 56px}
  /* EVERY site-nav link is a fingertip target, not only the ones on `.wide` pages. SHELL_CSS states
     `height:40px` under `.wrap.wide .sitenav-a` — settled after three attempts to make a button and
     a link agree — so /about/, which is a reading page and not `.wide`, kept 17px links in the
     bottom bar. Stated here, inside the phone media query, so the desktop geometry that took those
     three attempts is left exactly as it is. */
  .sitenav-a{min-height:40px;display:inline-flex;align-items:center;justify-content:center}
  .tabbar-buckets>*:nth-child(4),.sitenav>*:nth-child(4){order:30}
  .tabbar-buckets>*:nth-child(5),.sitenav>*:nth-child(5){order:40}
  .tabbar-buckets>*:nth-child(6),.sitenav>*:nth-child(6){order:50}
  /* row 2 (the dashboard's tab row) sits DIRECTLY BELOW the top header, and content below that.
     Before this the page started at y=0 and text ran underneath the header. */
  .tabbar{position:sticky;top:44px;z-index:55;background:var(--bg);margin:0}
  body{padding-top:44px;padding-bottom:52px}
  .wrap.wide{padding-top:44px;padding-bottom:52px}
  .wrap.wide .sitenav,.wrap .sitenav{margin:0}
}

/* the brand name is an <h1> on public pages (it carries the page's entity name for search), so it
   must be reset out of the shell's h1 sizing and sit inline in the bar */
.sitenav-name{font-family:'Outfit',sans-serif;font-weight:600;font-size:var(--fs-md);
  color:var(--txt);white-space:nowrap;margin:0;line-height:1;letter-spacing:0}

.sitenav-a:focus-visible{outline:2px solid var(--hl);outline-offset:2px;border-radius:var(--r-sm)}
/* PHONE: the nav is chrome, not content. Five sections plus a search box wrapped onto FOUR rows and
   took 130px of a 844px screen before a reader saw anything (measured 2026-08-17). One row that
   scrolls sideways instead — the sections stay reachable, the page starts near the top. Placed here,

}

<script>

const DASH='<span class="subtle">\u2013</span>';
function numv(v){return (v==null||v==='')?null:(+v);}
function f2(v){return (v==null||isNaN(v))?DASH:(+v).toFixed(2);}
function f0(v){return (v==null||isNaN(v))?DASH:Math.round(+v).toLocaleString('en-IN');}
function clsv(v){return v==null?'':(v>0?'pos':(v<0?'neg':''));}

// ===== IPO Analysis (Goal 1) =====
// Phase-2 split: the ~1 MB row array is no longer inline — `sme-data` holds a pointer to
// data/sme.json and we fetch it on the FIRST activation of this tab (same pattern as Concall and the
// Momentum-2 stage history). `SME` stays a mutable binding in this closure, so every function below
// reads the rows through it exactly as before; only the moment they arrive has changed.
let SME=[];
let SMECFG={}; try{SMECFG=JSON.parse(document.getElementById('sme-data').textContent||'{}');}catch(e){}
/* Days, not sessions: master's ATH snapshot reports days_since_ath in CALENDAR days. 21 days is
   the same screen the old `<15 sessions` filter backed, restated in the unit the data now uses. */
const ATH_RECENT_DAYS=21;
const smeState={sort:'rfl',dir:-1,board:'ALL',exch:'ALL',heldlow:false,ath15:false};
const NUMCOLS=['mc','avt','ip','lo','lg','lc','rfl','dd','mdl','dath','r30','r90','r180'];
const PCTCOLS=['lg','rfl','dd','mdl','r30','r90','r180'];
// listing-date columns sort chronologically, not lexically. Values are "DD-MON-YYYY"
// (e.g. 22-APR-2026), occasionally numeric "DD-MM-YYYY", or '-'/'' when not yet listed.
const DATECOLS=['ld','Date Of Listing','Issue Date'];
const _MON={JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};
function dparse(s){if(!s||typeof s!=='string')return NaN;s=s.trim().toUpperCase();
  let m=s.match(/^(\d{1,2})[-\/\s]([A-Z]{3})[-\/\s](\d{4})$/);
  if(m){const mo=_MON[m[2]];return mo==null?NaN:Date.UTC(+m[3],mo,+m[1]);}
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
  if(m)return Date.UTC(+m[3],+m[2]-1,+m[1]);
  return NaN;}
function cmpKey(k,x,y,dir){const dx=dparse(x),dy=dparse(y);
  if(isNaN(dx))return 1; if(isNaN(dy))return -1; return dir*(dx-dy);}
const SCOLS=[{k:'sym',t:'Symbol'},{k:'ex',t:'Exch'},{k:'mc',t:'Mkt Cap (Cr)'},
 {k:'lc',t:'Last Close'},{k:'rfl',t:'Ret from List %'},{k:'r30',t:'30D %'},{k:'r90',t:'90D %'},{k:'r180',t:'180D %'},{k:'ld',t:'Listing'},
 {k:'lo',t:'List Open'},{k:'lg',t:'Listing Gain %'},{k:'avt',t:'Avg Val 10D (Cr)'},
 {k:'dd',t:'Drawdown %'},{k:'mdl',t:'DD From List Low %'},{k:'dath',t:'Days Since ATH'},{k:'al',t:'Above List'},{k:'lm',t:'Lead Manager'},
 {k:'co',t:'Company'},{k:'bd',t:'Board'},{k:'ip',t:'Issue'}];
function boardRows(){return SME.filter(r=>(smeState.board==='ALL'||r.bd===smeState.board)&&(smeState.exch==='ALL'||r.ex===smeState.exch));}
function smeFilters(){return {q:(document.getElementById('f-q').value||'').toLowerCase().trim(),
  al:document.getElementById('f-al').value,lm:document.getElementById('f-lm').value,
  anc:(document.getElementById('f-anc').value||'').toLowerCase().trim(),
  mc:numv(document.getElementById('f-mc').value),avt:numv(document.getElementById('f-avt').value),
  dd:numv(document.getElementById('f-dd').value),rfl:numv(document.getElementById('f-rfl').value)};}
function renderSME(){
  const fl=smeFilters();
  let rows=boardRows().filter(r=>{
    if(smeState.heldlow && !(r.mdl!=null && r.mdl>=-10))return false;
    if(smeState.ath15 && !(r.dath!=null && r.dath<ATH_RECENT_DAYS))return false;
    if(fl.q && !((r.sym||'').toLowerCase().includes(fl.q)||(r.co||'').toLowerCase().includes(fl.q)))return false;
    if(fl.al && r.al!==fl.al)return false;
    if(fl.lm && r.lm!==fl.lm)return false;
    if(fl.anc && !(((r.anc||'')+'|'+(r.own||'')).toLowerCase().includes(fl.anc)))return false;
    if(fl.mc!=null && !(r.mc!=null && r.mc>=fl.mc))return false;
    if(fl.avt!=null && !(r.avt!=null && r.avt>=fl.avt))return false;
    if(fl.dd!=null && !(r.dd!=null && r.dd>=fl.dd))return false;
    if(fl.rfl!=null && !(r.rfl!=null && r.rfl>=fl.rfl))return false;
    return true;});
  const s=smeState.sort,dir=smeState.dir;
  rows.sort((a,b)=>{let x=a[s],y=b[s];
    if(x==null||x==='')return 1; if(y==null||y==='')return -1;
    if(DATECOLS.includes(s))return cmpKey(s,x,y,dir);
    if(typeof x==='string'&&typeof y==='string')return dir*x.localeCompare(y);
    return dir*(x-y);});
  let h='<table><tr>'+SCOLS.map(c=>`<th class="sortable" data-k="${c.k}">${c.t}${smeState.sort===c.k?(dir<0?' \u25bc':' \u25b2'):''}</th>`).join('')+'</tr>';
  for(const r of rows){h+='<tr>'+SCOLS.map(c=>{const v=r[c.k];

const _sigEl=document.getElementById('signal-data');

function gcell(v,c,row){

    return `<td class="${sep.trim()}">`+DASH+'</td>';

  if(typeof v==='number'){const cls=((c.pct?clsv(v):'')+sep).trim();return `<td class="${cls}">${Number.isInteger(v)&&!c.pct?v:(+v).toFixed(2)}</td>`;}

    return st.dir*(x-y);});

  for(const row of r)h+='<tr>'+cols.map(c=>gcell(row[c.k],c,row)).join('')+'</tr>';

 {k:'Med 90D %',t:'Med 90D %',pct:1},{k:'Med 180D %',t:'Med 180D %',pct:1},

/* ---------- 1. THE LIVE CALENDAR ----------
   Rows come from `ipo_pipeline_dashboard.build_payload()`, the same builder the internal IPO

/* ---------- 2. ONE TRACK-RECORD TABLE, THREE GRAINS ----------

   shared sort key would be dropped on every switch), while search and Reliable are shared: they are
   the reader's filter, not a property of the grain. */
/* LEGAL NAMES ARE NOT LABELS (owner 2026-08-19: "lead manger name very big, strip limited or
   private limited from it"). Two rules, in order:
     1. drop a trailing "(Formerly Known as ...)" parenthetical — the owner's example was
        "Smart Horizon Capital Advisors Private Limited (Formerly Known as Shreni Capital Advisors
        Private Limited)"; handled by RULE rather than by renaming that one string, so the next
        manager to rebrand is handled too;
     2. strip the corporate suffix (Private Limited / Pvt Ltd / Limited / Ltd / LLP).
   The FULL legal name goes in the cell's title, so nothing is lost — a shortened name in a table is
   a label, and the record it came from is one hover away. The underlying value is untouched: search,
   sort and the Reliable filter all still run on the original string. */
function shortName(v){
  var s=(v==null?'':''+v).trim();

  s=s.replace(/[,\s]+(?:pvt\.?|private)?[\s.]*(?:ltd\.?|limited)\s*$/i,'');

  function load(){
    if(loaded) return; loaded=true;
    fetch('../data/index.json')
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(j){
        ALL=(j.companies||[]).map(function(c){return {s:c.s, co:c.co||''};});
        if(!ALL.length) loadErr='the company index is empty';
      })
      .catch(function(e){
        // SAY SO. This used to swallow the failure and leave ALL empty, so typing produced nothing
        // and the box looked broken rather than unable to load. The common case is the page opened
        // from the file system, where the browser blocks the fetch outright.
        ALL=[];
        loadErr = (location.protocol==='file:')
          ? 'opened from the file system — serve the folder over HTTP for search to work'
          : ('could not load the company index (' + ((e && e.message) || e) + ')');
      });
  }
  q.addEventListener('focus', load);
  q.addEventListener('input', function(){
    var t=(q.value||'').trim().toUpperCase();
    if(!t){ list.style.display='none'; list.innerHTML=''; return; }
    var hits=[], i;
    for(i=0;i<ALL.length && hits.length<=MAX;i++){
      var r=ALL[i];
      if(r.s.toUpperCase().indexOf(t)>=0 || r.co.toUpperCase().indexOf(t)>=0) hits.push(r);
    }
    // count the rest without building them: the reader needs to know the list is TRUNCATED, not that
    // these six are everything.
    var more=0;
    if(hits.length>MAX){ for(;i<ALL.length;i++){ var x=ALL[i];
        if(x.s.toUpperCase().indexOf(t)>=0 || x.co.toUpperCase().indexOf(t)>=0) more++; }
      more+=hits.length-MAX; hits=hits.slice(0,MAX); }
    if(!hits.length){
      list.innerHTML='<div class="cosmore">'+(loadErr || 'No match.')+'</div>';
      list.style.display='block'; return;
    }
    list.innerHTML=hits.map(function(r){
      return '<div class="cosr" role="option" data-cos="'+r.s+'"><span class="co">'+
             r.co.replace(/[&<>]/g,'')+'</span><span class="sy">'+r.s+'</span></div>';
    }).join('')+(more?'<div class="cosmore">+'+more+' more &mdash; keep typing</div>':'');
    list.style.display='block';
  });
  function go(sym){ if(sym) location.href='../company/?sym='+encodeURIComponent(sym); }
  list.addEventListener('click', function(e){
    var row=e.target&&e.target.closest?e.target.closest('[data-cos]'):null;
    if(row) go(row.getAttribute('data-cos'));
  });
  // Enter picks the first match, which is what a keyboard user expects after typing a ticker.
  /* KEYBOARD SELECTION (owner 2026-08-19: "I can't use keyboard down or up arrow to select and
     enter"). Enter alone took the FIRST row, so a reader who wanted the third had to reach for the
     mouse. Arrow keys move a highlight through the rows and Enter takes the highlighted one; with
     nothing highlighted Enter still takes the first, so the old muscle memory keeps working.
     `.cosr.on` is already styled (same rule as :hover), so the highlight needs no new CSS. */
  var act = -1;
  function rows(){ return Array.prototype.slice.call(list.querySelectorAll('[data-cos]')); }
  function mark(i){
    var rs = rows(); if(!rs.length){ act = -1; return; }
    act = (i + rs.length) % rs.length;
    rs.forEach(function(r,k){ r.classList.toggle('on', k === act); });
    if(rs[act].scrollIntoView) rs[act].scrollIntoView({block:'nearest'});
  }
  q.addEventListener('keydown', function(e){
    if(e.key==='ArrowDown'){ e.preventDefault(); mark(act + 1); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); mark(act - 1); return; }
    if(e.key==='Enter'){
      var rs = rows(), pick = (act >= 0 && rs[act]) || rs[0];
      if(pick){ e.preventDefault(); go(pick.getAttribute('data-cos')); } }
    if(e.key==='Escape'){ list.style.display='none'; closeSheet(); }
  });
  /* a fresh query invalidates the highlight — otherwise Enter takes row 3 of the PREVIOUS results */
  q.addEventListener('input', function(){ act = -1; });

  /* PHONE: the button opens the field as a sheet at the top of the viewport (see the CSS). */
  var box = document.getElementById('cosearch'), openBtn = document.getElementById('cos-open');
  function closeSheet(){
    if(!box) return;
    box.classList.remove('cos-open');
    if(openBtn) openBtn.setAttribute('aria-expanded','false');
    list.style.display='none';
  }
  if(openBtn) openBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var open = box.classList.toggle('cos-open');
    openBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if(open){ q.focus(); load(); } else { list.style.display='none'; }
  });
  document.addEventListener('click', function(e){
    if(!document.getElementById('cosearch').contains(e.target)){ list.style.display='none'; closeSheet(); }
  });
})();
</script><script id="nav-sticky-js">
(function(){
  /* Publish row 1's REAL height as --nav1-h so row 2 pins exactly under it. Measured, not assumed:
     the bucket row wraps at narrow widths and the standalone nav carries a logo the dashboard does
     not, so one hard-coded number is wrong on at least one of the two shells at any time. */
  var row1=document.querySelector('.tabbar-buckets')||document.querySelector('.sitenav');
  if(!row1) return;
  var apply=function(){
    var h=Math.round(row1.getBoundingClientRect().height);
    if(h>0) document.documentElement.style.setProperty('--nav1-h', h+'px');
  };
  apply();
  window.addEventListener('load', apply);
  window.addEventListener('resize', apply);
  /* The rows are REBUILT at runtime - the bucket row swaps its tab group on every bucket click, and
     the company page writes its section ribbon only once the data lands. A height measured once is
     the height of the page before any of that. */
  if(window.ResizeObserver) new ResizeObserver(apply).observe(row1);
})();
</script>
