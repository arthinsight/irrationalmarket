/* ===== ui_tokens.py — design system tokens (UI_STANDARD.md) ===== */
:root {
  --g50: #f8fafc;
  --g100: #f1f5f9;
  --g200: #e2e8f0;
  --g300: #cbd5e1;
  --g400: #94a3b8;
  --g500: #64748b;
  --g600: #475569;
  --g700: #334155;
  --g800: #1e293b;
  --g900: #0f172a;
  --good: #059669;

  --warn: #d97706;
  --warn-bg: rgba(217,119,6,.09);
  --bad: #dc2626;
  --bad-bg: rgba(220,38,38,.07);
  --info: #2563eb;
  --info-bg: rgba(37,99,235,.07);
  --hover: rgba(15,23,42,.04);
  --chip-bg: #eef2f8;
  --fs-xs: 11px;
  --fs-sm: 12.5px;
  --fs-base: 14px;
  --fs-md: 15px;
  --fs-lg: 18px;
  --fs-xl: 22px;
  --fs-2xl: 28px;
  --lh-tight: 1.25;
  --lh-base: 1.5;
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --r-sm: 6px;
  --r-md: 8px;
  --r-pill: 999px;
  --sh-1: 0 1px 2px rgba(15,23,42,.06);
  --sh-2: 0 4px 14px rgba(15,23,42,.08);
  --page-max: 1440px;
}

/* shared sub-tab ribbon — underline tabs, one component for every tab (UI_STANDARD P3) */
.u-subnav{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:var(--sp-1);
  margin:0 0 var(--sp-4);padding:var(--sp-2) 0 0;background:var(--bg);
  border-bottom:1px solid var(--line)}
.u-subnav button{appearance:none;border:none;background:none;font-family:'Inter',-apple-system,
  Segoe UI,Roboto,sans-serif;font-size:var(--fs-base);font-weight:600;color:var(--mut);
  cursor:pointer;padding:var(--sp-2) var(--sp-3);border-bottom:2px solid transparent;
  transition:var(--transition)}
.u-subnav button:hover{color:var(--txt)}
.u-subnav button.on{color:var(--hl);border-bottom-color:var(--hl)}
.u-subnav button:focus-visible{outline:2px solid var(--hl);outline-offset:2px;border-radius:var(--r-sm)}

@media (max-width: 700px) {
  .co-page table { display: block; width: max-content; max-width: 100%; overflow-x: auto; }
}
/* A COLLAPSED COLUMN THAT STILL DOES NOT FIT. `dashboard.py` has collapsed .col-2/.col-3/.col-25 to a
   single `1fr` track below 1200px for a long time, and the public build repeats it — yet Big Picture
   still dragged the page sideways on a phone (public index measured 555 wide in a 360 viewport,
   2026-08-17). The collapse was working: the track was ONE column. It was 429px wide inside a 262px
   container, because a `1fr` track cannot shrink below its item's AUTOMATIC MINIMUM SIZE, and a grid
   item's default `min-width:auto` resolves to its min-content — here a wide table's. So the fix is not
   another breakpoint or a narrower font; it is telling the track it may shrink. `minmax(0, 1fr)` plus
   `min-width:0` on the items is the whole of it, and the `.scroll` wrappers already present then do
   what they were written to do. */
@media (max-width: 1200px) {
  .col-2, .col-25, .col-3 { grid-template-columns: minmax(0, 1fr) !important; }
  .col-2 > *, .col-25 > *, .col-3 > * { min-width: 0; }
}

:root{--bg:#f8fafc;--card:rgba(255,255,255,.95);--line:rgba(15,23,42,.08);--bull:#059669;--bear:#dc2626;--side:#475569;--conflict:#d97706;--txt:#0f172a;--mut:#475569;--hl:#2563eb;}

/* shared standalone-page shell — header (name/logo, top-left), body rhythm, footer */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;font-size:var(--fs-base);
  line-height:var(--lh-base);-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:var(--sp-8) var(--sp-5) 72px}
/* WIDE PAGES. 820px is a READING measure — right for about/, wrong for a view that was a dashboard
   tab an hour ago. Measured 2026-08-19 when Announcements moved out of index.html: the same three
   sections went from 1392px wide to 780px and ~60% taller, because a `.tabpanel` is capped at
   --page-max (1440) and `.wrap` at 820. Content identical, layout squeezed - which only a
   before/after comparison catches, since every render check still passed.
   Opt-in per page (`page_shell(..., wide=True)`) rather than widening `.wrap` for everyone: about/
   and the other prose pages want the reading measure they have. */
.wrap.wide{max-width:calc(var(--page-max) + var(--sp-5) * 2)}
/* ...AND THE PROSE DEFAULTS STOP AT THE DOOR. SHELL_CSS styles `p`/`li`/`ul` for READING pages
   (about/): 68ch measure, 8px between list items, muted colour. A panel transplanted off the
   dashboard is not prose — it is a component that already sizes itself — and those rules silently
   restyled it: measured 2026-08-19, the Announcements digest's theme list came out 355px instead of
   186px and section 1 grew from 1,989px to 2,957px on IDENTICAL text (7,147 characters both sides).
   Every render check passed; only a before/after against the pre-split page showed it.
   Scoped to `.wrap.wide` because that flag marks exactly the pages that carry app panels. */
.wrap.wide p,.wrap.wide li{max-width:none;color:inherit}
.wrap.wide li{margin-bottom:0}
.wrap.wide ul{margin:0;padding-left:0}
/* ...and the panel's FIRST child starts flush with the nav. SHELL_CSS gives `h2` a 24px top margin
   for reading pages; the IPO panel opens with an <h2> and the Announcements panel with a <div>, so
   one page sat 24px lower than the other under the same nav (measured 2026-08-19: content top 112 vs
   88). Scoped to the first child so headings BETWEEN sections keep their spacing — the gap is only
   wrong where it is the first thing under the nav. */
.wrap.wide .tabpanel > :first-child{margin-top:0}
/* THE NAV IS THE SAME NAV ON EVERY SURFACE (owner 2026-08-19: "the top nav height increases and
   white space above name is more as compared when I was on Big Picture"). Measured before this rule:
   dashboard nav top=0 h=48 item=40; /ipo/ and /announcements/ top=32 h=56 item=39 — because a
   standalone page wraps its content in `.wrap`, whose 32px reading-page padding sits ABOVE the nav,
   and `.sitenav` adds a bottom pad + rule the dashboard's bucket row does not have.
   Three declarations, one per difference, so a reader moving between pages sees one bar that does
   not move. Reading pages (about/) are untouched — they are not `.wide`. */
.wrap.wide{padding-top:0}
/* margin AND padding. SHELL_CSS gives `.sitenav` a 12px bottom margin for reading pages; leaving
   it here pushed app-page content to y=60 against the dashboard's 48, and on the Company page
   it opened a 12px hole between the site nav and the section ribbon that pins under it. The
   Company page is not `.wide` (it has its own wrapper rule), so it is named explicitly rather
   than left to inherit a fix that does not reach it. */
.wrap.wide .sitenav,.wrap:has(.co-page) .sitenav{padding-bottom:0;border-bottom:none;margin-bottom:0}
.wrap.wide .sitenav-a{height:40px;line-height:20px;display:inline-flex;align-items:center}

/* MOVED HERE FROM NAV_STICKY_CSS 2026-08-19, in the same pass that renamed it from `.note`. It had
   been sitting in a constant the reading pages do not load: `page_shell` composes TOKENS_CSS +
   BASE_ROOT_CSS + SHELL_CSS, so /about/ carried `class="note"` with no rule defining it and its
   disclaimer — the one block on the page that is meant to stand out — rendered as plain prose. It
   went unnoticed because the class WAS defined, just in the stylesheet the dashboard loads and this
   page does not; nothing was missing anywhere a grep would look.
   A reading-page component belongs in the reading-page shell. Leaving prose and component rules in
   NAV_STICKY_CSS is what produced the six inheritance defects of 2026-08-19 in the other direction,
   where panels moved onto a page and picked up rules meant for prose. */
.callout{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--hl);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:var(--sp-4) var(--sp-5);margin:var(--sp-6) 0;
  box-shadow:var(--sh-1)}
.callout h2{margin-top:0}

/* PHONE LEGIBILITY AND REACH (qa/mobile_audit M5/M7/M10, 2026-08-25).
   Desktop sizes are unchanged - every rule here is inside the phone breakpoint.

   M7 - nothing below 11px. `.eyebrow` shipped 10px and `.evidence` badges 9px, which is below the
   audit's own legibility floor and below what most people can read on a bus.
   M5 - 40px is a fingertip. `.show-more-btn` was 24px and the chart timeframe buttons 23px; both
   are ordinary buttons, not dense chips among their own kind, so they get the full floor.
   M10 - a table that overflows WHILE crushing a column to 11-15 wrapped lines is unreadable in
   both directions. Giving cells a real minimum lets the row take the width it needs and the
   wrapper scroll, which is what `.table-wrap{overflow:auto}` is already there for. */
@media(max-width:760px){
  /* Every sub-11px size in this stylesheet, raised to the floor. Listed one by one rather than with
     a blanket rule because each is a deliberate label style on desktop; only the phone size moves. */
  .eyebrow,.evidence,.title-row span,.decision-strip span,th,.kpi span,.profile-band span,
  .status,.cred-metrics span,.analysis-strip span,.call-context span,.verdict-banner span,
  .explorer-title span,.explorer-stock span,.explorer-stock small,small.row-note,
  .theme-parent,.theme-pill,.theme-pill.long,.src-title span,
  .prototype-bar b{font-size:11px}
  /* These are declared as `<parent> span{font-size:9px}` descendant rules, which outrank a
     flat `span` in this block - so match them the same way. */
  .analysis-strip span,
  .call-context span,
  .cred-metrics span,
  .decision-strip span,
  .explorer-stock span,
  .explorer-title span,
  .kpi span,
  .profile-band span,
  .theme-intel span,
  .verdict-banner span{font-size:11px}
  .evidence{padding:3px 8px}
  /* Ordinary buttons and form controls get the full 40px fingertip - they are not dense chips. */
  .show-more-btn{min-height:40px;padding:8px 14px}
  #m2-tf button,.m2tf button{min-height:40px;padding:8px 12px}
  .explorer-open{min-height:40px}
  .screen-filters input,.screen-filters select{min-height:40px}
  /* M10: a table that overflows WHILE crushing a column to 14 wrapped lines is unreadable both
     ways. `!important` because the shared mobile rules set `white-space:normal` on these same
     cells, which is what produced the wrapping; the wrapper already scrolls (`overflow:auto`), so
     letting the row take its natural width is the readable outcome. */
  .data-table th,.data-table td,.table-wrap th,.table-wrap td{
    min-width:104px;white-space:nowrap!important}
  .data-table th:first-child,.data-table td:first-child,
  .table-wrap th:first-child,.table-wrap td:first-child{min-width:150px}
}

/* Recent developments - CARD CHROME ONLY. The LIST rules (.dev-list/.dev-row/.dev-date/
   .dev-text/.dev-quant/.dev-src/.dev-more) are injected by the shared M2D library that also
   renders the rows, so both consumers get one definition. They lived here as well until
   2026-08-27 and `.dev-row` was defined FOUR times in the shipped page - harmless only while
   the two copies agreed, which is exactly the drift a shared renderer is meant to remove. */
.dev-block{margin-top:18px;padding:18px 20px;border:1px solid #dbe4ef;border-radius:10px;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.035)}.dev-head{margin:0 0 12px;font:600 15px Outfit;color:#0f172a}@media(max-width:760px){.dev-block{padding:14px 15px}}


/* BOTH ROWS STAY PUT (owner 2026-08-18: "both should stay at top ... currently when I scroll down
   top nav goes away"). Row 1 pins to the viewport top; row 2 pins directly beneath it at --nav1-h,
   which NAV_STICKY_JS measures off the real row. A hard-coded offset is wrong the moment the row
   wraps, the type scale changes or a phone narrows it, and it fails as a gap or an overlap rather
   than as an error. The background is load-bearing, not decoration: a transparent sticky row lets
   the content scroll straight through it. */
:root{--nav1-h:44px}
.tabbar-buckets,.sitenav{position:sticky;top:0;z-index:41;background:var(--bg)}
.tabbar,.co-sub{position:sticky;top:var(--nav1-h);z-index:40;background:var(--bg)}
/* LESS AIR ABOVE AND BETWEEN (owner 2026-08-18: "lot of space above and in between second nav").
   The dashboard put 24px of body padding above row 1, each row then carried its own margin, and the
   reader met three gaps before the first word of content. The padding moves ONTO the sticky rows so
   the frozen strip keeps its breathing room while the page starts higher. */
body{padding-top:0}
.tabbar-buckets{padding-top:var(--sp-2)}
.tabbar{margin-bottom:var(--sp-3)}
.sitenav{padding-top:var(--sp-2);margin-bottom:0}
.co-sub{margin-top:0}
.wrap:has(.co-page){padding-top:0}
/* ── PHONE: THE NAV GOES TO THE BOTTOM (owner 2026-08-19) ─────────────────────────────────────────
   A thumb reaches the bottom of a phone; the top of a 6" screen is the hardest place to tap. The bar
   is fixed there, scrolls horizontally rather than wrapping (five sections will not fit across
   375px), and the page gets bottom padding equal to the bar so the last row of content is not
   sitting underneath it — a fixed bar without that padding hides content and nothing looks broken.
   The STICKY-TOP rules are explicitly undone here: an element cannot be sticky at the top and fixed
   at the bottom, and leaving both in place is how one of them silently wins. */
@media (max-width:700px){
  /* ── PHONE LAYOUT (owner 2026-08-19) ─────────────────────────────────────────────────────────
     Three parts, in the order a thumb meets them:
       1. the BRAND sits in a fixed header at the TOP — it is identity, not navigation, and it was
          riding in the bottom bar taking 127px of a 375px screen (measured), which is most of why
          that bar scrolled sideways at all;
       2. the SECTIONS sit in a fixed bar at the BOTTOM, app-style, with the SEARCH BUTTON in the
          middle of them;
       3. nothing scrolls sideways: the items share the width instead (`flex:1 1 0` + `min-width:0`),
          because a nav you have to swipe hides its own options.
     Content is padded clear of both bars — a fixed bar without that padding hides content and
     nothing looks broken. */
  .tabbar-buckets,.sitenav{
    position:fixed;top:auto;bottom:0;left:0;right:0;z-index:60;
    margin:0;padding:2px 4px;background:var(--card,#fff);
    border-top:1px solid var(--line);border-bottom:none;
    box-shadow:0 -2px 10px rgba(15,23,42,.08);
    display:flex;flex-wrap:nowrap;overflow:visible;gap:0;align-items:stretch}
  /* the brand leaves the bar and becomes the top header */
  .tabbar-buckets .sitenav-logo,.sitenav .sitenav-logo,
  .tabbar-buckets>a:first-child,.sitenav>a:first-child{
    position:fixed;top:0;left:0;right:0;height:44px;z-index:61;
    display:flex;align-items:center;gap:8px;margin:0;padding:0 12px;
    background:var(--card,#fff);border-bottom:1px solid var(--line);border-right:none;
    box-shadow:0 1px 6px rgba(15,23,42,.06)}
  /* every remaining item shares the bar equally, so nothing overflows */
  .tabbar-buckets .bkbtn,.tabbar-buckets .pagelink,.sitenav-a,.cosearch{
    flex:1 1 0;min-width:0;height:44px;padding:0 2px;
    font-size:var(--fs-xs,12px);text-align:center;justify-content:center;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  /* SEARCH IN THE MIDDLE: DOM order is [brand, section, section, ..., search], and `order` puts the
     search between the second and third section without changing the markup either shell emits. */
  .tabbar-buckets>*:nth-child(2),.sitenav>*:nth-child(2){order:10}
  .tabbar-buckets>*:nth-child(3),.sitenav>*:nth-child(3){order:20}
  /* specificity: the nth-child rules below are (0,2,0) and a bare `.cosearch` is (0,1,0), so the
     search kept landing at the END with order:50. Matched depth, so the middle wins. */
  .tabbar-buckets .cosearch,.sitenav .cosearch{order:25;flex:0 0 56px}
  /* EVERY site-nav link is a fingertip target, not only the ones on `.wide` pages. SHELL_CSS states
     `height:40px` under `.wrap.wide .sitenav-a` — settled after three attempts to make a button and
     a link agree — so /about/, which is a reading page and not `.wide`, kept 17px links in the
     bottom bar. Stated here, inside the phone media query, so the desktop geometry that took those
     three attempts is left exactly as it is. */
  .sitenav-a{min-height:40px;display:inline-flex;align-items:center;justify-content:center}
  .tabbar-buckets>*:nth-child(4),.sitenav>*:nth-child(4){order:30}
  .tabbar-buckets>*:nth-child(5),.sitenav>*:nth-child(5){order:40}
  .tabbar-buckets>*:nth-child(6),.sitenav>*:nth-child(6){order:50}
  /* row 2 (the dashboard's tab row) sits DIRECTLY BELOW the top header, and content below that.
     Before this the page started at y=0 and text ran underneath the header. */
  .tabbar{position:sticky;top:44px;z-index:55;background:var(--bg);margin:0}
  body{padding-top:44px;padding-bottom:52px}
  .wrap.wide{padding-top:44px;padding-bottom:52px}
  .wrap.wide .sitenav,.wrap .sitenav{margin:0}
}

h1,h2{font-family:'Outfit',sans-serif;color:var(--txt);margin:0}
header{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-8)}

/* RENAMED FROM `.note` 2026-08-19. This is the reading-page CALLOUT — a bordered, padded box with
   a shadow — and the panels use `.note` for the opposite thing: a small muted inline label. That
   collision is invisible on the dashboard, which never loads this stylesheet, and lands the moment a
   panel moves to a standalone page: on /announcements/ the two-word label "Mcap RScr" rendered as a
   callout box, 108x51px with 16px/20px of padding, and the pair of market-cap inputs it sits with
   cost 147px of a 720px phone screen. Same root cause as the six bare-tag defects of 2026-08-19,
   one level up: a CLASS name, so the pending `.prose` scoping would not have caught it either.
   Renaming rather than scoping because the callout had exactly ONE user in the repo (the About
   page's disclaimer) against seven for the label — the rare meaning is the one that should move. */
footer{margin-top:var(--sp-8);padding-top:var(--sp-4);border-top:1px solid var(--line);
  font-size:var(--fs-sm);color:var(--mut)}
a{color:var(--hl)}
a:focus-visible{outline:2px solid var(--hl);outline-offset:2px;border-radius:var(--r-sm)}
/* the site nav — links back into the dashboard from a standalone page. Defined HERE, with the rest
   of the shell, because standalone pages never load the dashboard's bucket stylesheet: putting it
   there rendered a correct nav as unstyled links, which the presence check happily passed. */
.sitenav{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-1);margin:0 0 var(--sp-3);
  padding-bottom:var(--sp-2);border-bottom:1px solid var(--line)}
.sitenav-logo{display:flex;align-items:center;gap:var(--sp-2);text-decoration:none;
  padding:0 var(--sp-3) 0 0;margin-right:var(--sp-2);border-right:1px solid var(--line)}
/* the brand name is an <h1> on public pages (it carries the page's entity name for search), so it
   must be reset out of the shell's h1 sizing and sit inline in the bar */
.sitenav-name{font-family:'Outfit',sans-serif;font-weight:600;font-size:var(--fs-md);
  color:var(--txt);white-space:nowrap;margin:0;line-height:1;letter-spacing:0}
.sitenav-logo img{width:28px;height:28px;object-fit:contain;border-radius:var(--r-sm);display:block}
.sitenav-a{font-size:var(--fs-base);font-weight:600;color:var(--mut);text-decoration:none;
  padding:var(--sp-2) var(--sp-3);border-bottom:2px solid transparent}
.sitenav-a:hover{color:var(--txt)}
.sitenav-a:focus-visible{outline:2px solid var(--hl);outline-offset:2px;border-radius:var(--r-sm)}
/* PHONE: the nav is chrome, not content. Five sections plus a search box wrapped onto FOUR rows and
   took 130px of a 844px screen before a reader saw anything (measured 2026-08-17). One row that
   scrolls sideways instead — the sections stay reachable, the page starts near the top. Placed here,
   after `.sitenav`'s own `flex-wrap:wrap`, because an equal-specificity rule emitted earlier loses. */
@media (max-width:700px){
  .sitenav{flex-wrap:nowrap;overflow-x:auto;gap:0;-webkit-overflow-scrolling:touch}
  .sitenav-a{padding:var(--sp-2);white-space:nowrap}
  .sitenav-logo{padding-right:var(--sp-2);margin-right:var(--sp-1)}
  .cosearch{flex:0 0 auto;margin-left:var(--sp-2)}
  .cosearch input{width:8.5rem}
}

<body>
<header class="site-header"><nav class="public-company-nav nav" aria-label="Primary navigation"><a class="brand" href="../../index.html"><span class="brand-mark">A</span><span>Arth Insight</span></a><div class="nav-links"><a href="../../index.html">Home</a><a href="../bigpicture/">Big Picture</a><a href="../feed/">Feed</a><a href="../ipo/">IPO Intelligence</a><a href="../screens/">Screens</a></div></nav></header>
<div class="wrap wide"><nav class="co-sub" aria-label="Screens"><a class="co-sub-a" href="../../screens/momentum/">Momentum</a><a class="co-sub-a" href="../../screens/investing/">Investing</a><a class="co-sub-a active" href="../../screens/new-listing/" aria-current="page">New Listing</a></nav>


<section class="screen-top" id="screen-top">
  <h2>Recent listings</h2>
  <div class="screen-filters" id="nl-filters">
    <label>Exchange<span class="seg" id="f-exch">
      <button class="segbtn on" data-exch="ALL">All</button>
      <button class="segbtn" data-exch="NSE">NSE</button>
      <button class="segbtn" data-exch="BSE">BSE</button></span></label>
    <label>Board<span class="seg" id="f-board">
      <button class="segbtn on" data-board="ALL">All</button>
      <button class="segbtn" data-board="Mainboard">Mainboard</button>
      <button class="segbtn" data-board="SME">SME</button></span></label>
    <label>Search<input id="f-q" type="search" placeholder="Symbol or company"></label>
    <label>Above listing<select id="f-al"><option value="">All</option>
      <option value="Yes" selected>Yes</option><option value="No">No</option></select></label>
    <label>Lead manager<select id="f-lm"><option value="">All</option></select></label>
    <label>Anchor<select id="f-anc"><option value="">All</option></select></label>
    <label>Min mkt cap (&#8377;cr)<input id="f-mc" type="number" step="1" min="0"></label>
    <label>Min avg val 10D (&#8377;cr)<input id="f-avt" type="number" step="0.1" min="0"></label>
    <label>Min drawdown %<input id="f-dd" type="number" step="1"></label>
    <label>Min ret-from-listing %<input id="f-rfl" type="number" step="1"></label>
    <button class="toggle" id="f-heldlow" title="Never dipped more than 10% below the listing-day low price">Held above list low</button>
    <button class="toggle" id="f-ath15" title="Made its all-time high within the last 21 calendar days">ATH in 21 days</button>
    <button class="toggle" id="f-reset">Reset</button>
    <span class="screen-count" id="f-count"></span>
  </div>
  <div class="screen-scroll"><table><thead><tr id="nl-head"></tr></thead>
    <tbody id="screen-listings"><tr><td>Loading&hellip;</td></tr></tbody></table></div>
</section>
<script>
(function(){
  var UP='../../',ROWS=[];
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
  /* Columns and filters are the OLD TAB's, not a reduced set (owner 2026-08-25: "I need all the
     filters as is above table in old tab and with columns in table"). SCOLS below is
     sme_dashboard's own column list, in its order; the filter row is its `#f-*` controls.
     `Above listing` defaults to "Yes" exactly as the tab ships it. */
  var SCOLS=[['sym','Symbol'],['ex','Exch'],['mc','Mkt Cap (Cr)'],['lc','Last Close'],
    ['rfl','Ret from List %'],['r30','30D %'],['r90','90D %'],['r180','180D %'],['ld','Listing'],
    ['lo','List Open'],['lg','Listing Gain %'],['avt','Avg Val 10D (Cr)'],['dd','Drawdown %'],
    ['mdl','DD From List Low %'],['dath','Days Since ATH'],['al','Above List'],
    ['lm','Lead Manager'],['co','Company'],['bd','Board'],['ip','Issue']];
  var PCT={rfl:1,r30:1,r90:1,r180:1,lg:1,dd:1,mdl:1};
  var NUM={mc:1,avt:1,ip:1,lo:1,lc:1,dath:1};
  var state={exch:'ALL',board:'ALL',heldlow:false,ath15:false};
  function num(v){var n=Number(v);return isNaN(n)?null:n;}
  function cell(k,r){
    var v=r[k];
    if(v===null||v===undefined||v==='')return '&mdash;';
    if(PCT[k]){var n=num(v);return n===null?esc(v):'<span class="'+(n>0?'pos':n<0?'neg':'')+'">'+n.toFixed(1)+'%</span>';}
    if(NUM[k]){var m=num(v);return m===null?esc(v):esc(m.toLocaleString('en-IN',{maximumFractionDigits:2}));}
    return esc(v);
  }
  function val(id){var e=document.getElementById(id);return e?e.value:'';}
  function minOK(v,id){var t=num(val(id));return t===null||t===undefined||val(id)===''?true:(num(v)!==null&&num(v)>=t);}
  function apply(){
    var q=String(val('f-q')||'').toUpperCase(),al=val('f-al'),lm=val('f-lm'),anc=val('f-anc');
    var out=ROWS.filter(function(r){
      if(state.exch!=='ALL'&&String(r.ex||'')!==state.exch)return false;
      if(state.board!=='ALL'&&String(r.bd||'')!==state.board)return false;
      if(q&&(String(r.sym||'')+' '+String(r.co||'')).toUpperCase().indexOf(q)<0)return false;
      if(al&&String(r.al||'')!==al)return false;
      if(lm&&String(r.lm||'')!==lm)return false;
      if(anc&&String(r.anc||'')!==anc)return false;
      if(!minOK(r.mc,'f-mc'))return false;
      if(!minOK(r.avt,'f-avt'))return false;
      if(!minOK(r.dd,'f-dd'))return false;
      if(!minOK(r.rfl,'f-rfl'))return false;
      if(state.heldlow&&!(num(r.mdl)!==null&&num(r.mdl)>=-10))return false;
      if(state.ath15&&!(num(r.dath)!==null&&num(r.dath)<=21))return false;
      return true;});
    document.getElementById('f-count').textContent=out.length+' of '+ROWS.length+' listings';
    document.getElementById('screen-listings').innerHTML=out.length?out.slice(0,200).map(function(r){
      return '<tr>'+SCOLS.map(function(c,i){
        return '<td>'+(i===0?'<a href="?sym='+encodeURIComponent(r.sym)+'">'+esc(r.sym)+'</a>':cell(c[0],r))+'</td>';
      }).join('')+'</tr>';}).join('')
      :'<tr><td colspan="'+SCOLS.length+'">No listings match these filters.</td></tr>';
    // Any active filter narrows the stock list too; "no filter" restores it rather than leaving it stuck.
    var any=state.exch!=='ALL'||state.board!=='ALL'||q||al||lm||anc||state.heldlow||state.ath15||
            val('f-mc')||val('f-avt')||val('f-dd')||val('f-rfl');
    if(typeof window.__EXPLORER_FILTER__==='function')
      window.__EXPLORER_FILTER__(any?out.map(function(r){return r.sym;}):null);
  }
  function seg(id,key){
    var box=document.getElementById(id);if(!box)return;
    box.addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b)return;
      [].forEach.call(box.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b);});
      state[key]=b.dataset[key==='exch'?'exch':'board'];apply();});
  }
  function uniq(f){var s={};ROWS.forEach(function(r){if(r[f])s[String(r[f])]=1;});return Object.keys(s).sort();}
  function fill(id,vals){var sel=document.getElementById(id);
    vals.forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o);});}
  document.getElementById('nl-head').innerHTML=SCOLS.map(function(c){return '<th>'+esc(c[1])+'</th>';}).join('');
  fetch(UP+'data/sme.json').then(function(r){return r.json();}).then(function(rows){
    ROWS=rows||[];
    fill('f-lm',uniq('lm'));fill('f-anc',uniq('anc'));
    seg('f-exch','exch');seg('f-board','board');
    ['f-q','f-al','f-lm','f-anc','f-mc','f-avt','f-dd','f-rfl'].forEach(function(id){
      var e=document.getElementById(id);if(e)e.addEventListener(e.tagName==='INPUT'?'input':'change',apply);});
    ['f-heldlow','f-ath15'].forEach(function(id){
      document.getElementById(id).addEventListener('click',function(){
        var k=id==='f-heldlow'?'heldlow':'ath15';
        state[k]=!state[k];this.classList.toggle('on',state[k]);apply();});});
    document.getElementById('f-reset').addEventListener('click',function(){
      ['f-q','f-lm','f-anc','f-mc','f-avt','f-dd','f-rfl'].forEach(function(id){document.getElementById(id).value='';});
      document.getElementById('f-al').value='Yes';
      state={exch:'ALL',board:'ALL',heldlow:false,ath15:false};
      [].forEach.call(document.querySelectorAll('#f-exch button,#f-board button'),function(b){
        b.classList.toggle('on',b.dataset.exch==='ALL'||b.dataset.board==='ALL');});
      [].forEach.call(document.querySelectorAll('#f-heldlow,#f-ath15'),function(b){b.classList.remove('on');});
      apply();});
    apply();

<script>
if(!window.M2D){window.M2D=(function(){
  const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // strength colour cue for the (already-relabelled) signal labels — visual ranking, no buy/sell words
  const SIGCLS={'Stage-1 Breakout':'sig-strong','New High':'sig-pos','VCP Pivot':'sig-pos','MA Pullback':'sig-pos','Breakdown':'sig-neg','Distribution':'sig-neg','Topping':'sig-warn','Advancing (S2)':'sig-mut','Entered Stage 2':'sig-strong','Repeat':'sig-mut'};
  const sigSpan=s=>s?`<span class="${SIGCLS[s]||''}">${esc(s)}</span>`:'<span class="dis">—</span>';
  // Stage-2 entry day: duration==1 while "Advancing (S2)" means it JUST entered Stage 2 -> show "Entered Stage 2".
  const sigCell=(sig,dur)=>sigSpan((sig==='Advancing (S2)'&&Number(dur)===1)?'Entered Stage 2':sig);
  // readable category labels (display only — raw value kept for the default filter / _is_default)
  const CAT_LABEL={'agg accumulation':'Accumulating','agg and double':'Accumulating + Doubled','doubled':'Doubled','first time':'New'};
  const catLabel=c=>CAT_LABEL[c]||c||'';
  const STG={1:'1 · Basing',2:'2 · Advancing',3:'3 · Top',4:'4 · Decline'};
  const stg=g=>g==null?'<span class="stg stg0">No data</span>':`<span class="stg stg${g}">${esc(STG[g]||g)}</span>`;
  const f=(v,d)=>v==null?'—':(d!=null?Number(v).toFixed(d):v);
  const pc=v=>v==null?'<span style="color:var(--mut)">—</span>':`<span class="${v<0?'neg':'pos'}">${Number(v).toFixed(1)}%</span>`;
  const chips=(s,cls)=>(s||'').split(/[;,]/).map(x=>x.trim()).filter(Boolean).map(x=>`<span class="chip ${cls||''}">${esc(x)}</span>`).join('');
  let cur=null, tf=1;
  // State the lib OWNS. `STK`/`META`/`DATADIR`/`HIST` are injected by whoever hosts it: the tab
  // passes its inline members and the bulk history it already fetches; the Company page passes an
  // empty member list and its own relative data dir. Everything else (the price and company caches)
  // belongs to the renderers and is private, so two hosts cannot corrupt each other's cache.
  let STK=[], META={}, DATADIR='data', HIST={}, histLoaded=false;
  const PRICE={};
  const fileOf=s=>String(s).toUpperCase().replace(/[^A-Za-z0-9_.-]/g,'_')+'.json';

  // ---- insights ----
  function insights(r){
    const I=r.ins||{};
    const ST=I.st||[];
    if(!I.has && !ST.length) return '<div class="m2note">No theme or concall coverage for this stock.</div>';
    let h='';
    if(I.has){
      h+=`<div class="m2thesis">${I.thesis?esc(I.thesis):'<span class="m2note">No one-line thesis on record.</span>'}</div>`;
      h+=`<div>${chips(I.sec)}${chips(I.layer)}${chips(I.cluster)}</div>`;
      if(I.co) h+=`<div class="m2note">${esc(I.co)}${I.q?' · '+esc(I.q):''}${I.cd?' · call '+esc(I.cd):''}</div>`;
    }
    if(ST.length){
      const byT={}; ST.forEach(x=>{(byT[x.theme]=byT[x.theme]||[]).push(x);});
      h+='<div class="m2ins-blk"><div class="hd">Themes &amp; need of the hour</div>';
      Object.keys(byT).forEach(t=>{
        h+=`<div class="m2thm"><b>${esc(t)}</b></div>`;
        byT[t].forEach(s=>{const gen=(s.status==='Unthemed');
          h+=`<div class="m2ins-row">${(!gen&&s.tier)?'<span class="tier t'+(s.tier==='1'?'1':'2')+'">T'+esc(s.tier)+'</span>':''}<span><b>${esc(s.subtheme)}</b> ${(s.tag&&!gen)?'<span class="chip">'+esc(s.tag)+'</span>':''} ${(s.status&&!gen)?'<span class="m2note" style="display:inline">'+esc(s.status)+'</span>':''}</span></div>`;});
      });
      h+='</div>';
    }
    if((I.trig||[]).length){h+='<div class="m2ins-blk"><div class="hd">Near-term triggers</div>'+
      I.trig.map(t=>`<div class="m2ins-row">${t.im?'<span class="imp '+esc(t.im)+'">'+esc(t.im)+'</span>':''}<span><b>${esc(t.tg||t.tm)}</b> ${t.tm&&t.tg?'<span class="m2note" style="display:inline">'+esc(t.tm)+'</span>':''} ${t.cd?'<span class="chip">'+esc(t.cd)+'</span>':''}</span></div>`).join('')+'</div>';}
    return h;
  }

  // ---- key data (2-col pairs) ----
  function kv(r){
    // general stage fields (ungrouped)
    const P=[['Stage',stg(r.g)],['Stage duration (d)',r.d==null?'—':r.d],
      ['MCap latest (cr)',f(r.m,0)],['Close',f(r.cl,2)]];
    // Institution Accumulation group
    const IA=[['First Accumulation month',esc(r.fam)||'—'],['Category',esc(catLabel(r.c))],
      ['Accumulation threshold date',esc(r.atd)||'—'],['Price doubled date',esc(r.pdd)||'—'],
      ['Latest Accumulating %',f(r.a,1)+'%'],['Latest Accumulating month',esc(r.lm)||'—']];
    const rows=arr=>arr.map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
    return `<div class="m2kv">${rows(P)}</div>`+
      `<div class="m2gsec"><div class="m2gh">Institution Accumulation</div><div class="m2kv">${rows(IA)}</div></div>`;
  }

  // ---- Key data: grouped stage-analysis metrics (two-row header, one row = selected stock) ----
  const xnum=(v,d)=>{ if(v==null||v==='')return '—'; const n=Number(v); return isNaN(n)?esc(v):n.toFixed(d); };
  const xint=v=>{ if(v==null||v==='')return '—'; const n=Number(v); return isNaN(n)?esc(v):String(Math.round(n)); };
  const xpct=v=>{ if(v==null||v==='')return '—'; const n=Number(v); return isNaN(n)?esc(v):Math.round(n)+'%'; };
  const xbool=v=>{ const s=String(v==null?'':v).toLowerCase(); return s==='true'?'✓':(s==='false'||s===''?'—':esc(v)); };
  const xdate=v=>v?esc(v):'—';
  // vpe_df_60d_sum is stored ALREADY ×100 (rounded 1dp) in universe_stage_analysis.csv — display as-is at 1dp.
  // groups -> [header, [[colKey, label, formatter],...], asOfCaption?]; renders stacked (no wide table)
  const XG=[
    ['Volume / VPE',[['vpe_df_60d_sum','vol_vpe_60d Σ',v=>xnum(v,1)],['vpe_zone_cumul_df','zone_vol_vpe Σ',v=>xnum(v,2)]]],
    ['Prior Base',[['duration_from_prev_signal','Days since',xint],['pct_change_from_prev_signal','Return %',xpct],['drawdown_from_prev_signal','Drawdown %',xpct],['stage_changed_since_prev_signal','Stage changed?',xbool]],'from the latest stage-change / pivot session'],
    ['New Pivot',[['base_count','Base count',xint],['pivot_close','Pivot close',v=>xnum(v,2)],['pivot_low','Pivot low',v=>xnum(v,2)]],'from the latest stage-change / pivot session'],
  ];
  // Stacked like Key data (same .m2kv label:value grid), just grouped under sub-headers — no wide table.
  function kvExt(r){
    const sx=r.sx||{};
    return XG.map(([g,cols,cap])=>{
      let rows=cols.map(([k,lbl,fmt])=>`<div class="kv"><span class="k">${esc(lbl)}</span><span class="v">${fmt(sx[k])}</span></div>`).join('');
      // Previous-stage fields (from the row payload, not sx) live under the Volume / VPE group. Shown only when non-null.
      if(g==='Volume / VPE'){
        if(r.prev_stage!=null) rows+=`<div class="kv"><span class="k">Prev stage</span><span class="v">${xint(r.prev_stage)}</span></div>`;
        if(r.prev_zone_vpe!=null) rows+=`<div class="kv"><span class="k">Prev zone-VPE</span><span class="v">${xnum(r.prev_zone_vpe,2)}</span></div>`;
      }
      const c=cap?`<div class="m2gcap">${esc(cap)}</div>`:'';
      return `<div class="m2gsec"><div class="m2gh">${esc(g)}</div>${c}<div class="m2kv">${rows}</div></div>`;
    }).join('');
  }

  // ---- stage history table ----
  function histTbl(sym){
    // Members come from the bulk file (it is already loaded for the 30-day feed); anyone else from
    // their own per-company file, which is the only place their history exists.
    const own=COMP[sym]&&COMP[sym].hist;
    if(!HIST[sym]&&own) return histRows(own);
    if(!histLoaded) return '<div class="mmhcap">Loading stage history&hellip;</div>';
    return histRows(HIST[sym]||[]);
  }
  function histRows(src){
    const h=(src||[]).filter(x=>{            // x = [date, close, stage, dur, transition, signal]
      if(x[3]===1) return true;                             // Duration==1 (stage-change day): always include, any signal
      if(x[5]==='Advancing (S2)'||x[5]==='Repeat') return false;   // otherwise drop the continuation rows
      if(!x[5]) return false;                               // otherwise drop blank-signal rows
      return true;                                          // any other signal: keep
    });
    if(!h.length) return '<div class="mmhcap">No stage history rows (after filters).</div>';
    const rows=h.slice().reverse();
    // The window clause is dropped when the host did not supply hist_sessions, rather than printed
    // as "within last undefined" — which is what the Company page showed, because it initialises the
    // lib with an empty meta. A caption that states a number it does not have is worse than a
    // caption that says less.
    const _win = (META && META.hist_sessions) ? ` &middot; within last ${META.hist_sessions}` : '';
    let t=`<div class="mmhcap">${rows.length} sessions (all Dur=1 rows + signals, excl. Advancing (S2)/Repeat${_win})</div><div class="mmhwrap"><table class="mmhist">`+
      '<tr><th>Date</th><th>Close</th><th>Stage</th><th>Dur</th><th>Transition</th><th>Signal</th></tr>';
    for(const x of rows) t+=`<tr><td>${esc(x[0])}</td><td>${x[1]==null?'—':Number(x[1]).toFixed(2)}</td><td>${x[2]==null?'—':esc(STG[x[2]]||x[2])}</td><td>${x[3]==null?'—':x[3]}</td><td>${x[4]?esc(x[4]):'—'}</td><td>${sigCell(x[5],x[3])}</td></tr>`;
    return t+'</table></div>';
  }

  // ---- the per-company file: ONE fetch, three consumers ----
  // The picker reaches ~2,131 stocks while the inline payload carries only the 195 members, so for
  // everything else the record, its price and its stage history all come from this file. One promise
  // per symbol, cached, so selecting a stock does not fetch the same file three times.
  // DEV is separate from COMP DELIBERATELY. `fetchCompany` stores only `c.momentum` in COMP -
  // `recOf` reads `COMP[sym].stock` and depends on that shape - so the company file's OTHER
  // top-level keys are discarded on the way through. Developments live at the TOP level, so
  // they need their own slot rather than a change to COMP's contract.
  const COMP={}, COMPQ={}, DEV={};

  // ---- payload split (PAYLOAD_SPLIT_DESIGN.md), GENERATED from assemble_company.VOLATILE_PATHS ----
  // A company file is two halves: <SYM>.json (narrative — changes when research lands) and
  // <SYM>.v.json (price/stage series — a new row every trading day). Split so a day of price moves
  // stops re-storing 47 MB of unchanged narrative in the deploy repo.
  function fetchCompanyFile(DATADIR,file){
    var base=DATADIR+'/company/'+encodeURIComponent(file);
    var vol=DATADIR+'/company/'+encodeURIComponent(String(file).replace(/\.json$/,'.v.json'));
    return Promise.all([
      fetch(base).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}),
      fetch(vol).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
    ]).then(function(a){
      var b=a[0],v=a[1]; if(!v) return b;                 // pre-split or stripped: base IS the whole
      var o={}; for(var k in b)o[k]=b[k];
      if(v.momentum!==undefined)o.momentum=v.momentum;
      if(v.deepdive&&v.deepdive.px!==undefined){var s_px={},b_px=o.deepdive||{};for(var q in b_px)s_px[q]=b_px[q];s_px.px=v.deepdive.px;o.deepdive=s_px;}
      if(v.drhp&&v.drhp.grades!==undefined){var s_grades={},b_grades=o.drhp||{};for(var q in b_grades)s_grades[q]=b_grades[q];s_grades.grades=v.drhp.grades;o.drhp=s_grades;}
      return o;
    });
  }

  function fetchCompany(sym){
    if(COMP[sym]) return Promise.resolve(COMP[sym]);
    if(COMPQ[sym]) return COMPQ[sym];
    COMPQ[sym]=fetchCompanyFile(DATADIR,fileOf(sym))
      .then(c=>{const m=(c&&c.momentum)||{}; COMP[sym]=m; PRICE[sym]=m.price||[];
                DEV[sym]=((c&&c.developments&&c.developments.rows)||[]); return m;})
      .catch(e=>{delete COMPQ[sym]; throw e;});
    return COMPQ[sym];
  }
  // A record for ANY pickable symbol: members come from the inline payload, everyone else from the
  // per-company file once it has landed.
  function recOf(sym){ return STK.find(x=>x.s===sym) || (COMP[sym]&&COMP[sym].stock) || null; }

  // ---- SVG price+volume chart ----
  const yrAgo=(iso,n)=>{const y=+iso.slice(0,4),m=+iso.slice(5,7),d=+iso.slice(8,10);return new Date(y-n,m-1,d);};
  const toDate=iso=>new Date(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10));
  function chart(sym){
    const box=document.getElementById('m2-chart'), hov=document.getElementById('m2-hover');
    if(!PRICE[sym]){                                  // Phase-1 split: fetch this symbol's price on demand
      box.innerHTML='<div class="m2empty">Loading price&hellip;</div>'; hov.textContent='';
      fetchCompany(sym).then(()=>chart(sym))
        // Reader-facing: no repo paths, no run-this-command, no raw fetch error. The serving hint is
        // true only for a page opened off the file system, so it is shown only there (2026-08-15).
        .catch(()=>{box.innerHTML='<div class="m2empty">Price unavailable'+(location.protocol==='file:'?' &mdash; opened from the file system, so the browser blocks the data fetch':'')+'.</div>'; hov.textContent='';});
      return;
    }
    const all=PRICE[sym]||[];
    if(all.length<2){box.innerHTML='<div class="m2empty">No NSE price history for this symbol.</div>';hov.textContent='';return;}
    let data=all;
    if(tf>0){const cut=yrAgo(all[all.length-1][0],tf); data=all.filter(p=>toDate(p[0])>=cut); if(data.length<2)data=all.slice(-2);}
    const W=860,H=330,pL=58,pR=14,pT=12,pB=46,volH=62;
    const closes=data.map(p=>p[1]),vols=data.map(p=>p[2]);
    const cmin=Math.min(...closes),cmax=Math.max(...closes),vmax=Math.max(...vols,1),n=data.length;
    const plotB=H-pB-volH,plotT=pT;
    const X=i=>pL+(W-pL-pR)*(n<2?0:i/(n-1));
    const Y=v=>plotB-(plotB-plotT)*((v-cmin)/((cmax-cmin)||1));
    const VY=v=>(H-pB)-volH*(v/vmax);
    const fmtP=v=> v>=1000?Math.round(v).toLocaleString('en-IN'):(v>=100?v.toFixed(0):v.toFixed(1));
    const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const fmtD=iso=>MON[+iso.slice(5,7)-1]+" '"+iso.slice(2,4);
    let gr='';                                                     // gridlines + axis labels
    const NY=4;
    for(let k=0;k<=NY;k++){const v=cmin+(cmax-cmin)*k/NY,y=Y(v);
      gr+=`<line class="m2grid" x1="${pL}" y1="${y.toFixed(1)}" x2="${W-pR}" y2="${y.toFixed(1)}"/>`+
          `<text class="m2lbl" x="${pL-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${fmtP(v)}</text>`;}
    const NX=Math.min(5,n-1);
    for(let k=0;k<=NX;k++){const i=Math.round((n-1)*k/NX),x=X(i);
      gr+=`<line class="m2grid" x1="${x.toFixed(1)}" y1="${plotT}" x2="${x.toFixed(1)}" y2="${plotB}"/>`+
          `<text class="m2lbl" x="${x.toFixed(1)}" y="${H-8}" text-anchor="${k===0?'start':(k===NX?'end':'middle')}">${fmtD(data[i][0])}</text>`;}
    const line=data.map((p,i)=>X(i).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
    const bars=data.map((p,i)=>`<rect class="m2vol" x="${(X(i)-1).toFixed(1)}" y="${VY(p[2]).toFixed(1)}" width="2" height="${((H-pB)-VY(p[2])).toFixed(1)}"/>`).join('');
    box.innerHTML=`<svg viewBox="0 0 ${W} ${H}">`+gr+
      `<line class="m2axis" x1="${pL}" y1="${plotB}" x2="${W-pR}" y2="${plotB}"/>`+
      bars+`<polyline class="m2price" points="${line}"/>`+
      `<line id="m2cl" class="m2cross" x1="0" y1="${plotT}" x2="0" y2="${plotB}" style="display:none"/>`+
      `<line id="m2clh" class="m2crossh" x1="${pL}" y1="0" x2="${W-pR}" y2="0" style="display:none"/>`+
      `<circle id="m2dot" r="3.5" fill="var(--good)" stroke="var(--bg)" stroke-width="1" style="display:none"/>`+
      `<rect id="m2ov" x="${pL}" y="${plotT}" width="${W-pL-pR}" height="${(H-pB)-plotT}" fill="transparent"/></svg>`+
      `<div class="m2tip" id="m2-tip"></div>`;
    const last=data[n-1]; hov.innerHTML=`Latest ${esc(last[0])} &nbsp; <b>${last[1].toFixed(2)}</b>`;
    const svgEl=box.querySelector('svg'),ov=box.querySelector('#m2ov'),cl=box.querySelector('#m2cl'),clh=box.querySelector('#m2clh'),dot=box.querySelector('#m2dot'),tip=box.querySelector('#m2-tip');
    ov.onmousemove=e=>{const r=svgEl.getBoundingClientRect(),br=box.getBoundingClientRect();
      const fx=(e.clientX-r.left)/r.width*W; let i=Math.round((fx-pL)/((W-pL-pR)||1)*(n-1)); i=Math.max(0,Math.min(n-1,i));
      const p=data[i],gx=X(i),gy=Y(p[1]);
      cl.setAttribute('x1',gx);cl.setAttribute('x2',gx);cl.style.display='';
      clh.setAttribute('y1',gy);clh.setAttribute('y2',gy);clh.style.display='';
      dot.setAttribute('cx',gx);dot.setAttribute('cy',gy);dot.style.display='';
      const px=(gx/W)*r.width+(r.left-br.left),py=(gy/H)*r.height+(r.top-br.top);
      tip.innerHTML=`${esc(p[0])}<br><b>${p[1].toFixed(2)}</b> &middot; vol ${p[2].toLocaleString()}`;
      tip.style.display='block';
      const tw=tip.offsetWidth,th=tip.offsetHeight,below=py<th+16;
      tip.style.left=Math.max(tw/2+2,Math.min(px,r.width-tw/2-2))+'px';
      tip.style.top=(below?py+14:py-th-12)+'px';
      tip.style.transform='translateX(-50%)';};
    ov.onmouseleave=()=>{cl.style.display='none';clh.style.display='none';dot.style.display='none';tip.style.display='none';};
  }

  // ---- select ----
  // ₹cr, grouped Indian-style. Replaces the return-since-trigger that used to sit in the head —
  // that number runs to four figures on long-held names (CUPID showed 8902.1%), which says more
  // about how long ago it triggered than about the stock (owner 2026-08-15).
  function mcapCell(v){
    if(v==null||v==='') return '';
    const n=Number(v); if(!isFinite(n)) return '';
    return `<span class="mcap"><i>mcap</i>₹${Math.round(n).toLocaleString('en-IN')} cr</span>`;
  }


  // ---- Volume analysis collapsible table ----
  let DELVOL={}, delvolLoaded=false, delvolLatch=false;
  function renderVolAnalysis(sym){
    const tb=document.getElementById('m2-vol-table');
    if(!tb) return;
    if(!delvolLoaded){
      tb.innerHTML='<div class="m2empty">Loading volume analysis&hellip;</div>';
      return;
    }
    const data=DELVOL[sym]||[];
    if(!data.length){
      tb.innerHTML='<div class="m2empty">No volume analysis data for '+esc(sym)+'</div>';
      return;
    }
    const rows=data.slice().reverse();
    // No caption row and no .mmhwrap scroll box (owner 2026-08-15): the month count was restating
    // what the table shows, and an inner scroller inside an already-collapsible card gave the page
    // two nested scrolls. Same .mmhist table as Stage history, so the type matches the panes above.
    let t='<table class="mmhist">'+
      '<tr><th>Date</th><th>Volume (cr)</th><th>MCap (cr)</th><th>% MCap</th></tr>';
    for(const r of rows){
      const d=r[0];
      const vol=r[1]!=null?Number(r[1]).toFixed(1):'—';
      const mc=r[2]!=null?Number(r[2]).toFixed(0):'—';
      const pct=r[3]!=null?Number(r[3]).toFixed(2)+'%':'—';
      t+=`<tr><td>${esc(d)}</td><td>${vol}</td><td>${mc}</td><td>${pct}</td></tr>`;
    }
    tb.innerHTML=t+'</table>';
  }

  function loadDelVol(){
    if(delvolLatch) return; delvolLatch=true;
    const tb=document.getElementById('m2-vol-table');
    if(tb)tb.innerHTML='<div class="m2empty">Loading volume analysis&hellip;</div>';
    fetch(DATADIR+'/momentum2_delvol.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(d=>{ DELVOL=d||{}; delvolLoaded=true; if(cur) renderVolAnalysis(cur); })
      .catch(e=>{ delvolLatch=false;
        const m='<div class="m2empty">Volume analysis unavailable &mdash; serve the dashboard over HTTP. '+esc(e.message)+'</div>';
        if(tb)tb.innerHTML=m; });
  }

  function _set(id,h){var e=document.getElementById(id); if(e) e.innerHTML=h;}
  function select_detail(sym){
    cur=sym;
    var r=recOf(sym);
    if(!r){
      // ALREADY FETCHED AND STILL NOTHING -> STOP. Without this the retry recurses forever: no
      // record, so fetch; the fetch resolves from cache instantly; still no record, so fetch again.
      // A company file can legitimately carry research but no momentum record (it is not in the
      // stage universe), and every one of those froze the tab in a tight loop — no error, no
      // network traffic, just a page that never responds. `COMP[sym]` is set by fetchCompany even
      // when the file has no momentum section, so it is the honest "we have looked" flag.
      if(COMP[sym]){
        _set('m2-head','<span class="sym">'+esc(sym)+'</span>');
        _set('m2-insights','<div class="m2empty">No stage analysis for '+esc(sym)+
             ' &mdash; it is not in the stage universe.</div>');
        _set('m2-data',''); _set('m2-data-ext',''); _set('m2-hist','');
        _set('m2-chart',''); _set('m2-vol-table','');
        return;
      }
      _set('m2-head','<span class="sym">'+esc(sym)+'</span>');
      _set('m2-insights','<div class="m2empty">Loading&hellip;</div>');
      fetchCompany(sym).then(function(){ if(cur===sym) select_detail(sym); })
        .catch(function(e){ _set('m2-insights','<div class="m2empty">No data for '+esc(sym)+
                                 ' &mdash; '+esc((e&&e.message)||e)+'</div>'); });
      return;
    }
    _set('m2-head','<span class="sym">'+esc(r.s)+'</span>'+stg(r.g)+
         (r.c?'<span class="chip">'+esc(catLabel(r.c))+'</span>':'')+mcapCell(r.m));
    _set('m2-insights',insights(r));
    _set('m2-data',kv(r));
    _set('m2-data-ext',kvExt(r));
    _set('m2-hist',histTbl(sym));
    // A symbol outside the bulk file has its history ONLY in its own company file, which arrives
    // after this render — so the first draw is necessarily provisional and something must redraw it
    // when the file lands. `chart()` already refetches for the price and redraws only the chart;
    // without this the history block kept its first answer until the reader clicked the symbol again.
    // fetchCompany dedupes on COMPQ, so this shares the request chart() makes rather than adding one.
    if(!COMP[sym]) fetchCompany(sym).then(function(){ if(cur===sym){ _set('m2-hist',histTbl(sym)); devPane(sym); } })
                                    .catch(function(){});
    renderVolAnalysis(sym);
    try{ chart(sym); }
    catch(e){ _set('m2-chart','<div class="m2empty">Chart unavailable for '+esc(sym)+'.</div>'); }
    devPane(sym);
  }

  // ── RECENT DEVELOPMENTS ─────────────────────────────────────────────────────────────────────
  // ONE implementation, TWO consumers — the Momentum tab and the standalone Company page — for the
  // same reason the rest of M2D is shared: the Company page never loads dashboard.html, and
  // publish.py strips whole tabs, so a renderer owned by the tab would vanish from the page.
  // Source: notification's polished digests, parsed by unified_intel/recent_developments.py and
  // carried on the per-company JSON that fetchCompany() already retrieves — so this costs no extra
  // request and no payload change.
  // Measured 2026-08-26: 293 of 2,653 companies carry any, median 1 row, max 5. Renders NOTHING when
  // a company has none; an empty heading reads as a broken panel, not as an honest absence.
  var DEV_SHOWN = 5, devCssDone = false;
  function devCss(){
    if (devCssDone) return; devCssDone = true;
    var st = document.createElement('style');
    st.textContent = '.dev-list{margin:0;padding:0;list-style:none;display:grid;gap:10px}'
      + '.dev-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:baseline;'
      + 'padding-bottom:10px;border-bottom:1px solid #eef2f7}'
      + '.dev-row:last-of-type{border-bottom:0;padding-bottom:0}'
      + '.dev-date{color:#64748b;font-size:10px;font-weight:800;letter-spacing:.05em;'
      + 'text-transform:uppercase;white-space:nowrap;font-variant-numeric:tabular-nums}'
      + '.dev-text{color:#334155;font-size:13px;line-height:1.55;overflow-wrap:anywhere}'
      + '.dev-text strong{color:#0f172a;font-weight:600}'
      + '.dev-quant{display:inline-block;margin-left:4px;padding:2px 7px;border-radius:999px;'
      + 'background:#eff6ff;color:#1d4ed8;font-size:10px;font-weight:700;white-space:nowrap}'
      + '.dev-src{margin-left:6px;color:#64748b;font-size:10px;font-weight:700;text-decoration:none;'
      + 'border-bottom:1px dotted #cbd5e1}.dev-src:hover{color:#2563eb}'
      + '.dev-more{margin-top:12px;padding:5px 12px;border:1px solid #e2e8f0;border-radius:999px;'
      + 'background:#f8fafc;color:#334155;font:700 11px Inter,sans-serif;cursor:pointer}'
      + '@media(max-width:760px){.dev-row{grid-template-columns:1fr;gap:3px}}';
    document.head.appendChild(st);
  }
  var DEVMON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function devDate(d){
    var m = String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? (m[3] + ' ' + DEVMON[+m[2]-1] + ' ' + m[1]) : esc(d||'');
  }
  // the digest writes markdown bold inside its prose; escape first, then render only that
  function devText(t){ return esc(String(t||'')).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); }
  function devRow(r,hidden){
    return '<li class="dev-row'+(hidden?' dev-hidden':'')+'"'+(hidden?' style="display:none"':'')+'>'
      + '<span class="dev-date">'+devDate(r.date)+'</span><span class="dev-text">'+devText(r.text)
      + (r.quant?' <span class="dev-quant">'+esc(r.quant)+'</span>':'')
      + (r.url?' <a class="dev-src" href="'+esc(r.url)+'" target="_blank" rel="noopener">filing</a>':'')
      + '</span></li>';
  }
  // Returns the LIST ONLY - the caller supplies its own heading/card chrome, because the two
  // consumers frame it differently (a .m2card on the tab, a .dev-block section on the page).
  function devList(rows){
    rows = (rows||[]).slice();
    if (!rows.length) return '';
    devCss();
    rows.sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); });
    var vis = rows.slice(0,DEV_SHOWN).map(function(r){return devRow(r,false);}).join('');
    var hid = rows.slice(DEV_SHOWN).map(function(r){return devRow(r,true);}).join('');
    // NO inline onclick: a delegated listener has no nested quoting to get wrong. The first version
    // used one and shipped a syntax error that broke the whole renderer.
    var btn = hid ? '<button class="dev-more" data-more="1">Show '+(rows.length-DEV_SHOWN)+' more</button>' : '';
    return '<ul class="dev-list">'+vis+hid+'</ul>'+btn;
  }
  function devPane(sym){
    var rows = DEV[sym] || [];
    var h = devList(rows);
    _set('m2-dev', h ? '<div class="m2sec">Recent developments</div>' + h : '');
    var card = document.getElementById('m2-dev-card');
    if (card) card.style.display = h ? '' : 'none';
  }
  if (!window.__devMoreBound) {
    window.__devMoreBound = true;
    document.addEventListener('click', function(ev){
      var b = ev.target && ev.target.closest && ev.target.closest('[data-more]');
      if (!b) return;
      var host = b.parentElement; if (!host) return;
      var hid = host.querySelectorAll('.dev-hidden'); if (!hid.length) return;
      var collapsed = hid[0].style.display === 'none';
      Array.prototype.forEach.call(hid, function(x){ x.style.display = collapsed ? 'list-item' : 'none'; });
      b.textContent = collapsed ? 'Show less' : ('Show ' + hid.length + ' more');
    });
  }

  return {init:function(o){o=o||{};STK=o.stocks||[];META=o.meta||{};DATADIR=o.datadir||'data';},
          setHist:function(h){HIST=h||{};histLoaded=true;},
          select:select_detail, chart:chart, recOf:recOf, fetchCompany:fetchCompany,
          histTbl:histTbl, renderVol:renderVolAnalysis, loadDelVol:loadDelVol,
          insights:insights, kv:kv, kvExt:kvExt, mcapCell:mcapCell,
          esc:esc, stg:stg, STG:STG, catLabel:catLabel, sigCell:sigCell, pc:pc, f:f,
          chips:chips, fileOf:fileOf, developments:devList, devPane:devPane,
          cur:function(){return cur;}, setCur:function(s){cur=s;},
          setTf:function(n){tf=n;if(cur)chart(cur);}};
})();}
</script>
<!--SCREEN-M2D-END--><script id="screen-boot">
(function(){'use strict';
var SCREEN={"sections": ["stage"], "explorer": "new", "pinExplorer": true, "datadir": "../../data", "company": "../../company/"};
window.__SCREEN__=SCREEN;
var app=document.getElementById('store-company');
function sym(){var m=/[?&]sym=([^&#]+)/.exec(location.search||'');return m?decodeURIComponent(m[1]).trim().toUpperCase():'';}
function get(url,optional){return fetch(url).then(function(r){if(!r.ok){if(optional)return {};throw new Error('HTTP '+r.status);}return r.json();});}
function merge(a,b){if(!b||typeof b!=='object')return a;Object.keys(b).forEach(function(k){if(a[k]&&b[k]&&typeof a[k]==='object'&&!Array.isArray(a[k])&&!Array.isArray(b[k]))merge(a[k],b[k]);else a[k]=b[k];});return a;}
function fail(message){app.innerHTML='<div class="pending"><b>Screen unavailable</b><p>'+message+'</p></div>';}
function runRenderer(){
  // Appending a FRESH <script> element re-executes the renderer, which re-reads #store-payload and
  // repaints #store-company. The file is cached after the first load, so a switch costs no network
  // beyond the company JSON itself.
  var script=document.createElement('script');
  script.src='../../company_renderer.js?v=c4a6ac7eed';
  document.body.appendChild(script);
}
function buildPayload(company,explorer,extra,row,selected){
  var dd=company.deepdive||{},dr=company.drhp||{},mo=company.momentum||{};
  var research=dd.s?dd:dr,peer=research.peer_panel||{};
  var marketPrice=mo.price||extra.marketFallback||[];
  var peers=(peer.peers||[]).filter(function(x){return x.s;}).map(function(x){return{symbol:x.s,name:x.name||x.s,meta:x.group||peer.industry||'Peer'};});
  return {identity:extra.identity||{symbol:selected,name:row.co||selected,sector:row.sector||''},
    credit:dd.credit||dr.credit||null,summary:extra.summary||{},products:extra.products||[],
    endMarkets:extra.endMarkets||[],report:dr.rpt||{},drhpResearch:dr,currentResearch:research,
    currentContext:extra.currentContext||{},topics:extra.topics||{},scorecard:extra.scorecard||{},
    projection:{},segments:extra.segments||[],themes:extra.themes||[],ipo:extra.ipo||{},
    wtt:dd.wtt||{},commitments:(dd.track&&dd.track.open)||dr.promises||[],peers:peer,
    market:{stock:mo.stock||null,price:marketPrice,history:mo.hist||[],classificationPending:!mo.stock},
    coverage:extra.coverage||{deepDive:!!dd.s,drhp:!!dr.s,stage:!!mo.stock},
    pageModel:extra.pageModel||{schemaVersion:'company-page/1.0',layout:'vertical',
      coverage:{stage:!!mo.stock,priceHistory:!!marketPrice.length},
      sections:mo.stock?[{id:'stage',label:'Stage Analysis',renderer:'stage',available:true,completeness:'full',sourceType:'momentum'}]:[]},
    // Recent developments - the THIRD payload builder that needs this key (company_public_page
    // and company_page are the others). The renderer's developments() reads P.developments, so a
    // page that omits it renders NOTHING with no error - which is exactly how this was missed on
    // the momentum screen after both other surfaces were working.
    developments:(company.developments&&company.developments.rows)||[],
    layout:'vertical',screenInsights:INS[selected]||null,explorer:Object.assign({},explorer,{peers:peers})};
}
// ONE path for the landing symbol AND for every later click, so the preselected first symbol
// cannot behave differently from a clicked one.
function loadSymbol(selected,index,explorer,replace){
  var row=(index.companies||[]).filter(function(x){return x.s===selected;})[0];
  if(!row)return Promise.reject(new Error('Symbol not found'));
  var file=row.file||selected+'.json',vol=String(file).replace(/\.json$/,'.v.json');
  return Promise.all([get('../../data/company/'+encodeURIComponent(file)),
                      get('../../data/company/'+encodeURIComponent(vol),true),
                      get('../../data/company_page/'+encodeURIComponent(selected)+'.json',true)])
    .then(function(parts){
      var company=merge(parts[0]||{},parts[1]||{});
      var P=buildPayload(company,explorer,parts[2]||{},row,selected);
      document.getElementById('store-payload').textContent=JSON.stringify(P)/* no </ escaping: this sets textContent, which is NOT parsed
        as HTML, so the sequence cannot close the script element. The company page escapes it
        because it INLINES the payload into markup at build time; here it never touches HTML. */;
      runRenderer();
      if(!replace&&history.pushState)history.pushState({sym:selected},'','?sym='+encodeURIComponent(selected));
    });
}
var INS={};
Promise.all([get('../../data/index.json'),get('../../data/company_explorer.json'),
             SCREEN.insights?get('../../data/'+SCREEN.insights,true):Promise.resolve({})])
.then(function(seed){
  var index=seed[0],explorer=seed[1]||{};
  /* The insights block under the company header (thesis, chips, Themes & need of the hour) is
     built from the MOMENTUM payload, because the company store's `momentum.stock` is empty for
     these symbols. Loaded once here and keyed by symbol, so a switch costs no extra fetch. */
  ((seed[2]||{}).stocks||[]).forEach(function(r){ if(r&&r.s&&r.ins)INS[String(r.s).toUpperCase()]=r.ins; });
  var list=explorer[SCREEN.explorer]||[];
  var selected=sym();
  if(!selected){
    // A STAGE-ONLY screen must land on a company that HAS a stage record. New Listing picked
    // LUMINO - a fresh listing with no momentum history - and the stage renderer threw on missing
    // data, leaving the page blank. The index already says which coverage each company has.
    var byS={},cos=index.companies||[];
    for(var j=0;j<cos.length;j++)byS[cos[j].s]=cos[j];
    var needStage=(SCREEN.sections||[]).indexOf('stage')!==-1,first='';
    for(var i=0;i<list.length;i++){
      var s=String(list[i]&&list[i].symbol||'').toUpperCase(),r=byS[s];
      if(!r)continue;
      if(!first)first=s;
      if(!needStage||(r.sections||[]).indexOf('momentum')!==-1){selected=s;break;}
    }
    if(!selected)selected=first;
  }
  if(!selected)throw new Error('empty screen');
  // The renderer asks for this by name when an explorer row is clicked.
  window.__SCREEN_SELECT__=function(s,replace){
    loadSymbol(String(s).toUpperCase(),index,explorer,replace).catch(function(){
      fail('That company could not be loaded.');
    });
  };
  return loadSymbol(selected,index,explorer,true);
})
.catch(function(e){fail(e&&e.message==='empty screen'
  ?'This screen has no stocks today.'
  :'Screen data could not load. Please try again.');});
})();
</script><script id="nav-sticky-js">
(function(){
  /* Publish row 1's REAL height as --nav1-h so row 2 pins exactly under it. Measured, not assumed:
     the bucket row wraps at narrow widths and the standalone nav carries a logo the dashboard does
     not, so one hard-coded number is wrong on at least one of the two shells at any time. */
  var row1=document.querySelector('.tabbar-buckets')||document.querySelector('.sitenav')||
           document.querySelector('.site-header');
  if(!row1) return;
  var apply=function(){
    var h=Math.round(row1.getBoundingClientRect().height);
    if(h>0) document.documentElement.style.setProperty('--nav1-h', h+'px');
  };
  apply();
  window.addEventListener('load', apply);
  window.addEventListener('resize', apply);
  /* The rows are REBUILT at runtime - the bucket row swaps its tab group on every bucket click, and
     the company page writes its section ribbon only once the data lands. A height measured once is
     the height of the page before any of that. */
  if(window.ResizeObserver) new ResizeObserver(apply).observe(row1);
})();
</script>
