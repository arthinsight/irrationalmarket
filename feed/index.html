  <style>
    :root{--bg:#f8fafc;--card:rgba(255,255,255,.96);--line:rgba(15,23,42,.08);--hl:#2563eb;--txt:#0f172a;--mut:#64748b;--g100:#f1f5f9;--g200:#e2e8f0;--g700:#334155;--good:#059669;--warn:#d97706;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--r-sm:6px;--r-md:8px;--r-pill:999px;--sh-1:0 1px 2px rgba(15,23,42,.06);--sh-2:0 4px 14px rgba(15,23,42,.08);--page-max:1440px}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(calc(100% - 40px),var(--page-max));margin:0 auto}.site-header{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(248,250,252,.92);backdrop-filter:blur(12px)}.nav{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4)}.brand{display:flex;align-items:center;gap:var(--sp-2);font:600 15px Outfit,sans-serif;letter-spacing:-.02em}.brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:var(--r-sm);background:var(--txt);color:#fff;font-size:12.5px}.nav-links{display:flex;align-items:center;gap:var(--sp-4);color:var(--mut);font-size:12.5px;font-weight:600}.nav-links a:hover,.nav-links .active{color:var(--hl)}main{padding:clamp(28px,4vw,52px) 0 64px}.mast{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp-8);align-items:end;padding-bottom:var(--sp-5);border-bottom:1px solid var(--line)}.eyebrow{margin:0 0 var(--sp-2);color:var(--hl);font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}h1{margin:0;font:600 clamp(36px,4.5vw,56px)/1.03 Outfit,sans-serif;letter-spacing:-.035em}.lede{max-width:760px;margin:var(--sp-3) 0 0;color:var(--g700);font-size:15px}.scope{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);border:1px solid #bfdbfe;border-radius:var(--r-pill);background:#eff6ff;color:var(--hl);font-size:12.5px;font-weight:70   </style>

<body>

  <main class="wrap" id="announcements">
    <header class="mast">

  <script>
  (function(){
    var frame=document.getElementById('announcements-frame'), shell=document.getElementById('feed-shell'), activeSection='annc-s1';
    function fit(){
      var d=frame.contentDocument;if(!d)return;
      var h=Math.max(900,(d.documentElement.scrollHeight||0),(d.body&&d.body.scrollHeight||0));
      frame.style.height=(h+16)+'px';
    }
    function showSection(id){
      activeSection=id;
      var d=frame.contentDocument;if(!d)return;
      ['annc-s1','annc-s2','annc-s3'].forEach(function(sectionId){var section=d.getElementById(sectionId);if(section)section.style.display=sectionId===id?'':'none';});
      var summary=d.querySelector('.annc-lede'), countId=id==='annc-s1'?'annc-c1':(id==='annc-s2'?'annc-c2':'annc-c3'), activeCount=d.getElementById(countId);
      if(summary&&activeCount){summary.style.display='';summary.textContent='Showing '+activeCount.textContent;}
      document.querySelectorAll('.feed-tab').forEach(function(tab){var on=tab.dataset.section===id;tab.classList.toggle('active',on);tab.setAttribute('aria-selected',on?'true':'false');});
      requestAnimationFrame(fit);setTimeout(fit,100);
    }
    document.querySelector('.feed-tabs').addEventListener('click',function(event){var tab=event.target.closest('[data-section]');if(tab)showSection(tab.dataset.section);});
    frame.addEventListener('load',function(){
      var d=frame.contentDocument;if(!d)return;
      var nav=d.querySelector('.sitenav'), s2=d.getElementById('annc-s2'), s3=d.getElementById('annc-s3'), foot=d.querySelector('.circ-foot');
      if(nav)nav.style.display='none';if(foot)foot.style.display='none';
      var lede=d.querySelector('.annc-lede'), count=d.getElementById('annc-c1'), built=d.getElementById('annc-built'), when=d.querySelector('.annc-when');
      if(lede)lede.textContent='';
      if(when&&built){when.textContent='Updated ';when.appendChild(built);}
      var fold=d.querySelector('#annc-s1 .annc-fold');if(fold)fold.style.display='none';
      var style=d.createElement('style');style.id='feed-v2-theme';style.textContent='body{background:#f8fafc!important;color:#0f172a!important}.wrap.wide{max-width:none!important;padding:0!important}#tab-annc{max-width:none!important}#annc .annc-bar{padding:12px 16px!important;margin:0 0 10px!important;border:1px solid rgba(15,23,42,.08);border-radius:8px;background:linear-gradient(120deg,#fff,#eff6ff);box-shadow:0 1px 2px rgba(15,23,42,.06)}#annc .annc-when{line-height:1.35}#annc .circ-card{border-color:rgba(15,23,42,.08)!important;border-radius:8px!important;background:rgba(255,255,255,.96)!important;box-shadow:0 1px 2px rgba(15,23,42,.06)!important}#annc .circ-head{padding:11px 16px!important}#annc .circ-head:first-child{background:#fff}#annc .circ-head h2{font-family:Outfit,Inter,sans-serif!important;font-size:18px!important;letter-spacing:-.02em!important}#annc .annc-n{display:none!important}#annc .annc-body{padding:16px!important}#annc .annc-cov{padding-bottom:10px;border-bottom:1px solid rgba(15,23,42,.08)}#annc .annc-h3{margin:16px 0 8px!important;color:#2563eb!important}#annc .annc-card{padding:12px 14px!important;border-color:rgba(15,23,42,.08)!important;border-left:3px solid #2563eb!important}#annc .annc-card.mq{border-left-color:#d97706!important;background:linear-gradient(90deg,rgba(217,119,6,.035),#fff 28%)!important}#annc .annc-rank{font-size:11px!important}#annc .circ-tick{font-size:14px!important;letter-spacing:.01em}#annc .annc-q{background:#eef2ff!important;color:#3730a3!important;font-weight:700!important}#annc .annc-txt{font-size:13px!important;color:#334155!important}#annc .annc-tt{font-family:Outfit,Inter,sans-serif!important;font-size:15px!important}#annc .annc-tl{gap:8px!important}#annc .annc-tl li{padding-bottom:8px;border-bottom:1px solid rgba(15,23,42,.06)}#annc .annc-tl li:last-child{border-bottom:0}#annc .circ-chip{border-radius:999px!important}#annc .circ-chip[aria-pressed=true],#annc .toggle.active{background:#eff6ff!important;color:#2563eb!important;border-color:#bfdbfe!important}#annc a{color:#2563eb!important}#annc .annc-doc{display:inline-flex!important;align-items:center!important;width:auto!important;margin-right:7px!important;padding:2px 7px!important;border:1px solid #bfdbfe!important;border-radius:999px!important;color:#2563eb!important;font-size:0!important}#annc .annc-doc:after{content:"Filing";font-size:10px;font-weight:700;letter-spacing:.02em}#annc .source-action{margin-left:8px;color:#64748b;font-size:10px;font-weight:600} @media(max-width:760px){#annc .annc-bar{padding:10px 12px!important}#annc .annc-lede{display:none}#annc .circ-head{padding:10px 12px!important}#annc .annc-body{padding:12px!important}#annc .annc-card{grid-template-columns:20px 1fr!important;padding:10px!important;gap:8px!important}#annc .annc-tl li{font-size:12.5px!important}}';d.head.appendChild(style);
      var compact=d.createElement('style');compact.textContent='#annc .annc-sec>.circ-head:first-child{display:none!important}#annc .annc-lede{color:#334155!important;font-weight:600}#annc .annc-lede .count{color:#0f172a!important} @media(max-width:760px){#annc .annc-bar{display:grid!important;grid-template-columns:1fr!important;gap:8px!important}#annc .annc-bar>div+div{margin-top:0!important}#annc .annc-pick{display:grid!important;grid-template-columns:auto minmax(0,1fr)!important;align-items:center!important}#annc .annc-pick>#annc-mcap{grid-column:1/-1!important}#annc .annc-when{margin-top:4px!important}#annc .annc-sec>.circ-head:nth-child(2){display:grid!important;gap:8px!important}#annc .circ-srch{width:100%!important;min-height:42px!important}#annc .circ-chip{min-height:34px!important;display:inline-flex!important;align-items:center!important}}';d.head.appendChild(compact);
      function cleanCount(){
        if(!count)return;
        var current=count.textContent, next=current.replace(/\s+of\s+NaN/i,'').replace(/day\(s\)/g,current.indexOf('1 day(s)')>=0?'day':'days');
        if(next!==current)count.textContent=next;
      }
      function labelSources(){
        d.querySelectorAll('#annc-movers a.circ-subj').forEach(function(a){
          if(a.querySelector('.source-action'))return;
          var label=d.createElement('span');label.className='source-action';label.textContent='View filing';a.appendChild(label);
        });
      }
      cleanCount();labelSources();
      var movers=d.getElementById('annc-movers');if(movers&&window.MutationObserver)new MutationObserver(labelSources).observe(movers,{childList:true,subtree:true});
      if(count&&window.MutationObserver)new MutationObserver(cleanCount).observe(count,{childList:true,characterData:true,subtree:true});
      ['annc-c1','annc-c2','annc-c3'].forEach(function(id){var counter=d.getElementById(id);if(counter&&window.MutationObserver)new MutationObserver(function(){showSection(activeSection);}).observe(counter,{childList:true,characterData:true,subtree:true});});
      showSection(activeSection);
      shell.classList.add('ready');fit();setTimeout(fit,250);setTimeout(fit,1000);
      if(window.ResizeObserver)new ResizeObserver(fit).observe(d.body);
    });
    window.addEventListener('resize',fit);
  }());
  </script>
