<style>
/* BOTH ROWS STAY PUT (owner 2026-08-18: "both should stay at top ... currently when I scroll down
   top nav goes away"). Row 1 pins to the viewport top; row 2 pins directly beneath it at --nav1-h,
   which NAV_STICKY_JS measures off the real row. A hard-coded offset is wrong the moment the row
   wraps, the type scale changes or a phone narrows it, and it fails as a gap or an overlap rather
   than as an error. The background is load-bearing, not decoration: a transparent sticky row lets
   the content scroll straight through it. */
:root{--nav1-h:44px}
.tabbar-buckets,.sitenav{position:sticky;top:0;z-index:41;background:var(--bg)}
.tabbar,.co-sub{position:sticky;top:var(--nav1-h);z-index:40;background:var(--bg)}
/* LESS AIR ABOVE AND BETWEEN (owner 2026-08-18: "lot of space above and in between second nav").
   The dashboard put 24px of body padding above row 1, each row then carried its own margin, and the
   reader met three gaps before the first word of content. The padding moves ONTO the sticky rows so
   the frozen strip keeps its breathing room while the page starts higher. */
body{padding-top:0}
.tabbar-buckets{padding-top:var(--sp-2)}
.tabbar{margin-bottom:var(--sp-3)}
.sitenav{padding-top:var(--sp-2);margin-bottom:0}
.co-sub{margin-top:0}
.wrap:has(.co-page){padding-top:0}
/* ── PHONE: THE NAV GOES TO THE BOTTOM (owner 2026-08-19) ─────────────────────────────────────────
   A thumb reaches the bottom of a phone; the top of a 6" screen is the hardest place to tap. The bar
   is fixed there, scrolls horizontally rather than wrapping (five sections will not fit across
   375px), and the page gets bottom padding equal to the bar so the last row of content is not
   sitting underneath it — a fixed bar without that padding hides content and nothing looks broken.
   The STICKY-TOP rules are explicitly undone here: an element cannot be sticky at the top and fixed
   at the bottom, and leaving both in place is how one of them silently wins. */
@media (max-width:700px){
  /* ── PHONE LAYOUT (owner 2026-08-19) ─────────────────────────────────────────────────────────
     Three parts, in the order a thumb meets them:
       1. the BRAND sits in a fixed header at the TOP — it is identity, not navigation, and it was
          riding in the bottom bar taking 127px of a 375px screen (measured), which is most of why
          that bar scrolled sideways at all;
       2. the SECTIONS sit in a fixed bar at the BOTTOM, app-style, with the SEARCH BUTTON in the
          middle of them;
       3. nothing scrolls sideways: the items share the width instead (`flex:1 1 0` + `min-width:0`),
          because a nav you have to swipe hides its own options.
     Content is padded clear of both bars — a fixed bar without that padding hides content and
     nothing looks broken. */
  .tabbar-buckets,.sitenav{
    position:fixed;top:auto;bottom:0;left:0;right:0;z-index:60;
    margin:0;padding:2px 4px;background:var(--card,#fff);
    border-top:1px solid var(--line);border-bottom:none;
    box-shadow:0 -2px 10px rgba(15,23,42,.08);
    display:flex;flex-wrap:nowrap;overflow:visible;gap:0;align-items:stretch}
  /* the brand leaves the bar and becomes the top header */
  .tabbar-buckets .sitenav-logo,.sitenav .sitenav-logo,
  .tabbar-buckets>a:first-child,.sitenav>a:first-child{
    position:fixed;top:0;left:0;right:0;height:44px;z-index:61;
    display:flex;align-items:center;gap:8px;margin:0;padding:0 12px;
    background:var(--card,#fff);border-bottom:1px solid var(--line);border-right:none;
    box-shadow:0 1px 6px rgba(15,23,42,.06)}
  /* every remaining item shares the bar equally, so nothing overflows */
  .tabbar-buckets .bkbtn,.tabbar-buckets .pagelink,.sitenav-a,.cosearch{
    flex:1 1 0;min-width:0;height:44px;padding:0 2px;
    font-size:var(--fs-xs,12px);text-align:center;justify-content:center;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  /* SEARCH IN THE MIDDLE: DOM order is [brand, section, section, ..., search], and `order` puts the
     search between the second and third section without changing the markup either shell emits. */
  .tabbar-buckets>*:nth-child(2),.sitenav>*:nth-child(2){order:10}
  .tabbar-buckets>*:nth-child(3),.sitenav>*:nth-child(3){order:20}
  /* specificity: the nth-child rules below are (0,2,0) and a bare `.cosearch` is (0,1,0), so the
     search kept landing at the END with order:50. Matched depth, so the middle wins. */
  .tabbar-buckets .cosearch,.sitenav .cosearch{order:25;flex:0 0 56px}
  /* EVERY site-nav link is a fingertip target, not only the ones on `.wide` pages. SHELL_CSS states
     `height:40px` under `.wrap.wide .sitenav-a` — settled after three attempts to make a button and
     a link agree — so /about/, which is a reading page and not `.wide`, kept 17px links in the
     bottom bar. Stated here, inside the phone media query, so the desktop geometry that took those
     three attempts is left exactly as it is. */
  .sitenav-a{min-height:40px;display:inline-flex;align-items:center;justify-content:center}
  .tabbar-buckets>*:nth-child(4),.sitenav>*:nth-child(4){order:30}
  .tabbar-buckets>*:nth-child(5),.sitenav>*:nth-child(5){order:40}
  .tabbar-buckets>*:nth-child(6),.sitenav>*:nth-child(6){order:50}
  /* row 2 (the dashboard's tab row) sits DIRECTLY BELOW the top header, and content below that.
     Before this the page started at y=0 and text ran underneath the header. */
  .tabbar{position:sticky;top:44px;z-index:55;background:var(--bg);margin:0}
  body{padding-top:44px;padding-bottom:52px}
  .wrap.wide{padding-top:44px;padding-bottom:52px}
  .wrap.wide .sitenav,.wrap .sitenav{margin:0}
}

/* the site nav — links back into the dashboard from a standalone page. Defined HERE, with the rest
   of the shell, because standalone pages never load the dashboard's bucket stylesheet: putting it
   there rendered a correct nav as unstyled links, which the presence check happily passed. */
.sitenav{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-1);margin:0 0 var(--sp-3);
  padding-bottom:var(--sp-2);border-bottom:1px solid var(--line)}
.sitenav-logo{display:flex;align-items:center;gap:var(--sp-2);text-decoration:none;
  padding:0 var(--sp-3) 0 0;margin-right:var(--sp-2);border-right:1px solid var(--line)}
/* the brand name is an <h1> on public pages (it carries the page's entity name for search), so it
   must be reset out of the shell's h1 sizing and sit inline in the bar */
.sitenav-name{font-family:'Outfit',sans-serif;font-weight:600;font-size:var(--fs-md);
  color:var(--txt);white-space:nowrap;margin:0;line-height:1;letter-spacing:0}
.sitenav-logo img{width:28px;height:28px;object-fit:contain;border-radius:var(--r-sm);display:block}
.sitenav-a{font-size:var(--fs-base);font-weight:600;color:var(--mut);text-decoration:none;
  padding:var(--sp-2) var(--sp-3);border-bottom:2px solid transparent}
.sitenav-a:hover{color:var(--txt)}
.sitenav-a:focus-visible{outline:2px solid var(--hl);outline-offset:2px;border-radius:var(--r-sm)}
/* PHONE: the nav is chrome, not content. Five sections plus a search box wrapped onto FOUR rows and
   took 130px of a 844px screen before a reader saw anything (measured 2026-08-17). One row that
   scrolls sideways instead — the sections stay reachable, the page starts near the top. Placed here,
   after `.sitenav`'s own `flex-wrap:wrap`, because an equal-specificity rule emitted earlier loses. */
@media (max-width:700px){
  .sitenav{flex-wrap:nowrap;overflow-x:auto;gap:0;-webkit-overflow-scrolling:touch}
  .sitenav-a{padding:var(--sp-2);white-space:nowrap}
  .sitenav-logo{padding-right:var(--sp-2);margin-right:var(--sp-1)}
  .cosearch{flex:0 0 auto;margin-left:var(--sp-2)}
  .cosearch input{width:8.5rem}
}

<body>
  <header class="site-header">
    <nav class="wrap nav" aria-label="Primary navigation">
      <a class="brand" href="index.html"><span class="brand-mark">A</span><span>Arth Insight</span></a>
      <!-- NAV LINKS AND SEARCH ARE OWNED BY `public_nav.js`, NOT BY THIS TEMPLATE (2026-08-29).
           They used to be hardcoded here, copied from `big_picture.html`. That copy is what the page
           showed whenever the script was missing — and it WAS missing, because `/feed/` was never
           added to `deploy_scoped.LOADED_BY["public_nav.js"]` when it shipped on 2026-08-20. The
           result was a header that looked almost right and was measurably wrong: the search box came
           out 177px wide at x=1243 instead of the shared 330px at x=1090, and `.public-mobile-nav`
           never existed at all. `public_nav.js` REPLACES `.nav-links` innerHTML and sizes
           `.public-header-search` itself (`flex:0 1 330px`), so a static copy here can only ever be
           dead markup that masks its own absence. `.nav-links` is left EMPTY on purpose: the script
           needs the container to fill, and an empty one degrades to no links rather than to stale
           links pointing wherever this file last said they pointed. -->
      <div class="nav-links"></div>
    </nav>
  </header>
  <main class="wrap" id="announcements">
    <header class="mast">
      <div><p class="eyebrow">Market activity</p><h1>Feed</h1></div>
    </header>
    <nav class="feed-tabs co-sub" aria-label="Feed sections" role="tablist">
      <button class="feed-tab active" type="button" role="tab" aria-selected="true" data-section="annc-s1">Announcements</button>
      <button class="feed-tab" type="button" role="tab" aria-selected="false" data-section="annc-s2">Circulars</button>
      <button class="feed-tab" type="button" role="tab" aria-selected="false" data-section="annc-s3">Upcoming</button>
    </nav>
    <div class="feed-shell" id="feed-shell"><!--ANNC-PANEL--></div>
    <footer class="feed-footer">Exchange filings and published company disclosures · For information and education only.</footer>
  </main>
  <script>
  /* SINGLE DOCUMENT (owner 2026-08-27). This page used to iframe announcements/index.html and then
     reach into `frame.contentDocument` on the iframe's `load` event to hide its nav and inject two
     stylesheets. `load` fires after the inner page has PAINTED, so a reader saw a second Arth
     Insight header and the un-restyled page for one frame — intermittently, because the gap depends
     on cache and connection. The panel is now rendered inline, the stylesheets are static, and there
     is no second document to correct after the fact. */
  (function(){
    var active='annc-s1';
    function showSection(id){
      active=id;
      ['annc-s1','annc-s2','annc-s3'].forEach(function(sid){
        var s=document.getElementById(sid); if(s) s.style.display=(sid===id?'':'none');
      });
      var summary=document.querySelector('.annc-lede'),
          cid=(id==='annc-s1')?'annc-c1':((id==='annc-s2')?'annc-c2':'annc-c3'),
          c=document.getElementById(cid);
      if(summary&&c){ summary.style.display=''; summary.textContent='Showing '+c.textContent; }
      document.querySelectorAll('.feed-tab').forEach(function(tab){
        var on=tab.dataset.section===id;
        tab.classList.toggle('active',on); tab.setAttribute('aria-selected',on?'true':'false');
      });
    }
    var tabs=document.querySelector('.feed-tabs');
    if(tabs) tabs.addEventListener('click',function(e){
      var t=e.target.closest('[data-section]'); if(t) showSection(t.dataset.section);
    });
    /* The " of NaN" scrub is kept, and it is a PLASTER over a real defect in the counter itself:
       `total` is movers.length + stats.theme_rows, and a date whose payload carries an empty stats
       object makes that NaN. Visible on /announcements/ directly, where nothing scrubs it. */
    function cleanCount(){
      var c=document.getElementById('annc-c1'); if(!c) return;
      var cur=c.textContent,
          next=cur.replace(/\s+of\s+NaN/i,'').replace(/day\(s\)/g, cur.indexOf('1 day(s)')>=0?'day':'days');
      if(next!==cur) c.textContent=next;
    }
    function labelSources(){
      document.querySelectorAll('#annc-movers a.circ-subj').forEach(function(a){
        if(a.querySelector('.source-action')) return;
        var s=document.createElement('span'); s.className='source-action'; s.textContent='View filing';
        a.appendChild(s);
      });
    }
    function liftBuilt(){
      var built=document.getElementById('annc-built'), foot=document.querySelector('.feed-footer'),
          txt=built?(built.textContent||'').trim():'';
      if(txt&&foot&&foot.dataset.asof!=='1'){
        foot.dataset.asof='1';
        foot.textContent=foot.textContent.replace(/\s*$/,'')+' · Updated '+txt;
      }
    }
    function sync(){ cleanCount(); labelSources(); liftBuilt(); showSection(active); }
    /* The panel renders ASYNCHRONOUSLY from a fetched payload, so one pass at load is not enough:
       the observers below re-run sync whenever a section counter changes. */
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',sync); else sync();
    var movers=document.getElementById('annc-movers');
    if(movers&&window.MutationObserver)
      new MutationObserver(labelSources).observe(movers,{childList:true,subtree:true});
    ['annc-c1','annc-c2','annc-c3'].forEach(function(id){
      var el=document.getElementById(id);
      if(el&&window.MutationObserver)
        new MutationObserver(sync).observe(el,{childList:true,characterData:true,subtree:true});
    });
    var shell=document.getElementById('feed-shell'); if(shell) shell.classList.add('ready');
  }());
</script>
