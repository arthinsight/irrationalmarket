/* shared sub-tab ribbon — underline tabs, one component for every tab (UI_STANDARD P3) */
.u-subnav{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:var(--sp-1);
  margin:0 0 var(--sp-4);padding:var(--sp-2) 0 0;background:var(--bg);

@media (max-width: 700px) {
  .co-page table { display: block; width: max-content; max-width: 100%; overflow-x: auto; }
}
/* A COLLAPSED COLUMN THAT STILL DOES NOT FIT. `dashboard.py` has collapsed .col-2/.col-3/.col-25 to a
   single `1fr` track below 1200px for a long time, and the public build repeats it — yet Big Picture
   still dragged the page sideways on a phone (public index measured 555 wide in a 360 viewport,
   2026-08-17). The collapse was working: the track was ONE column. It was 429px wide inside a 262px
   container, because a `1fr` track cannot shrink below its item's AUTOMATIC MINIMUM SIZE, and a grid
   item's default `min-width:auto` resolves to its min-content — here a wide table's. So the fix is not
   another breakpoint or a narrower font; it is telling the track it may shrink. `minmax(0, 1fr)` plus
   `min-width:0` on the items is the whole of it, and the `.scroll` wrappers already present then do
   what they were written to do. */
@media (max-width: 1200px) {
  .col-2, .col-25, .col-3 { grid-template-columns: minmax(0, 1fr) !important; }
  .col-2 > *, .col-25 > *, .col-3 > * { min-width: 0; }
}

:root{--bg:#f8fafc;--card:rgba(255,255,255,.95);--line:rgba(15,23,42,.08);--txt:#0f172a;--mut:#475569;--hl:#2563eb;}

/* shared standalone-page shell — header (name/logo, top-left), body rhythm, footer */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;font-size:var(--fs-base);

.wrap{max-width:820px;margin:0 auto;padding:var(--sp-8) var(--sp-5) 72px}
h1,h2{font-family:'Outfit',sans-serif;color:var(--txt);margin:0}
header{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-8)}
header img{width:44px;height:44px;object-fit:contain;border-radius:var(--r-sm)}
h1{font-size:var(--fs-2xl);line-height:var(--lh-tight);font-weight:600;letter-spacing:-.01em}
.sub{font-size:var(--fs-md);color:var(--mut);margin:var(--sp-1) 0 0}
h2{font-size:var(--fs-lg);font-weight:600;margin:var(--sp-6) 0 var(--sp-2)}
p{margin:0 0 var(--sp-3);max-width:68ch;color:var(--g700)}
ul{margin:0 0 var(--sp-3);padding-left:var(--sp-5)}
li{margin-bottom:var(--sp-2);max-width:68ch;color:var(--g700)}
strong{color:var(--txt);font-weight:600}
.note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--hl);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:var(--sp-4) var(--sp-5);margin:var(--sp-6) 0;
  box-shadow:var(--sh-1)}
.note h2{margin-top:0}
footer{margin-top:var(--sp-8);padding-top:var(--sp-4);border-top:1px solid var(--line);
  font-size:var(--fs-sm);color:var(--mut)}
a{color:var(--hl)}
a:focus-visible{outline:2px solid var(--hl);outline-offset:2px;border-radius:var(--r-sm)}
/* the site nav — links back into the dashboard from a standalone page. Defined HERE, with the rest
   of the shell, because standalone pages never load the dashboard's bucket stylesheet: putting it
   there rendered a correct nav as unstyled links, which the presence check happily passed. */
.sitenav{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-1);margin:0 0 var(--sp-3);
  padding-bottom:var(--sp-2);border-bottom:1px solid var(--line)}
.sitenav-logo{display:flex;align-items:center;gap:var(--sp-2);text-decoration:none;
  padding:0 var(--sp-3) 0 0;margin-right:var(--sp-2);border-right:1px solid var(--line)}
/* the brand name is an <h1> on public pages (it carries the page's entity name for search), so it
   must be reset out of the shell's h1 sizing and sit inline in the bar */
.sitenav-name{font-family:'Outfit',sans-serif;font-weight:600;font-size:var(--fs-md);
  color:var(--txt);white-space:nowrap;margin:0;line-height:1;letter-spacing:0}
.sitenav-logo img{width:28px;height:28px;object-fit:contain;border-radius:var(--r-sm);display:block}
.sitenav-a{font-size:var(--fs-base);font-weight:600;color:var(--mut);text-decoration:none;
  padding:var(--sp-2) var(--sp-3);border-bottom:2px solid transparent}
.sitenav-a:hover{color:var(--txt)}
.sitenav-a:focus-visible{outline:2px solid var(--hl);outline-offset:2px;border-radius:var(--r-sm)}
/* PHONE: the nav is chrome, not content. Five sections plus a search box wrapped onto FOUR rows and
   took 130px of a 844px screen before a reader saw anything (measured 2026-08-17). One row that
   scrolls sideways instead — the sections stay reachable, the page starts near the top. Placed here,
   after `.sitenav`'s own `flex-wrap:wrap`, because an equal-specificity rule emitted earlier loses. */
@media (max-width:700px){
  .sitenav{flex-wrap:nowrap;overflow-x:auto;gap:0;-webkit-overflow-scrolling:touch}
  .sitenav-a{padding:var(--sp-2);white-space:nowrap}
  .sitenav-logo{padding-right:var(--sp-2);margin-right:var(--sp-1)}
  .cosearch{flex:0 0 auto;margin-left:var(--sp-2)}
  .cosearch input{width:8.5rem}
}

   the same trick, and it is why only the IPO half of the page had the problem. */
#co-sec-ipo .ipodd-subbar{display:none}
/* ONE CHART PER PAGE (owner 2026-08-17). The deep-dive draws its own small price SVG inside the
   Summary zone; on a single running page that sits a few hundred pixels below Momentum's price+
   volume chart. Two charts of the same stock, drawn from different series and at different scales,
   ask the reader to reconcile them — and the momentum one is the fuller of the two (volume, the
   1Y/3Y/5Y/Max range, corp-action adjusted). Hidden here rather than deleted upstream: the module
   is shared, and this is a decision about THIS page's layout, not about the renderer. */
/* Hidden only when Momentum's fuller chart is actually on the page. `.co-has-stage` is set on
   the page root when M2D has a record for this company; without it the deep-dive's own SVG is
   the ONLY chart there is, and hiding it unconditionally left 272 companies (deepdive, no
   momentum) with no price chart at all and nothing drawn in its place. One chart per page
   means the BEST available one, not none. */
.co-has-stage #tab-deepdive svg.dd-chart,.co-has-stage #co-hero svg.dd-chart{display:none}
/* BOTH scopes: the chart lives in the Summary hero, and the hero is HOISTED out of #tab-deepdive
   into #co-hero on render — so a rule scoped only to the old ancestor silently stopped matching and
   the second chart came back. Moving markup moves it out of its stylesheet; that is the third time
   in one day, so both homes are named here. */
.co-miss{padding:var(--sp-8) var(--sp-4);text-align:center;color:var(--mut);font-size:var(--fs-sm)}
</style><style id="co-nav-sticky">
/* BOTH ROWS STAY PUT (owner 2026-08-18: "both should stay at top ... currently when I scroll down
   top nav goes away"). Row 1 pins to the viewport top; row 2 pins directly beneath it at --nav1-h,
   which NAV_STICKY_JS measures off the real row. A hard-coded offset is wrong the moment the row
   wraps, the type scale changes or a phone narrows it, and it fails as a gap or an overlap rather
   than as an error. The background is load-bearing, not decoration: a transparent sticky row lets
   the content scroll straight through it. */
:root{--nav1-h:44px}
.tabbar-buckets,.sitenav{position:sticky;top:0;z-index:41;background:var(--bg)}
.tabbar,.co-sub{position:sticky;top:var(--nav1-h);z-index:40;background:var(--bg)}
/* LESS AIR ABOVE AND BETWEEN (owner 2026-08-18: "lot of space above and in between second nav").
   The dashboard put 24px of body padding above row 1, each row then carried its own margin, and the
   reader met three gaps before the first word of content. The padding moves ONTO the sticky rows so
   the frozen strip keeps its breathing room while the page starts higher. */
body{padding-top:0}
.tabbar-buckets{padding-top:var(--sp-2)}
.tabbar{margin-bottom:var(--sp-3)}
.sitenav{padding-top:var(--sp-2);margin-bottom:0}
.co-sub{margin-top:0}
.wrap:has(.co-page){padding-top:0}
</style>
</head>
<body>
<div class="wrap">
<nav class="sitenav"><a class="sitenav-logo" href="../" aria-label="Arth Insight home"><img src="../icon-180.png" alt="" width="28" height="28"><h1 class="sitenav-name">Arth Insight</h1></a><a class="sitenav-a" href="../index.html?tab=tab-market">Big Picture</a><a class="sitenav-a" href="../index.html?tab=tab-annc">Announcements</a><a class="sitenav-a" href="../index.html?tab=tab-signal">IPOs</a><a class="sitenav-a" href="../index.html?tab=tab-momentum2">Universe</a><!--COS-START--><div class="cosearch" id="cosearch"><input id="cos-q" type="search" autocomplete="off" spellcheck="false" placeholder="Search for company" aria-label="Search for company"><div class="cosl" id="cos-list" role="listbox"></div></div><!--COS-END--></nav>


<div id="tab-momentum2" class="co-page">
  <!-- SUB-NAV FIRST, directly under the site nav (owner 2026-08-17). It used to sit below the hero,
       which put a row of tabs in the middle of the page and, once sticky, floated it over the
       content it had been sitting beneath. Section navigation belongs with the navigation. -->
  <div class="co-sub" id="co-sub"><!-- built from the sections that actually render --></div>
  <!-- The deep-dive's Summary hero is MOVED here on render: it is the best identity block we have
       (company name, sector, mcap, credibility, ISIN, concall vintage, thesis, ratios), and it was
       sitting below the fold while a thinner momentum head repeated the same symbol and mcap above
       it. One heading, at the top of the CONTENT. -->
  <div id="co-hero"></div>

  <section class="co-sec" id="co-sec-stage" data-co-sec="stage">
    <div id="m2-head"></div>
    <div class="m2card" id="m2-insights"></div>
    <div class="m2card">
      <div class="m2chartbar">
        <div class="m2tf" id="m2-tf"><button data-tf="1" class="active">1Y</button><button data-tf="3">3Y</button><button data-tf="5">5Y</button><button data-tf="0">Max</button></div>
        <div class="m2hover" id="m2-hover"></div>
      </div>
      <div id="m2-chart"></div>
    </div>
    <div class="m2card"><div class="m2sec">Stage analysis</div><div id="m2-data"></div>
      <div id="m2-data-ext"></div></div>
    <div class="m2card"><div class="m2sec">Stage history</div><div id="m2-hist"></div></div>
    <div class="m2card open" id="m2-vol-collapse">
      <div class="m2vol-h" id="m2-vol-h"><span class="m2vol-tw" id="m2-vol-tw">&minus;</span>
        <span class="m2sec">Volume analysis</span></div>
      <div class="m2vol-b" id="m2-vol-body"><div id="m2-vol-table"></div></div>
    </div>
  </section>

  <!-- IPO RHP sections. `#ipd-view` is the id the IPO lib renders into; `#ipd-list` is deliberately
       ABSENT, and that absence is what stops the tab's own start-up from picking a company and
       rewriting this page's URL. Hidden until the company actually has an IPO section. -->
  <section class="co-sec" id="co-sec-ipo" data-co-sec="ipo" hidden>
    <div id="ipd-view"></div>
  </section>

  <section class="co-sec" id="co-sec-research" data-co-sec="research" hidden>
    <div id="tab-deepdive">
      <div class="dd-nav" id="dd-nav"></div>
      <div id="dd-view"></div>
    </div>
  </section>

  <div class="m2disc">Technical states shown for educational purposes only &mdash; not investment
  advice. Please consult a SEBI-registered investment adviser before making investment decisions.</div>
</div>
<!--CO-M2D-START-->
<script>
if(!window.M2D){window.M2D=(function(){
  const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // strength colour cue for the (already-relabelled) signal labels — visual ranking, no buy/sell words
  const SIGCLS={'Stage-1 Breakout':'sig-strong','New High':'sig-pos','VCP Pivot':'sig-pos','MA Pullback':'sig-pos','Breakdown':'sig-neg','Distribution':'sig-neg','Topping':'sig-warn','Advancing (S2)':'sig-mut','Entered Stage 2':'sig-strong','Repeat':'sig-mut'};
  const sigSpan=s=>s?`<span class="${SIGCLS[s]||''}">${esc(s)}</span>`:'<span class="dis">—</span>';
  // Stage-2 entry day: duration==1 while "Advancing (S2)" means it JUST entered Stage 2 -> show "Entered Stage 2".
  const sigCell=(sig,dur)=>sigSpan((sig==='Advancing (S2)'&&Number(dur)===1)?'Entered Stage 2':sig);
  // readable category labels (display only — raw value kept for the default filter / _is_default)
  const CAT_LABEL={'agg accumulation':'Accumulating','agg and double':'Accumulating + Doubled','doubled':'Doubled','first time':'New'};
  const catLabel=c=>CAT_LABEL[c]||c||'';
  const STG={1:'1 · Basing',2:'2 · Advancing',3:'3 · Top',4:'4 · Decline'};
  const stg=g=>g==null?'<span class="stg stg0">No data</span>':`<span class="stg stg${g}">${esc(STG[g]||g)}</span>`;
  const f=(v,d)=>v==null?'—':(d!=null?Number(v).toFixed(d):v);
  const pc=v=>v==null?'<span style="color:var(--mut)">—</span>':`<span class="${v<0?'neg':'pos'}">${Number(v).toFixed(1)}%</span>`;
  const chips=(s,cls)=>(s||'').split(/[;,]/).map(x=>x.trim()).filter(Boolean).map(x=>`<span class="chip ${cls||''}">${esc(x)}</span>`).join('');
  let cur=null, tf=1;
  // State the lib OWNS. `STK`/`META`/`DATADIR`/`HIST` are injected by whoever hosts it: the tab
  // passes its inline members and the bulk history it already fetches; the Company page passes an
  // empty member list and its own relative data dir. Everything else (the price and company caches)
  // belongs to the renderers and is private, so two hosts cannot corrupt each other's cache.
  let STK=[], META={}, DATADIR='data', HIST={}, histLoaded=false;
  const PRICE={};
  const fileOf=s=>String(s).toUpperCase().replace(/[^A-Za-z0-9_.-]/g,'_')+'.json';

  // ---- insights ----
  function insights(r){
    const I=r.ins||{};
    const ST=I.st||[];
    if(!I.has && !ST.length) return '<div class="m2note">No theme or concall coverage for this stock.</div>';
    let h='';
    if(I.has){
      h+=`<div class="m2thesis">${I.thesis?esc(I.thesis):'<span class="m2note">No one-line thesis on record.</span>'}</div>`;
      h+=`<div>${chips(I.sec)}${chips(I.layer)}${chips(I.cluster)}</div>`;
      if(I.co) h+=`<div class="m2note">${esc(I.co)}${I.q?' · '+esc(I.q):''}${I.cd?' · call '+esc(I.cd):''}</div>`;
    }
    if(ST.length){
      const byT={}; ST.forEach(x=>{(byT[x.theme]=byT[x.theme]||[]).push(x);});
      h+='<div class="m2ins-blk"><div class="hd">Themes &amp; need of the hour</div>';
      Object.keys(byT).forEach(t=>{
        h+=`<div class="m2thm"><b>${esc(t)}</b></div>`;
        byT[t].forEach(s=>{const gen=(s.status==='Unthemed');
          h+=`<div class="m2ins-row">${(!gen&&s.tier)?'<span class="tier t'+(s.tier==='1'?'1':'2')+'">T'+esc(s.tier)+'</span>':''}<span><b>${esc(s.subtheme)}</b> ${(s.tag&&!gen)?'<span class="chip">'+esc(s.tag)+'</span>':''} ${(s.status&&!gen)?'<span class="m2note" style="display:inline">'+esc(s.status)+'</span>':''}</span></div>`;});
      });
      h+='</div>';
    }
    if((I.trig||[]).length){h+='<div class="m2ins-blk"><div class="hd">Near-term triggers</div>'+
      I.trig.map(t=>`<div class="m2ins-row">${t.im?'<span class="imp '+esc(t.im)+'">'+esc(t.im)+'</span>':''}<span><b>${esc(t.tg||t.tm)}</b> ${t.tm&&t.tg?'<span class="m2note" style="display:inline">'+esc(t.tm)+'</span>':''} ${t.cd?'<span class="chip">'+esc(t.cd)+'</span>':''}</span></div>`).join('')+'</div>';}
    return h;
  }

  // ---- key data (2-col pairs) ----
  function kv(r){
    // general stage fields (ungrouped)
    const P=[['Stage',stg(r.g)],['Stage duration (d)',r.d==null?'—':r.d],
      ['MCap latest (cr)',f(r.m,0)],['Close',f(r.cl,2)]];
    // Institution Accumulation group
    const IA=[['First Accumulation month',esc(r.fam)||'—'],['Category',esc(catLabel(r.c))],
      ['Accumulation threshold date',esc(r.atd)||'—'],['Price doubled date',esc(r.pdd)||'—'],
      ['Latest Accumulating %',f(r.a,1)+'%'],['Latest Accumulating month',esc(r.lm)||'—']];
    const rows=arr=>arr.map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
    return `<div class="m2kv">${rows(P)}</div>`+
      `<div class="m2gsec"><div class="m2gh">Institution Accumulation</div><div class="m2kv">${rows(IA)}</div></div>`;
  }

  // ---- Key data: grouped stage-analysis metrics (two-row header, one row = selected stock) ----
  const xnum=(v,d)=>{ if(v==null||v==='')return '—'; const n=Number(v); return isNaN(n)?esc(v):n.toFixed(d); };
  const xint=v=>{ if(v==null||v==='')return '—'; const n=Number(v); return isNaN(n)?esc(v):String(Math.round(n)); };
  const xpct=v=>{ if(v==null||v==='')return '—'; const n=Number(v); return isNaN(n)?esc(v):Math.round(n)+'%'; };
  const xbool=v=>{ const s=String(v==null?'':v).toLowerCase(); return s==='true'?'✓':(s==='false'||s===''?'—':esc(v)); };
  const xdate=v=>v?esc(v):'—';
  // vpe_df_60d_sum is stored ALREADY ×100 (rounded 1dp) in universe_stage_analysis.csv — display as-is at 1dp.
  // groups -> [header, [[colKey, label, formatter],...], asOfCaption?]; renders stacked (no wide table)
  const XG=[
    ['Volume / VPE',[['vpe_df_60d_sum','vol_vpe_60d Σ',v=>xnum(v,1)],['vpe_zone_cumul_df','zone_vol_vpe Σ',v=>xnum(v,2)]]],
    ['Prior Base',[['duration_from_prev_signal','Days since',xint],['pct_change_from_prev_signal','Return %',xpct],['drawdown_from_prev_signal','Drawdown %',xpct],['stage_changed_since_prev_signal','Stage changed?',xbool]],'from the latest stage-change / pivot session'],
    ['New Pivot',[['base_count','Base count',xint],['pivot_close','Pivot close',v=>xnum(v,2)],['pivot_low','Pivot low',v=>xnum(v,2)]],'from the latest stage-change / pivot session'],
  ];
  // Stacked like Key data (same .m2kv label:value grid), just grouped under sub-headers — no wide table.
  function kvExt(r){
    const sx=r.sx||{};
    return XG.map(([g,cols,cap])=>{
      let rows=cols.map(([k,lbl,fmt])=>`<div class="kv"><span class="k">${esc(lbl)}</span><span class="v">${fmt(sx[k])}</span></div>`).join('');
      // Previous-stage fields (from the row payload, not sx) live under the Volume / VPE group. Shown only when non-null.
      if(g==='Volume / VPE'){
        if(r.prev_stage!=null) rows+=`<div class="kv"><span class="k">Prev stage</span><span class="v">${xint(r.prev_stage)}</span></div>`;
        if(r.prev_zone_vpe!=null) rows+=`<div class="kv"><span class="k">Prev zone-VPE</span><span class="v">${xnum(r.prev_zone_vpe,2)}</span></div>`;
      }
      const c=cap?`<div class="m2gcap">${esc(cap)}</div>`:'';
      return `<div class="m2gsec"><div class="m2gh">${esc(g)}</div>${c}<div class="m2kv">${rows}</div></div>`;
    }).join('');
  }

  // ---- stage history table ----
  function histTbl(sym){
    // Members come from the bulk file (it is already loaded for the 30-day feed); anyone else from
    // their own per-company file, which is the only place their history exists.
    const own=COMP[sym]&&COMP[sym].hist;
    if(!HIST[sym]&&own) return histRows(own);
    if(!histLoaded) return '<div class="mmhcap">Loading stage history&hellip;</div>';
    return histRows(HIST[sym]||[]);
  }
  function histRows(src){
    const h=(src||[]).filter(x=>{            // x = [date, close, stage, dur, transition, signal]
      if(x[3]===1) return true;                             // Duration==1 (stage-change day): always include, any signal
      if(x[5]==='Advancing (S2)'||x[5]==='Repeat') return false;   // otherwise drop the continuation rows
      if(!x[5]) return false;                               // otherwise drop blank-signal rows
      return true;                                          // any other signal: keep
    });
    if(!h.length) return '<div class="mmhcap">No stage history rows (after filters).</div>';
    const rows=h.slice().reverse();
    // The window clause is dropped when the host did not supply hist_sessions, rather than printed
    // as "within last undefined" — which is what the Company page showed, because it initialises the
    // lib with an empty meta. A caption that states a number it does not have is worse than a
    // caption that says less.
    const _win = (META && META.hist_sessions) ? ` &middot; within last ${META.hist_sessions}` : '';
    let t=`<div class="mmhcap">${rows.length} sessions (all Dur=1 rows + signals, excl. Advancing (S2)/Repeat${_win})</div><div class="mmhwrap"><table class="mmhist">`+
      '<tr><th>Date</th><th>Close</th><th>Stage</th><th>Dur</th><th>Transition</th><th>Signal</th></tr>';
    for(const x of rows) t+=`<tr><td>${esc(x[0])}</td><td>${x[1]==null?'—':Number(x[1]).toFixed(2)}</td><td>${x[2]==null?'—':esc(STG[x[2]]||x[2])}</td><td>${x[3]==null?'—':x[3]}</td><td>${x[4]?esc(x[4]):'—'}</td><td>${sigCell(x[5],x[3])}</td></tr>`;
    return t+'</table></div>';
  }

  // ---- the per-company file: ONE fetch, three consumers ----
  // The picker reaches ~2,131 stocks while the inline payload carries only the 195 members, so for
  // everything else the record, its price and its stage history all come from this file. One promise
  // per symbol, cached, so selecting a stock does not fetch the same file three times.
  const COMP={}, COMPQ={};

  // ---- payload split (PAYLOAD_SPLIT_DESIGN.md), GENERATED from assemble_company.VOLATILE_PATHS ----
  // A company file is two halves: <SYM>.json (narrative — changes when research lands) and
  // <SYM>.v.json (price/stage series — a new row every trading day). Split so a day of price moves
  // stops re-storing 47 MB of unchanged narrative in the deploy repo.
  function fetchCompanyFile(DATADIR,file){
    var base=DATADIR+'/company/'+encodeURIComponent(file);
    var vol=DATADIR+'/company/'+encodeURIComponent(String(file).replace(/\.json$/,'.v.json'));
    return Promise.all([
      fetch(base).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}),
      fetch(vol).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
    ]).then(function(a){
      var b=a[0],v=a[1]; if(!v) return b;                 // pre-split or stripped: base IS the whole
      var o={}; for(var k in b)o[k]=b[k];
      if(v.momentum!==undefined)o.momentum=v.momentum;
      if(v.deepdive&&v.deepdive.px!==undefined){var s_px={},b_px=o.deepdive||{};for(var q in b_px)s_px[q]=b_px[q];s_px.px=v.deepdive.px;o.deepdive=s_px;}
      if(v.drhp&&v.drhp.grades!==undefined){var s_grades={},b_grades=o.drhp||{};for(var q in b_grades)s_grades[q]=b_grades[q];s_grades.grades=v.drhp.grades;o.drhp=s_grades;}
      return o;
    });
  }

  function fetchCompany(sym){
    if(COMP[sym]) return Promise.resolve(COMP[sym]);
    if(COMPQ[sym]) return COMPQ[sym];
    COMPQ[sym]=fetchCompanyFile(DATADIR,fileOf(sym))
      .then(c=>{const m=(c&&c.momentum)||{}; COMP[sym]=m; PRICE[sym]=m.price||[]; return m;})
      .catch(e=>{delete COMPQ[sym]; throw e;});
    return COMPQ[sym];
  }
  // A record for ANY pickable symbol: members come from the inline payload, everyone else from the
  // per-company file once it has landed.
  function recOf(sym){ return STK.find(x=>x.s===sym) || (COMP[sym]&&COMP[sym].stock) || null; }

  // ---- SVG price+volume chart ----
  const yrAgo=(iso,n)=>{const y=+iso.slice(0,4),m=+iso.slice(5,7),d=+iso.slice(8,10);return new Date(y-n,m-1,d);};
  const toDate=iso=>new Date(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10));
  function chart(sym){
    const box=document.getElementById('m2-chart'), hov=document.getElementById('m2-hover');
    if(!PRICE[sym]){                                  // Phase-1 split: fetch this symbol's price on demand
      box.innerHTML='<div class="m2empty">Loading price&hellip;</div>'; hov.textContent='';
      fetchCompany(sym).then(()=>chart(sym))
        // Reader-facing: no repo paths, no run-this-command, no raw fetch error. The serving hint is
        // true only for a page opened off the file system, so it is shown only there (2026-08-15).
        .catch(()=>{box.innerHTML='<div class="m2empty">Price unavailable'+(location.protocol==='file:'?' &mdash; opened from the file system, so the browser blocks the data fetch':'')+'.</div>'; hov.textContent='';});
      return;
    }
    const all=PRICE[sym]||[];
    if(all.length<2){box.innerHTML='<div class="m2empty">No NSE price history for this symbol.</div>';hov.textContent='';return;}
    let data=all;
    if(tf>0){const cut=yrAgo(all[all.length-1][0],tf); data=all.filter(p=>toDate(p[0])>=cut); if(data.length<2)data=all.slice(-2);}
    const W=860,H=330,pL=58,pR=14,pT=12,pB=46,volH=62;
    const closes=data.map(p=>p[1]),vols=data.map(p=>p[2]);
    const cmin=Math.min(...closes),cmax=Math.max(...closes),vmax=Math.max(...vols,1),n=data.length;
    const plotB=H-pB-volH,plotT=pT;
    const X=i=>pL+(W-pL-pR)*(n<2?0:i/(n-1));
    const Y=v=>plotB-(plotB-plotT)*((v-cmin)/((cmax-cmin)||1));
    const VY=v=>(H-pB)-volH*(v/vmax);
    const fmtP=v=> v>=1000?Math.round(v).toLocaleString('en-IN'):(v>=100?v.toFixed(0):v.toFixed(1));
    const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const fmtD=iso=>MON[+iso.slice(5,7)-1]+" '"+iso.slice(2,4);
    let gr='';                                                     // gridlines + axis labels
    const NY=4;
    for(let k=0;k<=NY;k++){const v=cmin+(cmax-cmin)*k/NY,y=Y(v);
      gr+=`<line class="m2grid" x1="${pL}" y1="${y.toFixed(1)}" x2="${W-pR}" y2="${y.toFixed(1)}"/>`+
          `<text class="m2lbl" x="${pL-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${fmtP(v)}</text>`;}
    const NX=Math.min(5,n-1);
    for(let k=0;k<=NX;k++){const i=Math.round((n-1)*k/NX),x=X(i);
      gr+=`<line class="m2grid" x1="${x.toFixed(1)}" y1="${plotT}" x2="${x.toFixed(1)}" y2="${plotB}"/>`+
          `<text class="m2lbl" x="${x.toFixed(1)}" y="${H-8}" text-anchor="${k===0?'start':(k===NX?'end':'middle')}">${fmtD(data[i][0])}</text>`;}
    const line=data.map((p,i)=>X(i).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
    const bars=data.map((p,i)=>`<rect class="m2vol" x="${(X(i)-1).toFixed(1)}" y="${VY(p[2]).toFixed(1)}" width="2" height="${((H-pB)-VY(p[2])).toFixed(1)}"/>`).join('');
    box.innerHTML=`<svg viewBox="0 0 ${W} ${H}">`+gr+
      `<line class="m2axis" x1="${pL}" y1="${plotB}" x2="${W-pR}" y2="${plotB}"/>`+
      bars+`<polyline class="m2price" points="${line}"/>`+
      `<line id="m2cl" class="m2cross" x1="0" y1="${plotT}" x2="0" y2="${plotB}" style="display:none"/>`+
      `<line id="m2clh" class="m2crossh" x1="${pL}" y1="0" x2="${W-pR}" y2="0" style="display:none"/>`+
      `<circle id="m2dot" r="3.5" fill="var(--good)" stroke="var(--bg)" stroke-width="1" style="display:none"/>`+
      `<rect id="m2ov" x="${pL}" y="${plotT}" width="${W-pL-pR}" height="${(H-pB)-plotT}" fill="transparent"/></svg>`+
      `<div class="m2tip" id="m2-tip"></div>`;

  function mcapCell(v){
    if(v==null||v==='') return '';

    const rows=data.slice().reverse();
    // No caption row and no .mmhwrap scroll box (owner 2026-08-15): the month count was restating

  }

  return {init:function(o){o=o||{};STK=o.stocks||[];META=o.meta||{};DATADIR=o.datadir||'data';},

          select:select_detail, chart:chart, recOf:recOf, fetchCompany:fetchCompany,

 "sec": "Capital Goods"}, {"s": "WIPRO", "co": "Wipro Limited", "sec": "Information Technology"}, {"s": "WOCKPHARMA", "co": "Wockhardt Limited", "sec": "Healthcare"}, {"s": "WONDERLA", "co": "WONDERLA HOLIDAYS LTD.", "sec": "Consumer Services"}, {"s": "WPIL", "co": "W P I L LTD.", "sec": "Capital Goods"}, {"s": "XELPMOC", "co": "XELPMOC DESIGN & TECH LTD", "sec": "Information Technology"}, {"s": "XPROINDIA", "co": "XPRO INDIA LIMITED", "sec": "Capital Goods"}, {"s": "XTGLOBAL", "co": "XTGLOBAL INFOTECH LIMITED", "sec": "Information Technology"}, {"s": "YASHHV", "co": "Yash Highvoltage Ltd", "sec": "Capital Goods"}, {"s": "YASHO", "co": "YASHO INDUSTRIES LIMITED", "sec": "Chemicals"}, {"s": "YATHARTH", "co": "YATHARTH", "sec": "Healthcare"}, {"s": "YATRA", "co": "YATRA ONLINE LIMITED", "sec": "Consumer Services"}, {"s": "YESBANK", "co": "YES Bank Ltd", "sec": "Financial Services"}, {"s": "ZAGGLE", "co": "ZAGGLE PREPA OCEAN SER L", "sec": "Information Technology"}, {"s": "ZEEL", "co": "ZEE ENTERTAINMENT ENT LTD", "sec": "Media, Entertainment & Publication"}, {"s": "ZENSARTECH", "co": "ZENSAR TECHNOLOGIES  LTD", "sec": "Information Technology"}, {"s": "ZENTEC", "co": "Zen Technologies Ltd", "sec": "Capital Goods"}, {"s": "ZFCVINDIA", "co": "ZF COM VE CTR SYS IND LTD", "sec": "Automobile and Auto Components"}, {"s": "ZIMLAB", "co": "ZIM LABORATORIES LIMITED", "sec": "Healthcare"}, {"s": "ZODIAC", "co": "ZODIAC ENERGY LIMITED", "sec": "Construction"}, {"s": "ZUARIIND", "co": "ZUARI INDUSTRIES LIMITED", "sec": "Fast Moving Consumer Goods"}, {"s": "ZYDUSLIFE", "co": "ZYDUS LIFESCIENCES LTD", "sec": "Healthcare"}, {"s": "ZYDUSWELL", "co": "ZYDUS WELLNESS LIMITED", "sec": "Fast Moving Consumer Goods"}], "meta": {"datadir": "../data"}}</script><!--DEEPDIVE-JS-START-->
<script>
(function(){
  var el=document.getElementById('deepdive-data'); if(!el) return;
  var DATA={}; try{DATA=JSON.parse(el.textContent);}catch(e){return;}
  var STK=DATA.stocks||[]; if(!STK.length) return;
  var DATADIR=(DATA.meta&&DATA.meta.datadir)||'data';
  var FULL={};   // per-symbol company.json cache (fetch-on-select; Phase-1 split)

  // ---- payload split (PAYLOAD_SPLIT_DESIGN.md), GENERATED from assemble_company.VOLATILE_PATHS ----
  // A company file is two halves: <SYM>.json (narrative — changes when research lands) and
  // <SYM>.v.json (price/stage series — a new row every trading day). Split so a day of price moves
  // stops re-storing 47 MB of unchanged narrative in the deploy repo.
  function fetchCompanyFile(DATADIR,file){
    var base=DATADIR+'/company/'+encodeURIComponent(file);
    var vol=DATADIR+'/company/'+encodeURIComponent(String(file).replace(/\.json$/,'.v.json'));
    return Promise.all([
      fetch(base).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}),
      fetch(vol).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
    ]).then(function(a){
      var b=a[0],v=a[1]; if(!v) return b;                 // pre-split or stripped: base IS the whole
      var o={}; for(var k in b)o[k]=b[k];
      if(v.momentum!==undefined)o.momentum=v.momentum;
      if(v.deepdive&&v.deepdive.px!==undefined){var s_px={},b_px=o.deepdive||{};for(var q in b_px)s_px[q]=b_px[q];s_px.px=v.deepdive.px;o.deepdive=s_px;}
      if(v.drhp&&v.drhp.grades!==undefined){var s_grades={},b_grades=o.drhp||{};for(var q in b_grades)s_grades[q]=b_grades[q];s_grades.grades=v.drhp.grades;o.drhp=s_grades;}
      return o;
    });
  }

  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var fmt=function(x,nd){return (x==null||x==='')?'&mdash;':Number(x).toLocaleString('en-IN',{maximumFractionDigits:nd==null?0:nd});};
  var pct=function(x){if(x==null||x==='')return '';var v=Number(x);var c=v>=0?'var(--bull,#059669)':'var(--bear,#dc2626)';return '<span style="color:'+c+'">'+(v>=0?'+':'')+v.toFixed(1)+'%</span>';};
  var DISC='AI-assisted analysis for education only. Not investment advice. Not SEBI-registered research.';
  var DISC_MIN='<div class="dd-disc-min">'+DISC+'</div>';
  var UID=0;
  var nnum=function(x){var v=Number(x);return isFinite(v)?v:0;};
  // one WTT grade→color map for every consumer (exec chip, track zone, peer table)
  var GCOL={A:'var(--bull,#059669)',B:'#0891b2',C:'var(--conflict,#d97706)',D:'var(--bear,#dc2626)'};
  var gcolor=function(g){return GCOL[String(g)]||'var(--mut,#475569)';};
  function card(l,v,s){return '<div class="dd-kpi"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>';}
  // tiny inline sparkline for the valuation-history rows (null-safe; needs >=2 points)
  function spark(vals){
    var vs=vals.filter(function(x){return x!=null;});
    if(vs.length<2) return '';
    var lo=Math.min.apply(0,vs), hi=Math.max.apply(0,vs), rng=(hi-lo)||1, n=vals.length, d='', st=0;
    vals.forEach(function(x,i){ if(x==null) return;
      d+=(st?'L':'M')+(4+52*(n>1?i/(n-1):0)).toFixed(1)+' '+(15-12*(x-lo)/rng).toFixed(1)+' '; st=1;});
    return '<svg width="60" height="18" viewBox="0 0 60 18" style="vertical-align:middle"><path d="'+d+'" fill="none" style="stroke:var(--hl,#2563eb);stroke-width:1.3"/></svg>';
  }
  // EVERYTHING VISIBLE, NOTHING FOLDED (owner 2026-08-17: "do not collapse any section keep expand by
  // default"). This used to show the first `show` items and hide the rest behind a '+N more' button.
  // The button was honest — it named the count rather than truncating silently — but it still made the
  // reader click to see research that is now published in full, on a page whose whole purpose is the
  // one company they asked for. `show` is kept in the signature so every call site stays valid and the
  // decision lives in ONE function rather than in a dozen callers.
  function moreList(items,show){
    return items.length ? items.join('') : '';
  }
  // minimal markdown -> html (bold, tables, bullet lists, paragraphs)
  function md(t){
    t=String(t||''); var lines=t.split('\n'), out=[], i=0;
    function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
    while(i<lines.length){
      var ln=lines[i];
      if(/^\s*\|.*\|\s*$/.test(ln)){ // table block
        var tb=[]; while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){tb.push(lines[i]);i++;}
        var rows=tb.filter(function(r){return !/^\s*\|[\s:|-]+\|\s*$/.test(r);});
        var h='<table>'; rows.forEach(function(r,ri){
          var cells=r.replace(/^\s*\||\|\s*$/g,'').split('|').map(function(c){return c.trim();});
          h+='<tr>'+cells.map(function(c){return ri===0?'<th>'+inl(c)+'</th>':'<td>'+inl(c)+'</td>';}).join('')+'</tr>';
        }); h+='</table>'; out.push(h); continue;
      }
      if(/^\s*[-*]\s+/.test(ln)){ // list block
        var li=[]; while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){li.push(lines[i].replace(/^\s*[-*]\s+/,''));i++;}
        out.push('<ul style="margin:4px 0;padding-left:18px">'+li.map(function(x){return '<li>'+inl(x)+'</li>';}).join('')+'</ul>'); continue;
      }
      if(ln.trim()===''){i++;continue;}
      out.push('<p style="margin:5px 0">'+inl(ln)+'</p>'); i++;
    }
    return out.join('');
  }

  function chart(px){
    if(!px||px.length<2) return '<div class="subtle" style="font-size:var(--fs-sm,12.5px)">No price series.</div>';
    var W=960,H=200,pL=52,pR=12,pT=12,pB=22, n=px.length;
    var ys=px.map(function(d){return d[1];}), lo=Math.min.apply(0,ys), hi=Math.max.apply(0,ys);
    var rng=(hi-lo)||1;
    var X=function(i){return pL+(W-pL-pR)*i/(n-1);};
    var Y=function(v){return pT+(H-pT-pB)*(1-(v-lo)/rng);};
    var d=''; px.forEach(function(p,i){d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[1]).toFixed(1)+' ';});
    var up=px[n-1][1]>=px[0][1], col=up?'var(--bull,#059669)':'var(--bear,#dc2626)';
    var g=''; [hi,(hi+lo)/2,lo].forEach(function(v){var y=Y(v).toFixed(1);
      g+='<line x1="'+pL+'" y1="'+y+'" x2="'+(W-pR)+'" y2="'+y+'" style="stroke:var(--line,#eef1f5)"/>'+
         '<text x="'+(pL-6)+'" y="'+(Y(v)+3).toFixed(1)+'" font-size="9" style="fill:var(--mut,#475569)" text-anchor="end">'+fmt(v,0)+'</text>';});
    var lbl='<text x="'+pL+'" y="'+(H-6)+'" font-size="9" style="fill:var(--mut,#475569)">'+esc(px[0][0])+'</text>'+
            '<text x="'+(W-pR)+'" y="'+(H-6)+'" font-size="9" style="fill:var(--mut,#475569)" text-anchor="end">'+esc(px[n-1][0])+'</text>';
    return '<svg class="dd-chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+g+
           '<path d="'+d+'" fill="none" style="stroke:'+col+';stroke-width:1.6"/>'+lbl+'</svg>';
  }

  // THE canonical P&L: one machine-verified table from the structured quarterly store — a quarter
  // view (latest Q vs same Q prior year, YoY) and a fiscal-year view (last 2 complete FYs, YoY).
  // Replaces the concall 'Scorecard' re-print + the duplicated KPI cards (one fact, one home).
  function pnlView(v){
    if(!v||!v.rows||!v.rows.length) return '';
    var hp=v.prior&&v.prior!=='';
    var head='<tr><th>Metric</th><th>'+esc(v.label)+'</th>'+(hp?'<th>'+esc(v.prior)+'</th><th>YoY</th>':'')+'</tr>';
    var body=v.rows.map(function(r){
      var c=(r.cur==null?'&mdash;':fmt(r.cur,r.nd||0));
      var p=(r.prior==null?'&mdash;':fmt(r.prior,r.nd||0));
      var y='';
      if(hp){
        if(r.yoy==null) y='&mdash;';
        else if(r.pct){ var col=r.yoy>=0?'var(--bull,#059669)':'var(--bear,#dc2626)';
          y='<span style="color:'+col+'">'+(r.yoy>=0?'+':'')+Number(r.yoy).toFixed(1)+' pp</span>'; }
        else y=pct(r.yoy);
      }
      return '<tr><td>'+esc(r.metric)+'</td><td>'+c+'</td>'+(hp?'<td>'+p+'</td><td>'+y+'</td>':'')+'</tr>';
    }).join('');
    return '<table class="dd-fin"><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';
  }
  function pnlSummary(ps){
    if(!ps||(!ps.quarter&&!ps.year)) return '';
    var h='';
    if(ps.quarter) h+='<div class="dd-btitle">Quarterly P&amp;L &mdash; '+esc(ps.quarter.label)+' vs '+
      esc(ps.quarter.prior||'prior year')+' <span class="dd-src">structured quarterly financials &middot; YoY</span></div>'+
      '<div class="dd-peerwrap">'+pnlView(ps.quarter)+'</div>';
    if(ps.year) h+='<div class="dd-btitle" style="margin-top:12px">Annual P&amp;L &mdash; '+esc(ps.year.label)+
      (ps.year.prior?' vs '+esc(ps.year.prior):'')+' <span class="dd-src">FY roll-up of the quarterly store'+
      (ps.year.note?' &middot; '+esc(ps.year.note):'')+'</span></div><div class="dd-peerwrap">'+pnlView(ps.year)+'</div>';
    return h;
  }
  // capex / investment commitments straight from the ledger (amounts that are otherwise dropped)
  function capexBlock(cx){
    if(!cx||!cx.length) return '';
    var head='<tr><th>Project</th><th>Amount (&#8377; cr)</th><th>Timeline</th><th>Status</th></tr>';
    var body=cx.map(function(c){
      var amt=(c.amount!=null)?fmt(c.amount):(c.pv?esc(c.pv):'&mdash;');
      return '<tr><td style="text-align:left">'+esc(c.item)+'</td><td>'+amt+'</td><td>'+
        esc(c.timeline||'&mdash;')+'</td><td>'+esc(c.status||'')+'</td></tr>';
    }).join('');
    return '<div class="dd-btitle" style="margin-top:14px">Capex &amp; investment commitments '+
      '<span class="dd-src">commitments ledger</span></div><div class="dd-peerwrap"><table class="dd-fin"><thead>'+
      head+'</thead><tbody>'+body+'</tbody></table></div>';
  }

  // one financials table: actuals + optional '(per concall)' bridge row + optional AI-projection rows
  function finTable(actuals, proj, conRow, gap){
    actuals=actuals||[];
    if(!actuals.length && !conRow && !(proj&&proj.projection))
      return gap?'<div class="dd-gapnote">'+esc(gap)+'</div>':'';
    var head='<tr><th>Quarter</th><th>Revenue</th><th>Op Profit</th><th>OPM%</th><th>PAT</th><th>EPS (annualised)</th><th>Rev YoY</th></tr>';
    var row=function(a,cls,tag){return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+esc(a.q||a.quarter)+(tag||'')+
      '</td><td>'+fmt(a.revenue)+'</td><td>'+fmt(a.op)+'</td><td>'+fmt(a.opm_pct,1)+'</td><td>'+fmt(a.pat)+
      '</td><td>'+fmt(a.eps,2)+'</td><td>'+pct(a.rev_yoy!=null?a.rev_yoy:a.yoy_pct)+'</td></tr>';};
    var body='';
    actuals.forEach(function(a){
      body+= a.src==='concall' ? row(a,'con','<span class="dd-con-tag">per concall</span>') : row(a,'','');
    });
    if(conRow) body+=row(conRow,'con','<span class="dd-con-tag">per concall</span>');

    var out='<table class="dd-fin"><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';
    if(gap) out+='<div class="dd-gapnote">'+esc(gap)+'</div>';
    return out;
  }

  function projBlock(proj, mcapLive){
    if(!proj) return '<div class="subtle" style="font-size:var(--fs-sm,12.5px);margin-top:6px">No projection for this stock. Projections now come from a driver-based model (<code>company_model</code>), which needs a per-company driver spec.</div>';
    var h='';
    // Provenance first: a deterministic, validated company_model row must not read like an LLM guess,
    // and a frozen LLM row must not read like something current.
    var kind = proj.deterministic ? 'Driver model (validated)' : 'AI projection';
    if(proj.confidence_pct!=null)
      h+='<div class="dd-conf">'+esc(kind)+' confidence: '+esc(proj.confidence_pct)+
         '% &middot; base '+esc(proj.base_quarter||'')+'</div>';
    if(proj.is_stale)
      h+='<div class="dd-conf" style="color:var(--warn);font-weight:600">Stale &mdash; built on '+
         esc(proj.base_quarter||'')+', but '+esc(proj.latest_quarter||'')+' has since been reported. '+
         'This projection is frozen and will not refresh.</div>';
    /*DD-FWDPE-START*/
    // Forward P/E = CURRENT mcap / next-FY projected PAT (sum of the 4 projected quarters' PAT — those
    // are quarterly and summable; EPS is annualised so it is NOT summed). Guarded on both inputs.
    // The marker sits ABOVE this comment deliberately: `pj` and the comment are used by nothing outside
    // the block, so a marker placed below them left the public copy describing a calculation it no
    // longer contained. Anything the forward P/E needs must live INSIDE the markers.
    var pj=proj.projection||[];
    // A forward P/E divides a projected earnings number INTO the live market price — materially closer
    // to a valuation view than the projection alone. publish.py strips this whole block from the PUBLIC
    // copy (owner decision 2026-08-02, pending a SEBI opinion). Internal keeps it.
    if(mcapLive&&pj.length&&pj.every(function(p){return p.pat!=null;})){
      var fpat=pj.reduce(function(a,p){return a+Number(p.pat);},0);
      if(fpat>0){
        var fy=String(pj[0].quarter||'').replace(/^Q\d/,'');   // 'Q1FY27' -> 'FY27'
        h+='<div class="dd-rat"><strong>Forward P/E ('+esc(fy)+'E): ~'+(mcapLive/fpat).toFixed(1)+'x</strong> '+
          '<span class="dd-src">current mcap &#8377;'+fmt(mcapLive)+' cr &divide; '+esc(fy)+'E PAT &#8377;'+
          fmt(fpat)+' cr (sum of projected quarters)</span></div>';
      }
    }
    /*DD-FWDPE-END*/
    (proj.projection||[]).forEach(function(p){
      h+='<div class="dd-rat"><strong>'+esc(p.quarter)+':</strong> '+esc(p.rationale||'');
      if(p.drivers&&p.drivers.length){h+='<div style="margin-top:2px">'+p.drivers.map(function(d){return '<span class="dd-drv"><span class="l">'+esc(d.label)+':</span> '+esc(d.value)+'</span>';}).join('')+'</div>';}
      h+='</div>';
    });
    if(proj.assumptions&&proj.assumptions.length){h+='<div class="dd-rat" style="margin-top:6px"><strong>Assumptions:</strong> '+proj.assumptions.map(esc).join(' &middot; ')+'</div>';}
    if(proj.sources&&proj.sources.length){h+='<div class="subtle" style="font-size:var(--fs-xs,11px);margin-top:3px">Sources: '+proj.sources.map(esc).join('; ')+'</div>';}
    // The WHAT must match the thing; the NOT-ADVICE part is unconditional. A deterministic driver
    // model is not an "AI model estimate", and a disclaimer that misdescribes its own content is
    // weaker, not safer.
    var what = proj.deterministic
      ? 'Deterministic driver model, calibrated on reported financials and validated against '
        + 'independent derivations. Model output, not a forecast.'
      : 'AI model estimate from concall guidance + our P&amp;L history.';
    h+='<div class="dd-disc">&#9888; '+what+' '+DISC+'</div>';
    return h;
  }

  // decision layer c: valuation & ownership — all from files we already load, every figure dated
  function valStrip(r){
    var rows=[];
    var lastA=null,i;
    if(r.actuals) for(i=r.actuals.length-1;i>=0;i--){if(r.actuals[i].eps!=null&&Number(r.actuals[i].eps)!==0){lastA=r.actuals[i];break;}}
    var pxL=(r.px&&r.px.length)?r.px[r.px.length-1]:null;
    var peNum=null, pe='&mdash;', peSub='approx, annualised-EPS basis';
    if(lastA&&pxL&&Number(lastA.eps)>0){
      peNum=pxL[1]/Number(lastA.eps);
      pe=peNum.toFixed(1)+'x';
      peSub+=' &middot; price '+esc(pxL[0])+' &divide; EPS '+esc(lastA.q);
    }
    // vs 5-FY median — history basis differs (FY-end mcap ÷ FY PAT; labeled on the table below)
    var pes=(r.val5||[]).map(function(x){return x.pe;}).filter(function(x){return x!=null;}).sort(function(a,b){return a-b;});
    if(peNum!=null&&pes.length){
      var med=pes.length%2?pes[(pes.length-1)/2]:(pes[pes.length/2-1]+pes[pes.length/2])/2;
      var tag=peNum>med*1.02?['above','var(--conflict,#d97706)']:(peNum<med*0.98?['below','var(--bull,#059669)']:['near','var(--mut,#475569)']);
      peSub+=' &middot; <span style="color:'+tag[1]+';font-weight:700">'+tag[0]+' '+pes.length+'-FY median '+med.toFixed(1)+'x</span>';
    }
    rows.push(card('TTM P/E (approx)',pe,peSub));
    var o=r.own||{}, ph='&mdash;', psub='';
    if(o.prom!=null){
      ph=fmt(o.prom,2)+'%';
      if(o.prev!=null){
        var d=o.prom-o.prev;
        var ar=d>0.01?'<span style="color:var(--bull,#059669)">&#9650;</span>':(d<-0.01?'<span style="color:var(--bear,#dc2626)">&#9660;</span>':'&#8594;');
        psub=ar+' vs '+fmt(o.prev,2)+'% in '+esc(o.prev_fy||'prior FY')+' &middot; ';
      }
      psub+='as of '+esc(o.prom_fy||o.fy||'');
    }
    rows.push(card('Promoter holding',ph,psub));
    // LIVE mcap (security-master snapshot, dated) — the same figure the forward P/E divides, so the
    // two never disagree. Only when the snapshot has no row do we show the yearly-master FY-END
    // figure, and then it is LABELED FY-end so a lagging number is never read as current.
    var mcv=(r.mcap_live!=null?r.mcap_live:r.mcap), mcsub;
    if(r.mcap_live!=null) mcsub=r.mcap_asof?'live &middot; as of '+esc(r.mcap_asof):'live';
    else mcsub=r.mcap?('FY-end'+(o.fy?' &middot; as of '+esc(o.fy):'')):'';
    rows.push(card('Market cap',mcv?'&#8377;'+fmt(mcv)+' cr':'&mdash;',mcsub));
    if(r.netdebt) rows.push(card('Net cash / debt',esc(r.netdebt),'per '+esc(r.qtr||'')+' concall note'));
    var h='<div class="dd-btitle" style="margin-top:12px">Valuation &amp; ownership</div><div class="dd-kpis">'+rows.join('')+'</div>';
    h+=valHist(r);
    if(r.divline) h+='<div class="dd-rat"><strong>Capital allocation:</strong> '+esc(r.divline)+'. <span class="dd-src">'+esc(r.qtr||'')+' concall &#167;capital allocation</span></div>';
    return h;
  }
  // valuation-vs-history: <=5 FYs from the yearly master, metric rows x FY columns + sparkline.
  // P/E basis differs from the TTM card (FY-end mcap / FY PAT) so the basis is labeled here;
  // missing inputs render em-dash, never an invented figure.
  function valHist(r){
    var v=r.val5||[]; if(!v.length) return '';
    var head='<tr><th>Metric</th>'+v.map(function(x){return '<th>'+esc(x.fy)+'</th>';}).join('')+'<th>trend</th></tr>';
    function mrow(l,k,nd,suf){
      var vals=v.map(function(x){return x[k];});
      if(!vals.some(function(x){return x!=null;})) return '';
      return '<tr><td>'+l+'</td>'+vals.map(function(x){return '<td>'+(x==null?'&mdash;':fmt(x,nd)+(suf||''))+'</td>';}).join('')+'<td>'+spark(vals)+'</td></tr>';
    }
    var body=mrow('Mcap &#8377; cr','mcap',0)+mrow('P/E (approx)','pe',1,'x')+mrow('ROE','roe',1,'%')+mrow('OPM','opm',1,'%');
    if(!body) return '';
    return '<div class="dd-btitle" style="margin-top:12px">Valuation vs history <span class="dd-src">yearly master &middot; P/E = FY-end mcap &divide; FY PAT (approx)</span></div>'+
           '<div class="dd-peerwrap"><table class="dd-fin"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
  }
  // decision layer d: curated peer comparison (shared engine — product-matched + industry,
  // sector-guarded) on P/E · EBITDA margin · PAT · earnings growth. Target row first (highlighted).
  function peerTable(r){
    var pp=r.peer_panel||{}, rows=pp.peers||[];
    /* NO PEER IS A FINDING, NOT AN ABSENCE (owner 2026-08-18: "if no peer we can show blank our
       company ... peer as not available"). This mattered only once D3 made peers their own SECTION:
       inside Key Numbers an empty peer table was invisible, but an empty section reads as "we have
       nothing on this company". 129 companies have a target row and no peers — they now show their
       own row and say so. The 33 with no target row either still return '' — there is genuinely
       nothing to draw, and an empty table would be the same lie pointing the other way. */
    if(!rows.length && !pp.target) return '';
    var cov={}; STK.forEach(function(x){cov[x.s]=x;});
    var SRC={identified:'our intel',drhp:'DRHP',product:'product match',industry:'industry'};
    var m=function(n,suf){return (n==null||n==='')?'&mdash;':fmt(n,(suf==='x'?1:1))+(suf||'');};
    function row(x,isT){
      var cv=cov[x.s], g=(cv&&cv.wtt&&cv.wtt.credibility_grade&&cv.wtt.credibility_grade!=='N/A')?String(cv.wtt.credibility_grade):'';
      var chip=g?' <span class="dd-gchip" style="font-size:var(--fs-xs,11px);padding:1px 7px;color:'+gcolor(g)+';border-color:'+gcolor(g)+'" title="Walk-the-Talk credibility grade">WTT '+esc(g)+'</span>':'';
      var lbl=isT?' <span class="dd-src">this co</span>':(x.source?' <span class="dd-src">'+(SRC[x.source]||x.source)+'</span>':'');
      var nm=x.name?'<div class="dd-src" style="margin-top:1px">'+esc(trunc(x.name,34))+'</div>':'';
      var gr=(x.pat_growth==null)?'&mdash;':(fmt(x.pat_growth,1)+'% <span class="dd-src">'+esc(x.growth_basis||'')+'</span>');
      return '<tr'+(isT?' style="font-weight:700;background:var(--hl-soft,rgba(37,99,235,.07))"':'')+'>'+
        '<td>'+esc(x.s)+chip+lbl+nm+'</td><td>'+m(x.pe,'x')+'</td><td>'+m(x.ebitda_margin,'%')+
        '</td><td>'+(x.pat==null?'&mdash;':'&#8377;'+fmt(x.pat)+' cr')+'</td><td>'+gr+'</td></tr>';
    }
    // Segment sub-headings: a company can run two businesses whose comparables must not be averaged
    // into one table (HFCL = optical fibre AND defence electronics; 29% vs -4% EBITDA). Rows carry
    // `group` from config.PEER_OVERRIDES; ungrouped panels render exactly as before.
    var body=(pp.target?row(pp.target,true):''), lastG=null;
    rows.forEach(function(x){
      var g=x.group||'';
      if(g!==lastG){
        if(g) body+='<tr><td colspan="5" class="dd-src" style="padding-top:9px;font-weight:700;'+
                    'letter-spacing:.02em;text-transform:uppercase">'+esc(g)+'</td></tr>';
        lastG=g;
      }
      body+=row(x,false);
    });
    if(!rows.length) body+='<tr><td colspan="5" class="dd-src" style="padding:10px 0;text-align:center">'+
      'Peers not available &mdash; no listed comparable found for this company.</td></tr>';
    return '<div class="dd-btitle" style="margin-top:12px">Peer comparison <span class="dd-src">'+esc(pp.industry||'')+(pp.asof?' &middot; financials as of '+esc(pp.asof):'')+'</span></div>'+
           '<div class="dd-peerwrap"><table class="dd-fin"><thead><tr><th>Company</th><th>P/E</th><th>EBITDA&nbsp;margin</th><th>PAT</th><th>Earnings&nbsp;growth</th></tr></thead><tbody>'+body+'</tbody></table></div>'+
           '<div class="subtle" style="font-size:var(--fs-xs,11px)">listed peers from our own files (curated / DRHP-named / product match, vetted against annual-report &amp; deck vocabulary) &middot; factual comparison only &mdash; not a recommendation</div>';
  }

          return '<div class="dd-trow">'+(v.agm?'<span class="dd-agm">AGM</span>':'')+

  function render(sym){
    var view=document.getElementById('dd-view');
    if(FULL[sym]) return draw(FULL[sym]);
    var thin=STK.filter(function(x){return x.s===sym;})[0]||STK[0];
    var file=(thin&&thin.file)||(sym+'.json');
    view.innerHTML='<div class="empty" style="padding:44px;text-align:center;color:var(--mut,#475569)">Loading '+esc(sym)+'&hellip;</div>';
    fetchCompanyFile(DATADIR,file)
      .then(function(c){FULL[sym]=c.deepdive||{}; if(!FULL[sym].s)FULL[sym].s=sym; draw(FULL[sym]);})
      // Same rule as the IPO tab (2026-08-15): no repo paths or run-this-command text in a rendered
      // box. This tab is internal-only today, but "internal-only" is a publish setting, not a
      // property of the string — the IPO tab was internal-only once too.
      .catch(function(){view.innerHTML='<div class="empty" style="padding:44px;text-align:center;color:var(--bear,#dc2626)">Details for '+esc(sym)+' are unavailable right now.'+(location.protocol==='file:'?'<br><span class="subtle">Opened from the file system, so the browser blocks the data fetch.</span>':'')+'</div>';});
  }
  function draw(r){
    var sec=r.sections||{};
    var noteQ=r.qtr||'', dd=r.deck_date||'', stale=!!r.deck_stale;
    var cs=noteQ?noteQ+' concall':'concall note';
    var ratios=(r.ratios||[]).map(function(x){return '<span class="dd-chip"><span class="l">'+esc(x.label)+'</span>'+esc(x.value)+'</span>';}).join('');
    var mcHero=(r.mcap_live!=null?r.mcap_live:r.mcap);      // live snapshot mcap, FY-end only as fallback
    var mcap=mcHero?('&#8377;'+fmt(mcHero)+' Cr'):'';
    var h='';
    // 1) DECISION LAYER — executive band: identity + credibility chip + vintage badges + thesis + price
    var idc=gradeChip(r.wtt);
    if(String(r.ctype||'').toLowerCase()==='agm') idc+='<span class="dd-agm" style="font-size:var(--fs-xs,11px);padding:2px 7px;vertical-align:0">AGM</span>';
    if(r.sec2||r.sec) idc+='<span class="dd-chip"><span class="l">Sector</span>'+esc(r.sec2||r.sec)+'</span>';
    if(r.isin) idc+='<span class="dd-vint">ISIN '+esc(r.isin)+'</span>';
    if(noteQ) idc+='<span class="dd-vint">concall '+esc(noteQ)+(r.ctype&&r.ctype!=='earnings_call'?' &middot; '+esc(r.ctype):'')+'</span>';
    if(dd) idc+='<span class="dd-vint'+(stale?' stale':'')+'">deck '+esc(dd)+(stale?' &middot; pre-dates latest concall':'')+'</span>';
    if(r.ar_fy) idc+='<span class="dd-vint">Annual Report '+esc(r.ar_fy)+'</span>';
    if(r.last_actual) idc+='<span class="dd-vint">financials to '+esc(r.last_actual)+'</span>';
    var sub=esc(r.sec||'')+(mcap?(' &middot; '+mcap):'')+(noteQ?' &middot; latest call '+esc(noteQ):(r.ar_fy?' &middot; annual source '+esc(r.ar_fy):''));
    var hero='<div class="dd-hd"><div class="dd-co">'+esc(r.co)+' <span class="subtle" style="font-size:var(--fs-base,14px);font-weight:600">'+esc(r.s)+'</span></div>'+
       '<div class="dd-sub">'+sub+'</div></div>'+
       '<div class="dd-idchips">'+idc+'</div>'+
       chart(r.px)+'<div class="dd-ratios">'+ratios+'</div>';   /* thesis MOVED to the Verdict zone */
    h+='<div class="zone dd-zone dd-hero dd-anchor" id="dd-a-summary">'+hero+'</div>';
    // 1b-d) valuation & ownership + peer context (VALUATION-ONLY — the latest-quarter P&L now lives once
    // in the canonical table in Latest Quarter, so no duplicated Revenue/EBITDA/PAT cards here)
    /* D1 (owner 2026-08-17 "1 yes") — ONE `Numbers` section: valuation + the canonical quarterly
       P&L, which used to be a separate `Latest Quarter` zone whose anchor was passed as `null`, so
       it had NO nav entry and was reachable only by scrolling past it. Merging them makes the P&L
       navigable for the first time, and gives the IPO side's single `Financials` sub-tab one thing
       to correspond to instead of two. */
    var lqfin=r.pnl?pnlSummary(r.pnl):finTable(r.actuals,null,r.concall_row,r.fin_gap);
    h+=zone('1','Numbers', valStrip(r)+lqfin+secBlocks(sec.latest_quarter,noteQ,dd),
            'yearly master &middot; StockMetadata &middot; structured quarterly financials'
            +(r.last_actual?' (to '+esc(r.last_actual)+')':'')+' &middot; '+esc(cs),'dd-a-numbers');
    /* D3 (owner 2026-08-17 "3.yes") — peers get their OWN section rather than sitting unnamed inside
       Key Numbers. It was already a labelled sub-tab on the IPO side and buried here, which is one
       of the two vocabulary mismatches the merge set out to remove. Same engine either side
       (company_deep_dive.peers), so this is giving one fact one home, not building a second view. */
    h+=zone('6','Industry &amp; Peers', peerTable(r),
            'peer set from our own files &middot; '+esc(cs),'dd-a-peers');
    // 2) NARRATIVE ZONES — collapsible, first open, '+N more' overflow inside each
    h+=zoneD('2','Business &amp; Moat', profileBlock(r.profile)+keynumChips(r.keynums,dd,stale)+secBlocks(sec.business,noteQ,dd),
            esc(cs)+(dd?' &middot; deck '+esc(dd):''), true,'dd-a-business');
    // Latest Quarter: THE canonical quarter+year P&L (structured store, YoY) + concall commentary
    // (margins / cost dynamics / QoQ). Falls back to the raw actuals table only if the summary is absent.
    /* Latest Quarter now renders INSIDE Numbers — see the D1 note there. */
    // Outlook: the 8Q actuals trend (+ concall bridge row) -> projection series, the capex/investment
    // commitments from the ledger, then the projection rationale + forward P/E.
    // The zone SUBTITLE must name the same provenance projBlock() does — it read a hardcoded
    // "AI projection" while the block below it said "Driver model (validated)", so one page claimed
    // both. Single source of truth: r.proj.deterministic.
    var projKind = (r.proj && r.proj.deterministic) ? 'driver model (validated)' : 'AI projection';
    h+=zoneD('4','Outlook &amp; Projection',
            secBlocks(sec.outlook,noteQ,dd)+finTable(r.actuals,r.proj,r.concall_row,'')+capexBlock(r.capex)+projBlock(r.proj,r.mcap_live),
            esc(cs)+(r.proj?' &middot; '+esc(projKind)+(r.proj.base_quarter?' (base '+esc(r.proj.base_quarter)+')':''):''), false,'dd-a-outlook');
    h+=zoneD('5','Bull vs Bear', secBlocks(sec.bull_bear,noteQ,dd), esc(cs), false,'dd-a-risks');
    // 3) TRACK-RECORD ZONE (+ credit-rating supplement for thin-history stocks)
    h+=trackBlock(r.wtt, r.track);
    h+=creditBlock(r.credit);
    /* D3 (owner "3.yes") — the verdict was a line inside the Summary hero, unnamed and unreachable
       from the nav, while the IPO side has had it as a top-level sub-tab all along. It is MOVED, not
       copied: leaving it in the hero too would put one sentence in two places and guarantee they
       drift the first time either is edited. Last, deliberately — a conclusion belongs after the
       evidence it rests on, not above it. Absent for a company with no thesis, per the §3 rule. */
    if(r.thesis) h+=zone('7','Verdict','<div class="dd-thesis">'+esc(r.thesis)+'</div>',
            esc(cs),'dd-a-verdict');

  var NAV_LBL={'dd-a-summary':'Summary','dd-a-numbers':'Numbers','dd-a-peers':'Industry & Peers',

  var listEl=document.getElementById('dd-list');

  var curSym=null;
  function trunc(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s;}
  // autocomplete: options are HIDDEN until the user types; each option is name(<=16) + symbol only;
  // picking one collapses the list and clears the box.
  function renderMatches(){
    if(!listEl) return;
    var t=(q?q.value:'').trim().toUpperCase();
    if(!t){ listEl.innerHTML=''; listEl.style.display='none'; if(countEl) countEl.textContent=''; return; }
    var hits=STK.filter(function(r){return (r.co||'').toUpperCase().indexOf(t)>=0||(r.s||'').toUpperCase().indexOf(t)>=0;});
    listEl.innerHTML=hits.length?hits.map(function(r){

  }
  function selectRow(sym){
    curSym=sym;
    if(q) q.value='';                                                 // clear the search box
    if(listEl){ listEl.innerHTML=''; listEl.style.display='none'; }   // collapse the options
    if(countEl) countEl.textContent='';
    render(sym);
  }
  var q=document.getElementById('dd-search');
  if(q) q.addEventListener('input',renderMatches);
  if(listEl){ listEl.style.display='none'; listEl.addEventListener('click',function(e){
    var row=e.target&&e.target.closest?e.target.closest('.dd-lrow[data-sym]'):null; if(!row) return;

  if(document.getElementById('dd-list')){

  function crL1(x){

  }

  var GLOSS={

  }

  }

  // Shared peer-comparison table (PE / EBITDA-margin / PAT / earnings-growth). Target row first

  function peerCmp(pp, targetName, inner){
    if(!pp||!pp.peers||!pp.peers.length) return '';
    function mnum(x,s){return (x==null||x==='')?'&mdash;':(esc(x)+(s||''));}

        '<td style="text-align:right">'+mnum(x.pe,'x')+(x.metrics_src?' <span class="ipd-pv">'+esc(x.metrics_src)+'-stated</span>':'')+'</td>'+

      '<th style="text-align:right">Earnings growth</th></tr></thead><tbody>';

    // Segment sub-headings — same rule as company_deep_dive/dashboard.peerTable, kept in lockstep
    // (owner: one peer style across board). Rows carry `group` from config.PEER_OVERRIDES.
    var lastG=null;

      var gp=p.group||'';

  function vTab(r){

  // ── At a Glance: page-1 for the crisp read (IPO_TAB_DESIGN addendum 2026-07-09).
  // Every zone renders ONLY when its store fields exist (show-only-what-exists).
  function glTab(r){
    var rpt=r.rpt||{}, fin=rpt.financials||{}, cap=rpt.capital_ownership||{},
        v=rpt.verdict||{}, g=rpt.governance||{}, rk=rpt.risks||{}, bo=rpt.business_ops||{},
        oe=rpt.objects_execution||{};
    // null/'' must stay null: Number('')===0, so the old form turned a missing figure into a real 0
    // (an all-null pnl_3yr rendered "PAT 0" / "EBITDA margin 0.0%" — see BACKLOG hollow-financials).
    var num=function(x){if(x==null||x==='')return null; var n=Number(String(x).replace(/,/g,'')); return isNaN(n)?null:n;};
    var fmt=function(x,d){return x==null?'':Number(x).toLocaleString('en-IN',{maximumFractionDigits:d==null?0:d});};
    function slab(t){return '<div class="ipg-slab">'+t+'</div>';}
    // chronological FY ordering — extraction rows arrive newest-first for some DRHPs; a stub
    // (H1FY26/9M) sorts AFTER its base year so 'latest' is always the most recent period.
    function byFy(rows){
      return (rows||[]).slice().sort(function(a,b){
        function k(x){var f=String((x&&x.fy)||''); var m=f.match(/(\d{2,4})(?!.*\d)/);
          var y=m?Number(m[1]):0; if(y>1000)y-=2000;
          return y*10+(/H1|H2|9M|6\s*month|3\s*month|period/i.test(f)?5:0);}
        return k(a)-k(b);});
    }
    function spark(vals){
      var vs=vals.filter(function(x){return x!=null;}); if(vs.length<2) return '';
      var lo=Math.min.apply(0,vs), hi=Math.max.apply(0,vs), rng=(hi-lo)||1, n=vals.length, pts=[];
      vals.forEach(function(x,i){ if(x==null)return;
        pts.push((4+82*(n>1?i/(n-1):0)).toFixed(1)+','+(17-14*((x-lo)/rng)).toFixed(1)); });
      var last=pts[pts.length-1].split(',');
      return '<svg width="90" height="20" viewBox="0 0 90 20" style="display:block;margin-top:6px">'+
        '<polyline points="'+pts.join(' ')+'" fill="none" stroke="currentColor" stroke-width="2"/>'+
        '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.4" fill="currentColor"/></svg>';
    }
    function stat(k,vv,t,warn,sp){
      return '<div class="ipg-stat"><div class="k">'+k+'</div><div class="v'+(warn?' ipg-wa':'')+'">'+vv+
             '</div><div class="t">'+t+'</div>'+(sp||'')+'</div>';

    var out='';
    // ── 1 · the numbers ──
    var pnl=byFy(fin.pnl_3yr), bs=byFy(fin.balance_sheet_key), cf=byFy(fin.cash_flow), cards='';
    if(pnl.length){
      var revs=pnl.map(function(x){return num(x.revenue);}), rl=revs[revs.length-1];
      if(rl!=null){
        // CAGR over FULL fiscal years only (stub periods would corrupt the exponent)
        var fulls=pnl.filter(function(x){return !/H1|H2|9M|6\s*month|3\s*month|period/i.test(String(x.fy||''));})
                     .map(function(x){return num(x.revenue);}).filter(function(x){return x!=null;});
        var cagr=(fulls.length>1&&fulls[0]>0&&fulls[fulls.length-1]>0)?
                 (Math.pow(fulls[fulls.length-1]/fulls[0],1/(fulls.length-1))-1)*100:null;
        cards+=stat('Revenue',fmt(rl),(cagr!=null?'<span class="ipg-up">&#9650; '+fmt(cagr,0)+'% CAGR</span> &middot; ':'')+
                    revs.filter(function(x){return x!=null;}).map(function(x){return fmt(x);}).join(' &rarr; '),
                    false,'<span class="ipg-up">'+spark(revs)+'</span>');

      var ms=pnl.map(function(x){return num(x.ebitda_margin_pct);}), ml=ms[ms.length-1];

        ms.filter(function(x){return x!=null;}).map(function(x){return fmt(x,1);}).join(' &rarr; '),
        false,'<span class="ipg-up">'+spark(ms)+'</span>');
      var ps=pnl.map(function(x){return num(x.pat);}), pl=ps[ps.length-1];

        ps.filter(function(x){return x!=null;}).map(function(x){return fmt(x);}).join(' &rarr; '),
        false,'<span class="ipg-up">'+spark(ps)+'</span>');
      var nwl=bs.length?num(bs[bs.length-1].networth):null;

      var cfo=cf.length?num(cf[cf.length-1].cfo):null;
      if(cfo!=null&&pl!=null&&pl>0){

                    'CFO '+fmt(cfo)+' vs PAT '+fmt(pl),ratio<0.8);

      var tr=bs.length?num(bs[bs.length-1].trade_receivables):null;

    if(cards) out+=slab('The numbers &middot; '+(pnl.length?esc(String(pnl[0].fy||''))+' &rarr; '+esc(String(pnl[pnl.length-1].fy||'')):'')+' (&#8377; lakh)')+
                   '<div class="ipg-stats">'+cards+'</div>';
    // ── 2 · the offer ──
    var kv='';
    var ph=cap.promoter_holding||{};
    var ofs=cap.ofs||[], ofsN=ofs.reduce(function(a,x){var s=num(x&&x.shares); return a+(s||0);},0);
    var fresh=(cap.dilution||{}).fresh_shares!=null?num(cap.dilution.fresh_shares):null;
    if(fresh!=null&&ofsN>0){var tot=fresh+ofsN;

    else if(fresh!=null) kv+='<tr><td>Fresh issue</td><td>'+fmt(fresh)+' shares</td></tr>';

    var pac=(cap.promoter_avg_cost||[]).map(function(x){return x&&x.avg_cost_rs!=null?'&#8377;'+esc(String(x.avg_cost_rs)):null;})

    if(pac.length) kv+='<tr><td>Promoter avg cost</td><td>'+pac.join(' / ')+' <span style="font-weight:400;color:var(--mut,#475569)">vs offer price [&#9679;]</span></td></tr>';
    var bw=cap.bonus_within_18m||{};

    var pl2=cap.pledging||{};

    var money='';
    var objs=(oe.objects||[]).map(function(x){
      var nm=x&&(x.object||x.name||x.purpose||x.item), amt=x&&num(x.amount_lakhs!=null?x.amount_lakhs:x.amount);
      return nm&&amt?{n:String(nm),a:amt}:null;}).filter(function(x){return x;});
    if(objs.length){
      var sum=objs.reduce(function(a,x){return a+x.a;},0);
      money=objs.slice(0,6).map(function(x){
        return '<div class="ipg-bar"><span class="n">'+esc(x.n.length>26?x.n.slice(0,25)+'&hellip;':x.n)+

          '<span class="amt">'+fmt(x.a)+' &middot; '+fmt(x.a/sum*100,0)+'%</span></div>';}).join('');
      var onp=oe.orders_not_placed;
      if(onp&&(onp.pct!=null||onp.note)) money+='<div style="font-size:var(--fs-xs,11px);color:var(--mut,#475569);margin-top:8px">Caveat: '+
        esc(String(onp.note||('orders not yet placed for '+onp.pct+'% of capex')))+'</div>';
    }
    if(kv||money){
      out+=slab('The offer')+'<div class="ipg-grid2">';

      out+='</div>';

      out+=slab('Our read &middot; from the DRHP');
      if(v.our_read) out+='<div style="font-size:14.5px;line-height:1.55;padding:11px 15px;margin:0 0 14px;border-left:4px solid #6366f1;background:rgba(99,102,241,.07);border-radius:0 8px 8px 0;font-weight:500">'+esc(String(v.our_read))+'</div>';

      if(st.length) out+='<div class="ipg-card"><h4 style="color:var(--bull,#059669)">Why it works <span>top 3</span></h4><ul>'+st.slice(0,3).map(li).join('')+'</ul></div>';
      if(cn.length) out+='<div class="ipg-card neg"><h4 style="color:var(--bear,#dc2626)">What breaks it <span>top 3</span></h4><ul>'+cn.slice(0,3).map(li).join('')+'</ul></div>';

      var xtra=Math.max(0,st.length-3)+Math.max(0,cn.length-3)+Math.max(0,rf.length-3);
      if(xtra>0) out+='<div style="font-size:12px;color:var(--mut,#64748b);margin-top:9px;text-align:right">+ '+xtra+' more in the Verdict tab &#8595;</div>';

  // 7-tab IA (2026-07-09c, user-approved): composite tabs concatenate the domain renderers,
  // skipping empty/NOTX parts so a thin domain never leaves a "none" box mid-tab.
  function combo(fns){
    return function(r){
      var parts=fns.map(function(f){return f(r);}).filter(function(p){return p&&p!==NOTX;});
      return parts.length?parts.join(''):NOTX;
    };

  // ── shell: hero + sub-tabbar + lazy sub-panels (DOM built on first click) ──
  function showSub(sec){
    Array.prototype.forEach.call(view.querySelectorAll('.ipodd-subbtn'),function(bn){
      bn.classList.toggle('on',bn.getAttribute('data-sub')===sec);
    });
    Array.prototype.forEach.call(view.querySelectorAll('.ipodd-subpanel'),function(pn){
      var on=pn.getAttribute('data-sub')===sec;
      pn.classList.toggle('on',on);
      if(on&&!built[sec]){
        // Every sub-tab now emits its own themed .ipd-card boxes (numbered by the .ipd-gh pass
        // below) -> no outer zone wrapper, no .ipd-block box numbering needed.
        pn.innerHTML=R[sec](cur);
        // glance's exit pills jump straight into the deep sub-tabs
        Array.prototype.forEach.call(pn.querySelectorAll('[data-goto]'),function(el){
          el.addEventListener('click',function(){showSub(el.getAttribute('data-goto'));});
        });
        // number the top-level boxes 1..N (per sub-tab) for a scannable, referenceable read
        var n=0;
        Array.prototype.forEach.call(pn.querySelectorAll('.ipd-block > .ipd-btitle'),function(t){
          n++; var chip=document.createElement('span'); chip.className='ipd-num'; chip.textContent=n;

  function cmpBuild(fulls){
    function nn(x){var n=Number(String(x==null?'':x).replace(/,/g,'')); return isNaN(n)?null:n;}
    function latest(rows,key){
      var rr=(rows||[]).slice().sort(function(a,b){
        function k(x){var s=String((x&&x.fy)||''); var m=s.match(/(\d{2,4})(?!.*\d)/);

          return y*10+(/H1|H2|9M|6\s*month|3\s*month|period/i.test(s)?5:0);}
        return k(a)-k(b);});
      for(var i=rr.length-1;i>=0;i--){var v=nn(rr[i]&&rr[i][key]); if(v!=null) return v;}
      return null;

          pm=latest(fin.pnl_3yr,'pat_margin_pct');

      var wacas=(cap.promoter_avg_cost||[]).map(function(x){return nn(x&&x.avg_cost_rs);})
                 .filter(function(x){return x!=null;});

                ((g.non_compliances||[]).length?1:0)+(((rpt.risks||{}).litigation_summary)?1:0);

                  .filter(function(x){return x!=null;});

      return {s:r.s,co:r.co,pre:r.pre,dt:r.rpt_date||r.as_of||'',rev:rev,em:em,pm:pm,
              ph:pre,waca:waca,flags:flags,score:avg};
    }).sort(function(a,b){return String(b.dt).localeCompare(String(a.dt));});
    function c(x,suf,d){return x==null?'&mdash;':(Number(x).toLocaleString('en-IN',{maximumFractionDigits:d==null?1:d})+(suf||''));}
    var curCo=(STK.filter(function(x){return x.s===curSym;})[0]||{}).co||'company view';
    var h='<button id="ipd-back-btn" type="button">&larr; Back to '+esc(curCo)+'</button>'+
      '<div class="ipd-cmp"><div class="ipd-gh">All companies &middot; same-way computed from each DRHP ('+rows.length+')</div>'+
      '<div class="ipd-tblwrap"><table class="ipd-tbl"><thead><tr><th>Company</th><th>DRHP</th>'+
      '<th style="text-align:right">Revenue (&#8377;L)</th><th style="text-align:right">EBITDA %</th>'+
      '<th style="text-align:right">PAT %</th><th style="text-align:right">Promoter pre %</th>'+
      '<th style="text-align:right">WACA &#8377;</th><th style="text-align:right">Flags</th>'+
      '<th style="text-align:right">Avg score /10</th></tr></thead><tbody>';
    rows.forEach(function(x){
      h+='<tr data-open="'+esc(x.s)+'"><td>'+esc(x.co)+(x.pre?' <span class="ipd-pv">pre-listing</span>':'')+'</td>'+

        '<td style="text-align:right">'+c(x.ph,'%')+'</td>'+
        '<td style="text-align:right">'+c(x.waca,'',2)+'</td>'+

      '<div class="ipd-src" style="margin-left:0">Latest reported period per DRHP; blank cells = not extracted for that company yet. '+
      'Flags = related-party / pre-IPO bonus / past non-compliances / litigation present. Click a company to open it.</div></div>'+DISC_MIN;

  /* EXPORTED, NOT COPIED — the same contract window.DDV and window.M2D already publish, so the

  /* THE TAB'S START-UP BELONGS TO THE TAB. Everything below picks a company and can move the active

     own address bar. `#ipd-list` is the tab's directory and exists nowhere else, which is the same

     `list.style.display='none'` on `#ipd-list` with no null check — an element the Company
     page does not have. So the IIFE threw before ever reaching the export, `window.IPD` was
     never defined, `hasIpo` was false for every company, and the IPO sections silently did

  function applyFilter(){

    if(!t){ list.innerHTML=''; list.style.display='none'; if(cnt) cnt.textContent=''; return; }
    var hits=ORD.filter(function(r){return (r.co||'').toUpperCase().indexOf(t)>=0||(r.s||'').toUpperCase().indexOf(t)>=0;});
    list.innerHTML=hits.length?hits.map(function(r){
      return '<div class="ipd-lrow" data-sym="'+esc(r.s)+'"><span class="ipd-lco">'+esc(truncD(r.co,16))+'</span> <span class="ipd-lsym">'+esc(r.s)+'</span>'+(r.pre?'<span class="ipd-lpre">pre-listing</span>':'')+'</div>';

  list.addEventListener('click',function(ev){
    var row=ev.target.closest?ev.target.closest('.ipd-lrow[data-sym]'):null;
    if(row){ if(q) q.value=''; list.innerHTML=''; list.style.display='none'; if(cnt) cnt.textContent=''; render(row.getAttribute('data-sym')); }
  });

  var cbtn=document.getElementById('ipd-compare-btn');

  if(cbtn) cbtn.addEventListener('click',function(){ if(inCompare) render(curSym); else cmpView(); });

  var h0=(location.hash||'').match(/#ipo=([^&]+)/);
  var start=h0?decodeURIComponent(h0[1]):ORD[0].s;
  if(!STK.some(function(x){return x.s===start;})) start=ORD[0].s;
  render(start);                       // start-up render: _userPick is false, so no URL is written
  _userPick = true;                    // from here on, a selection IS the reader's own

  /* Switch to IPO RHP Analysis ONLY for a hash that arrived with the request. Reading
     `location.hash` live made this self-triggering: the start-up render wrote the hash a moment
     earlier, so the condition was always true and the tab always moved. `h0` was captured BEFORE
     anything could write, which is the difference between "the visitor asked for this company" and
     "we just decided to show one". */
  function switchIfDeepLink(hash){
    if((hash||'').indexOf('#ipo=')===0){
      var btn=document.querySelector('.tabbtn[data-tab="tab-ipodd"]');

    }
  }

  window.addEventListener('hashchange', function(){ switchIfDeepLink(location.hash); });
})();
