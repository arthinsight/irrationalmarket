    list.innerHTML=hits.map(function(r){
      return '<div class="cosr" role="option" data-cos="'+r.s+'"><span class="co">'+
             r.co.replace(/[&<>]/g,'')+'</span><span class="sy">'+r.s+'</span></div>';
    }).join('')+(more?'<div class="cosmore">+'+more+' more &mdash; keep typing</div>':'');
    list.style.display='block';
  });
  function go(sym){ if(sym) location.href='./?sym='+encodeURIComponent(sym); }
  list.addEventListener('click', function(e){
    var row=e.target&&e.target.closest?e.target.closest('[data-cos]'):null;
    if(row) go(row.getAttribute('data-cos'));
  });
  // Enter picks the first match, which is what a keyboard user expects after typing a ticker.
  q.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ var first=list.querySelector('[data-cos]');
      if(first){ e.preventDefault(); go(first.getAttribute('data-cos')); } }
    if(e.key==='Escape'){ list.style.display='none'; }
  });
  document.addEventListener('click', function(e){
    if(!document.getElementById('cosearch').contains(e.target)) list.style.display='none';
  });
})();
</script><script id="co-js">
(function(){
  var D=window.M2D;
  var box=document.getElementById('co-sec-stage');
  function die(msg){ if(box) box.innerHTML='<div class="co-miss">'+msg+'</div>'; }
  if(!D){ die('The shared detail renderers did not load.'); return; }

  // THE SYMBOL COMES FROM THE URL, and the URL is kept in step with what is on screen. Both
  // directions matter (owner): a link lands directly on its company, and editing the symbol in the
  // address bar navigates. `popstate` covers the back button, which would otherwise leave the
  // address bar and the page disagreeing.
  function symFromUrl(){
    var m=/[?&]sym=([^&#]+)/.exec(location.search||'');
    return m ? decodeURIComponent(m[1]).trim().toUpperCase() : '';
  }
  D.init({stocks:[], meta:{hist_sessions:130}, datadir:'../data'});

  // THE SUB-NAV IS BUILT FROM WHAT ACTUALLY RENDERED, never from a fixed list. Only 136 of 2,202
  // companies carry deep-dive research, so a fixed bar would offer six empty sections to 19 out of
  // 20 visitors — and an empty section is indistinguishable from a fetch that failed. Absence has to
  // read as absence. Same rule the Deep-Dive tab already uses for its own zone nav.
  // ONE ROW OF TABS (owner 2026-08-16): Stage analysis sits beside the deep-dive's OWN sections
  // rather than behind a "Research" tab. The nesting was a level the reader had to learn — click
  // Research, then pick a section — for no gain. The deep-dive sections are still discovered rather
  // than listed: DDV.buildNav() writes one button per zone it ACTUALLY rendered into #dd-nav, and
  // those are hoisted here verbatim, so a company missing a zone simply has no tab for it.
  function ddTabs(){
    var n=document.getElementById('dd-nav');
    return n ? Array.prototype.slice.call(n.querySelectorAll('[data-dda]')) : [];
  }
  function hoistHero(){
    var hero=document.getElementById('dd-a-summary');
    var slot=document.getElementById('co-hero');
    if(!hero||!slot||hero.parentNode===slot) return;
    slot.appendChild(hero);
    // The momentum head repeats what the hero already says — symbol and market cap — but it also
    // carries two things the hero does NOT: the stage chip and the accumulation category. Move
    // those into the hero's chip row and drop the rest, rather than hiding a head that holds the
    // only copy of something.
    var head=document.getElementById('m2-head');
    if(head){
      // Move the two chips the hero does NOT carry (stage, accumulation category) into its chip row,
      // then hide the head unconditionally. It used to be hidden only if that move succeeded, so a
      // hero without a .dd-idchips row left the head on screen — repeating "HFCL  mcap ₹34,149 cr"
      // a few pixels under the hero that already says both (owner 2026-08-17). Identity belongs in
      // ONE place on the page, and the hero is it; the chips are moved rather than dropped because
      // the hero never carried them.
      var chips=hero.querySelector ? hero.querySelector('.dd-idchips') : null;
      if(chips && head.querySelectorAll){
        var keep=head.querySelectorAll('.stg, .chip');
        for(var i=keep.length-1;i>=0;i--) chips.insertBefore(keep[i], chips.firstChild);
      }
      head.hidden=true;
      head.style.display='none';     // `hidden` alone loses to a display rule; belt and braces
    }
  }

  function watchZones(){
    var nav=document.getElementById('dd-nav'); if(!nav) return;
    var done=false;
    var settle=function(){ if(done) return; if(!ddTabs().length) return; done=true; hoistHero(); buildSubnav('stage'); };
    if(window.MutationObserver){
      var mo=new MutationObserver(function(){ settle(); if(done) mo.disconnect(); });
      mo.observe(nav, {childList:true, subtree:true});
      setTimeout(function(){ settle(); mo.disconnect(); }, 8000);   // never observe forever
    }
    // poll as well: a renderer that writes the nav in one go before the observer attaches would
    // otherwise leave the row permanently one tab short.
    var tries=0;
    var iv=setInterval(function(){ settle(); if(done || ++tries>40) clearInterval(iv); }, 150);
    settle();
  }

  function buildSubnav(active){
    var nav=document.getElementById('co-sub'); if(!nav) return;
    var research=document.getElementById('co-sec-research');
    var hasRes = research && research.getAttribute('data-co-live')==='1';
    // STAGE ANALYSIS IS GATED ON ITS DATA, like every other section (owner 2026-08-17: "what we
    // don't have for DRHP e.g. chart, stage analysis will be not shown"). It used to be pushed
    // unconditionally, so 497 of 2,699 companies were offered a tab over an empty section — and an
    // empty tab is indistinguishable from a fetch that failed. `M2D.recOf` is the right question to
    // ask: the stage panes are painted from M2D's own universe payload, NOT from a `momentum` key in
    // the company file (20MICRONS.json holds only ['deepdive','meta','s'] while index.json
    // advertises momentum), so testing the file would have gated the wrong thing.
    var hasStage = !!(_curSym && D.recOf && D.recOf(_curSym));
    var ipoSec=document.getElementById('co-sec-ipo');
    var hasIpo = ipoSec && ipoSec.getAttribute('data-co-live')==='1';
    var tabs = hasStage ? [{go:'stage', label:'Stage analysis'}] : [];
    /* THE OFFER TAKES THE STAGE SLOT WHILE THERE IS NO STAGE (owner 2026-08-17: "The Offer stays in
       place of Stage analysis; once we have stage analysis it can go away - I would keep it").
       Read as: never removed, only repositioned. Position 2 is where a reader looks for "what is the
       market situation here" - for a listed company that is the stage picture, and for a pre-listed
       one the offer IS the market situation. Same question, same place, different source. */
    /* THE OFFER IS SHOWN ONLY WHILE THERE IS NO STAGE ANALYSIS (owner 2026-08-18, clarifying an
       earlier reading of mine): it "stays in place of Stage analysis; once we have stage analysis it
       can go away". So it is not repositioned once the stock trades - it is DROPPED. The offer is
       what a reader has instead of a price history; the moment there is a price history, the price
       history is the better answer to the same question and the offer is back-story. */
    if(hasIpo) (window.IPD ? window.IPD.sections() : []).forEach(function(x){
      if(x.id === 'offer' && hasStage) return;
      tabs.push({ipo:x.id, label:x.label});
    });
    if(hasRes) ddTabs().forEach(function(b){
      tabs.push({dda:b.getAttribute('data-dda'), label:b.textContent||'Section'});
    });
    /* ...and where it sits while it IS shown: slot 2, rather than fourth behind Business and
       Financials. Position 2 is where a reader looks for "what is the market situation here". */
    if(!hasStage){
      var oi = tabs.map(function(t){ return t.ipo; }).indexOf('offer');
      if(oi > 1) tabs.splice(1, 0, tabs.splice(oi, 1)[0]);
    }
    // one tab is not a choice — draw nothing rather than a bar the reader cannot use
    nav.innerHTML = tabs.length<2 ? '' : tabs.map(function(t){
      var on=(t.go && t.go===active)||(t.dda && t.dda===active)||(t.ipo && t.ipo===active);
      var attr = t.go  ? 'data-co-go="'+t.go+'"'
               : t.ipo ? 'data-co-ipo="'+t.ipo+'"'
               :         'data-co-dd="'+t.dda+'"';
      return '<button '+attr+(on?' class="on"':'')+'>'+t.label+'</button>';
    }).join('');
    // ONE RUNNING PAGE (owner 2026-08-17): every section stays on screen, stacked, and the tabs are
    // ANCHORS into it — not a switcher. Nothing is hidden, so a reader can scroll straight from the
    // chart into the research without going back to a tab bar, and Ctrl+F finds the whole company.
    var stage=document.getElementById('co-sec-stage');
    if(stage) stage.hidden = !hasStage;          // absent, not empty
    if(ipoSec){
      ipoSec.hidden = !hasIpo;
      // the IPO panel draws its own sub-tab bar inside #ipd-view; dropping our nav entry
      // alone would leave The Offer reachable there. One decision, both surfaces.
      ipoSec.classList.toggle('co-no-offer', !!hasStage);
    }
    // ONE decision, TWO consumers: the nav above and the chart CSS both read hasStage from
    // this flag, so a company can never get a Stage tab without its chart rule, or vice versa.
    var root=document.querySelector('.co-page');
    if(root) root.classList.toggle('co-has-stage', !!hasStage);
    if(research) research.hidden = !hasRes;
  }
  document.getElementById('co-sub').onclick=function(e){
    var t=e.target&&e.target.closest?e.target.closest('[data-co-go],[data-co-dd],[data-co-ipo]'):null;
    if(!t) return;
    var go=t.getAttribute('data-co-go'), dda=t.getAttribute('data-co-dd');
    var ipoId=t.getAttribute('data-co-ipo');
    if(ipoId){
      buildSubnav(ipoId);
      // the IPO panel is one running section here, not a switcher, so the tab is an ANCHOR into it
      var sec=document.getElementById('co-sec-ipo');
      if(sec && sec.scrollIntoView) sec.scrollIntoView({behavior:'smooth', block:'start'});
      var b=document.querySelector('#co-sec-ipo .ipodd-subbtn[data-sub="'+ipoId+'"]');
      if(b && b.click) b.click();
      return;
    }
    buildSubnav(go||dda);
    if(go==='stage'){
      var st=document.getElementById('co-sec-stage');
      if(st && st.scrollIntoView) st.scrollIntoView({behavior:'smooth', block:'start'});
      return;
    }
    // the deep-dive's own nav owns where its zones are — reuse its scroll rather than re-deriving it
    var src=ddTabs().filter(function(b){return b.getAttribute('data-dda')===dda;})[0];
    if(src && src.click) src.click();
  };

  // ── alias redirect ────────────────────────────────────────────────────────────────────────────
  // A pre-listing company is keyed on the best name we have; when the exchange allots a ticker that
  // key CHANGES (CALIBER -> CMLL, ADVITJEW -> RAMBHAJO) and the deploy, which mirrors the folder,
  // deletes the old file. Any ?sym= link shared before that moment would 404. assemble_company
  // writes data/company_aliases.json ({old key: current key}, accumulated across builds); this
  // consults it BEFORE giving up.
  //
  // It REWRITES the address rather than quietly serving the new company under the old name: the URL
  // and the content must never disagree, which is the same rule popstate already follows here. And
  // it is loaded lazily — on a miss only — so the common case still costs one fetch, not two.
  var ALIASES=null, _aliasTried=false, _curSym='';   // _curSym: what the page is showing NOW
  function resolveAlias(sym, then){
    if(ALIASES){ then(ALIASES[sym] || ''); return; }
    fetch('../data/company_aliases.json')
      .then(function(r){ return r.ok ? r.json() : {}; })
      .catch(function(){ return {}; })
      .then(function(m){ ALIASES=m||{}; then(ALIASES[sym] || ''); });
  }

  function show(sym, push){
    if(!sym){ die('No company selected. Search for one above.'); return; }
    // Unknown symbol? It may be a key that was renamed. Ask the alias map once and, if it answers,
    // navigate to the current key rather than rendering under a name that no longer exists.
    //
    // STRICTLY ADDITIVE, AND THAT IS DELIBERATE. A symbol with no alias falls through to exactly
    // what this page does today — it does NOT become an error. Being stricter here would turn the
    // 140 pre-listed companies' blank page into "no company found", which is a different change
    // wearing this one's clothes; their fix is rendering their IPO sections, not a new error message.
    var known = !!((D.recOf && D.recOf(sym)) || (window.DDV && window.DDV.has(sym))
                   || (window.IPD && window.IPD.has(sym)));
    if(!known && !_aliasTried){
      _aliasTried = true;                       // one lookup per navigation; never a redirect loop
      resolveAlias(sym, function(now){
        if(now && now !== sym){ show(now, true); return; }
        show(sym, push);                        // no alias — carry on as before
      });
      return;
    }
    _curSym = sym;                       // set BEFORE any buildSubnav() below reads it
    document.title=sym+' — Arth Insight';
    D.select(sym);
    document.getElementById('co-sec-stage').setAttribute('data-co-live','1');

    // Research renders only when this company HAS it. window.DDV is the Deep-Dive tab's own
    // renderer, exported rather than copied, so a zone looks the same on both surfaces.
    // IPO sections — the IPO tab's OWN renderer (window.IPD), exported rather than copied, so a
    // company reads identically here and there. Same absence rule as everything else on this page.
    var ipo=document.getElementById('co-sec-ipo');
    var hasIpo = !!(window.IPD && window.IPD.has(sym));
    if(ipo){
      ipo.setAttribute('data-co-live', hasIpo?'1':'0');
      ipo.hidden = !hasIpo;
      if(hasIpo){ window.IPD.setBase('../data'); window.IPD.render(sym); }
    }

    var res=document.getElementById('co-sec-research');
    var live = !!(window.DDV && window.DDV.has(sym));
    res.setAttribute('data-co-live', live?'1':'0');
    res.hidden = !live;
    if(live){ window.DDV.setBase('../data'); window.DDV.render(sym); }
    buildSubnav('stage');

    // THE ZONES ARRIVE LATER. DDV.render() fetches the company file, so #dd-nav is still empty when
    // the line above runs — the row was therefore built with ONE tab (Stage analysis), and one tab
    // draws no bar at all. The deep-dive tabs then appeared only if something else rebuilt it.
    // Watch for the zone buttons and rebuild the row once they land. My own probe seeded #dd-nav
    // synchronously, which is exactly why it never caught this: the harness removed the race it was
    // meant to test.
    if(live) watchZones();

    if(push && window.history && history.pushState){
      history.pushState({sym:sym}, '', '?sym='+encodeURIComponent(sym));
    }
  }
  // `_aliasTried` is per-NAVIGATION, not per-page: reset at every entry point, or the second
  // company a visitor opens in the same session silently loses its alias lookup.
  window.coShow=function(sym){ _aliasTried=false; show(String(sym||'').trim().toUpperCase(), true); };
  window.addEventListener('popstate', function(){ _aliasTried=false; show(symFromUrl(), false); });

  // timeframe buttons drive the shared chart
  var tfs=document.querySelectorAll('#m2-tf button');
  Array.prototype.forEach.call(tfs,function(b){
    b.onclick=function(){
      Array.prototype.forEach.call(tfs,function(x){x.classList.toggle('active',x===b);});
      D.setTf(+b.dataset.tf);
    };
  });
  // volume analysis is collapsible here too, and needs its bulk file
  var vh=document.getElementById('m2-vol-h');
  if(vh) vh.onclick=function(){
    var c=document.getElementById('m2-vol-collapse'), open=c.classList.toggle('open');
    var t=document.getElementById('m2-vol-tw'); if(t) t.textContent=open?'−':'+';
    var b=document.getElementById('m2-vol-body'); if(b) b.style.display=open?'block':'none';
  };
  D.loadDelVol();

  show(symFromUrl(), false);
})();
</script><script id="nav-sticky-js">
(function(){
  /* Publish row 1's REAL height as --nav1-h so row 2 pins exactly under it. Measured, not assumed:
     the bucket row wraps at narrow widths and the standalone nav carries a logo the dashboard does
     not, so one hard-coded number is wrong on at least one of the two shells at any time. */
  var row1=document.querySelector('.tabbar-buckets')||document.querySelector('.sitenav');
  if(!row1) return;
  var apply=function(){
    var h=Math.round(row1.getBoundingClientRect().height);
    if(h>0) document.documentElement.style.setProperty('--nav1-h', h+'px');
  };
  apply();
  window.addEventListener('load', apply);
  window.addEventListener('resize', apply);
  /* The rows are REBUILT at runtime - the bucket row swaps its tab group on every bucket click, and
     the company page writes its section ribbon only once the data lands. A height measured once is
     the height of the page before any of that. */
  if(window.ResizeObserver) new ResizeObserver(apply).observe(row1);
})();
</script>
