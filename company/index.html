/* ===== ui_tokens.py — design system tokens (UI_STANDARD.md) ===== */

  --good-bg: rgba(5,150,105,.08);

  --warn-bg: rgba(217,119,6,.09);

  --fs-xs: 11px;
  --fs-sm: 12.5px;
  --fs-base: 14px;

  --lh-tight: 1.25;

}

/* shared sub-tab ribbon — underline tabs, one component for every tab (UI_STANDARD P3) */
.u-subnav{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:var(--sp-1);
  margin:0 0 var(--sp-4);padding:var(--sp-2) 0 0;background:var(--bg);
  border-bottom:1px solid var(--line)}
.u-subnav button{appearance:none;border:none;background:none;font-family:'Inter',-apple-system,
  Segoe UI,Roboto,sans-serif;font-size:var(--fs-base);font-weight:600;color:var(--mut);
  cursor:pointer;padding:var(--sp-2) var(--sp-3);border-bottom:2px solid transparent;
  transition:var(--transition)}
.u-subnav button:hover{color:var(--txt)}
.u-subnav button.on{color:var(--hl);border-bottom-color:var(--hl)}
.u-subnav button:focus-visible{outline:2px solid var(--hl);outline-offset:2px;border-radius:var(--r-sm)}

@media (max-width: 700px) {

}

:root{--bg:#f8fafc;--card:rgba(255,255,255,.95);--line:rgba(15,23,42,.08);--txt:#0f172a;--mut:#475569;--hl:#2563eb;}

/* shared standalone-page shell — header (name/logo, top-left), body rhythm, footer */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;font-size:var(--fs-base);
  line-height:var(--lh-base);-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:var(--sp-8) var(--sp-5) 72px}
h1,h2{font-family:'Outfit',sans-serif;color:var(--txt);margin:0}
header{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-8)}
header img{width:44px;height:44px;object-fit:contain;border-radius:var(--r-sm)}
h1{font-size:var(--fs-2xl);line-height:var(--lh-tight);font-weight:600;letter-spacing:-.01em}
.sub{font-size:var(--fs-md);color:var(--mut);margin:var(--sp-1) 0 0}
h2{font-size:var(--fs-lg);font-weight:600;margin:var(--sp-6) 0 var(--sp-2)}
p{margin:0 0 var(--sp-3);max-width:68ch;color:var(--g700)}
ul{margin:0 0 var(--sp-3);padding-left:var(--sp-5)}
li{margin-bottom:var(--sp-2);max-width:68ch;color:var(--g700)}
strong{color:var(--txt);font-weight:600}
.note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--hl);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:var(--sp-4) var(--sp-5);margin:var(--sp-6) 0;
  box-shadow:var(--sh-1)}
.note h2{margin-top:0}
footer{margin-top:var(--sp-8);padding-top:var(--sp-4);border-top:1px solid var(--line);
  font-size:var(--fs-sm);color:var(--mut)}
a{color:var(--hl)}
a:focus-visible{outline:2px solid var(--hl);outline-offset:2px;border-radius:var(--r-sm)}
/* the site nav — links back into the dashboard from a standalone page. Defined HERE, with the rest
   of the shell, because standalone pages never load the dashboard's bucket stylesheet: putting it
   there rendered a correct nav as unstyled links, which the presence check happily passed. */
.sitenav{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-1);margin:0 0 var(--sp-3);
  padding-bottom:var(--sp-2);border-bottom:1px solid var(--line)}
.sitenav-logo{display:flex;align-items:center;gap:var(--sp-2);text-decoration:none;
  padding:0 var(--sp-3) 0 0;margin-right:var(--sp-2);border-right:1px solid var(--line)}
/* the brand name is an <h1> on public pages (it carries the page's entity name for search), so it
   must be reset out of the shell's h1 sizing and sit inline in the bar */
.sitenav-name{font-family:'Outfit',sans-serif;font-weight:600;font-size:var(--fs-md);
  color:var(--txt);white-space:nowrap;margin:0;line-height:1;letter-spacing:0}
.sitenav-logo img{width:28px;height:28px;object-fit:contain;border-radius:var(--r-sm);display:block}
.sitenav-a{font-size:var(--fs-base);font-weight:600;color:var(--mut);text-decoration:none;
  padding:var(--sp-2) var(--sp-3);border-bottom:2px solid transparent}
.sitenav-a:hover{color:var(--txt)}
.sitenav-a:focus-visible{outline:2px solid var(--hl);outline-offset:2px;border-radius:var(--r-sm)}
/* PHONE: the nav is chrome, not content. Five sections plus a search box wrapped onto FOUR rows and
   took 130px of a 844px screen before a reader saw anything (measured 2026-08-17). One row that
   scrolls sideways instead — the sections stay reachable, the page starts near the top. Placed here,
   after `.sitenav`'s own `flex-wrap:wrap`, because an equal-specificity rule emitted earlier loses. */
@media (max-width:700px){
  .sitenav{flex-wrap:nowrap;overflow-x:auto;gap:0;-webkit-overflow-scrolling:touch}
  .sitenav-a{padding:var(--sp-2);white-space:nowrap}
  .sitenav-logo{padding-right:var(--sp-2);margin-right:var(--sp-1)}
  .cosearch{flex:0 0 auto;margin-left:var(--sp-2)}
  .cosearch input{width:8.5rem}
}

  <!-- SUB-NAV FIRST, directly under the site nav (owner 2026-08-17). It used to sit below the hero,
       which put a row of tabs in the middle of the page and, once sticky, floated it over the
       content it had been sitting beneath. Section navigation belongs with the navigation. -->
  <div class="co-sub" id="co-sub"><!-- built from the sections that actually render --></div>
  <!-- The deep-dive's Summary hero is MOVED here on render: it is the best identity block we have
       (company name, sector, mcap, credibility, ISIN, concall vintage, thesis, ratios), and it was
       sitting below the fold while a thinner momentum head repeated the same symbol and mcap above
       it. One heading, at the top of the CONTENT. -->
  <div id="co-hero"></div>

  <section class="co-sec" id="co-sec-stage" data-co-sec="stage">
    <div id="m2-head"></div>
    <div class="m2card" id="m2-insights"></div>
    <div class="m2card">
      <div class="m2chartbar">
        <div class="m2tf" id="m2-tf"><button data-tf="1" class="active">1Y</button><button data-tf="3">3Y</button><button data-tf="5">5Y</button><button data-tf="0">Max</button></div>
        <div class="m2hover" id="m2-hover"></div>
      </div>
      <div id="m2-chart"></div>
    </div>
    <div class="m2card"><div class="m2sec">Stage analysis</div><div id="m2-data"></div>
      <div id="m2-data-ext"></div></div>
    <div class="m2card"><div class="m2sec">Stage history</div><div id="m2-hist"></div></div>
    <div class="m2card open" id="m2-vol-collapse">
      <div class="m2vol-h" id="m2-vol-h"><span class="m2vol-tw" id="m2-vol-tw">&minus;</span>
        <span class="m2sec">Volume analysis</span></div>
      <div class="m2vol-b" id="m2-vol-body"><div id="m2-vol-table"></div></div>
    </div>
  </section>

  <section class="co-sec" id="co-sec-research" data-co-sec="research" hidden>
    <div id="tab-deepdive">
      <div class="dd-nav" id="dd-nav"></div>
      <div id="dd-view"></div>
    </div>
  </section>

  <div class="m2disc">Technical states shown for educational purposes only &mdash; not investment
  advice. Please consult a SEBI-registered investment adviser before making investment decisions.</div>
</div>
<!--CO-M2D-START-->
<script>
if(!window.M2D){window.M2D=(function(){
  const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // strength colour cue for the (already-relabelled) signal labels — visual ranking, no buy/sell words
  const SIGCLS={'Stage-1 Breakout':'sig-strong','New High':'sig-pos','VCP Pivot':'sig-pos','MA Pullback':'sig-pos','Breakdown':'sig-neg','Distribution':'sig-neg','Topping':'sig-warn','Advancing (S2)':'sig-mut','Entered Stage 2':'sig-strong','Repeat':'sig-mut'};
  const sigSpan=s=>s?`<span class="${SIGCLS[s]||''}">${esc(s)}</span>`:'<span class="dis">—</span>';
  // Stage-2 entry day: duration==1 while "Advancing (S2)" means it JUST entered Stage 2 -> show "Entered Stage 2".
  const sigCell=(sig,dur)=>sigSpan((sig==='Advancing (S2)'&&Number(dur)===1)?'Entered Stage 2':sig);
  // readable category labels (display only — raw value kept for the default filter / _is_default)
  const CAT_LABEL={'agg accumulation':'Accumulating','agg and double':'Accumulating + Doubled','doubled':'Doubled','first time':'New'};
  const catLabel=c=>CAT_LABEL[c]||c||'';
  const STG={1:'1 · Basing',2:'2 · Advancing',3:'3 · Top',4:'4 · Decline'};
  const stg=g=>g==null?'<span class="stg stg0">No data</span>':`<span class="stg stg${g}">${esc(STG[g]||g)}</span>`;
  const f=(v,d)=>v==null?'—':(d!=null?Number(v).toFixed(d):v);
  const pc=v=>v==null?'<span style="color:var(--mut)">—</span>':`<span class="${v<0?'neg':'pos'}">${Number(v).toFixed(1)}%</span>`;
  const chips=(s,cls)=>(s||'').split(/[;,]/).map(x=>x.trim()).filter(Boolean).map(x=>`<span class="chip ${cls||''}">${esc(x)}</span>`).join('');
  let cur=null, tf=1;
  // State the lib OWNS. `STK`/`META`/`DATADIR`/`HIST` are injected by whoever hosts it: the tab
  // passes its inline members and the bulk history it already fetches; the Company page passes an
  // empty member list and its own relative data dir. Everything else (the price and company caches)
  // belongs to the renderers and is private, so two hosts cannot corrupt each other's cache.
  let STK=[], META={}, DATADIR='data', HIST={}, histLoaded=false;
  const PRICE={};
  const fileOf=s=>String(s).toUpperCase().replace(/[^A-Za-z0-9_.-]/g,'_')+'.json';

  // ---- insights ----
  function insights(r){
    const I=r.ins||{};
    const ST=I.st||[];
    if(!I.has && !ST.length) return '<div class="m2note">No theme or concall coverage for this stock.</div>';
    let h='';
    if(I.has){
      h+=`<div class="m2thesis">${I.thesis?esc(I.thesis):'<span class="m2note">No one-line thesis on record.</span>'}</div>`;
      h+=`<div>${chips(I.sec)}${chips(I.layer)}${chips(I.cluster)}</div>`;
      if(I.co) h+=`<div class="m2note">${esc(I.co)}${I.q?' · '+esc(I.q):''}${I.cd?' · call '+esc(I.cd):''}</div>`;
    }
    if(ST.length){
      const byT={}; ST.forEach(x=>{(byT[x.theme]=byT[x.theme]||[]).push(x);});
      h+='<div class="m2ins-blk"><div class="hd">Themes &amp; need of the hour</div>';
      Object.keys(byT).forEach(t=>{
        h+=`<div class="m2thm"><b>${esc(t)}</b></div>`;
        byT[t].forEach(s=>{const gen=(s.status==='Unthemed');
          h+=`<div class="m2ins-row">${(!gen&&s.tier)?'<span class="tier t'+(s.tier==='1'?'1':'2')+'">T'+esc(s.tier)+'</span>':''}<span><b>${esc(s.subtheme)}</b> ${(s.tag&&!gen)?'<span class="chip">'+esc(s.tag)+'</span>':''} ${(s.status&&!gen)?'<span class="m2note" style="display:inline">'+esc(s.status)+'</span>':''}</span></div>`;});
      });
      h+='</div>';
    }
    if((I.trig||[]).length){h+='<div class="m2ins-blk"><div class="hd">Near-term triggers</div>'+
      I.trig.map(t=>`<div class="m2ins-row">${t.im?'<span class="imp '+esc(t.im)+'">'+esc(t.im)+'</span>':''}<span><b>${esc(t.tg||t.tm)}</b> ${t.tm&&t.tg?'<span class="m2note" style="display:inline">'+esc(t.tm)+'</span>':''} ${t.cd?'<span class="chip">'+esc(t.cd)+'</span>':''}</span></div>`).join('')+'</div>';}
    return h;
  }

  // ---- key data (2-col pairs) ----
  function kv(r){
    // general stage fields (ungrouped)
    const P=[['Stage',stg(r.g)],['Stage duration (d)',r.d==null?'—':r.d],
      ['MCap latest (cr)',f(r.m,0)],['Close',f(r.cl,2)]];
    // Institution Accumulation group
    const IA=[['First Accumulation month',esc(r.fam)||'—'],['Category',esc(catLabel(r.c))],
      ['Accumulation threshold date',esc(r.atd)||'—'],['Price doubled date',esc(r.pdd)||'—'],
      ['Latest Accumulating %',f(r.a,1)+'%'],['Latest Accumulating month',esc(r.lm)||'—']];
    const rows=arr=>arr.map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
    return `<div class="m2kv">${rows(P)}</div>`+
      `<div class="m2gsec"><div class="m2gh">Institution Accumulation</div><div class="m2kv">${rows(IA)}</div></div>`;
  }

  // ---- Key data: grouped stage-analysis metrics (two-row header, one row = selected stock) ----
  const xnum=(v,d)=>{ if(v==null||v==='')return '—'; const n=Number(v); return isNaN(n)?esc(v):n.toFixed(d); };
  const xint=v=>{ if(v==null||v==='')return '—'; const n=Number(v); return isNaN(n)?esc(v):String(Math.round(n)); };
  const xpct=v=>{ if(v==null||v==='')return '—'; const n=Number(v); return isNaN(n)?esc(v):Math.round(n)+'%'; };
  const xbool=v=>{ const s=String(v==null?'':v).toLowerCase(); return s==='true'?'✓':(s==='false'||s===''?'—':esc(v)); };
  const xdate=v=>v?esc(v):'—';
  // vpe_df_60d_sum is stored ALREADY ×100 (rounded 1dp) in universe_stage_analysis.csv — display as-is at 1dp.
  // groups -> [header, [[colKey, label, formatter],...], asOfCaption?]; renders stacked (no wide table)
  const XG=[
    ['Volume / VPE',[['vpe_df_60d_sum','vol_vpe_60d Σ',v=>xnum(v,1)],['vpe_zone_cumul_df','zone_vol_vpe Σ',v=>xnum(v,2)]]],
    ['Prior Base',[['duration_from_prev_signal','Days since',xint],['pct_change_from_prev_signal','Return %',xpct],['drawdown_from_prev_signal','Drawdown %',xpct],['stage_changed_since_prev_signal','Stage changed?',xbool]],'from the latest stage-change / pivot session'],
    ['New Pivot',[['base_count','Base count',xint],['pivot_close','Pivot close',v=>xnum(v,2)],['pivot_low','Pivot low',v=>xnum(v,2)]],'from the latest stage-change / pivot session'],
  ];
  // Stacked like Key data (same .m2kv label:value grid), just grouped under sub-headers — no wide table.
  function kvExt(r){
    const sx=r.sx||{};
    return XG.map(([g,cols,cap])=>{
      let rows=cols.map(([k,lbl,fmt])=>`<div class="kv"><span class="k">${esc(lbl)}</span><span class="v">${fmt(sx[k])}</span></div>`).join('');
      // Previous-stage fields (from the row payload, not sx) live under the Volume / VPE group. Shown only when non-null.
      if(g==='Volume / VPE'){
        if(r.prev_stage!=null) rows+=`<div class="kv"><span class="k">Prev stage</span><span class="v">${xint(r.prev_stage)}</span></div>`;
        if(r.prev_zone_vpe!=null) rows+=`<div class="kv"><span class="k">Prev zone-VPE</span><span class="v">${xnum(r.prev_zone_vpe,2)}</span></div>`;
      }
      const c=cap?`<div class="m2gcap">${esc(cap)}</div>`:'';
      return `<div class="m2gsec"><div class="m2gh">${esc(g)}</div>${c}<div class="m2kv">${rows}</div></div>`;
    }).join('');
  }

  // ---- stage history table ----
  function histTbl(sym){
    // Members come from the bulk file (it is already loaded for the 30-day feed); anyone else from
    // their own per-company file, which is the only place their history exists.
    const own=COMP[sym]&&COMP[sym].hist;
    if(!HIST[sym]&&own) return histRows(own);
    if(!histLoaded) return '<div class="mmhcap">Loading stage history&hellip;</div>';
    return histRows(HIST[sym]||[]);
  }
  function histRows(src){
    const h=(src||[]).filter(x=>{            // x = [date, close, stage, dur, transition, signal]
      if(x[3]===1) return true;                             // Duration==1 (stage-change day): always include, any signal
      if(x[5]==='Advancing (S2)'||x[5]==='Repeat') return false;   // otherwise drop the continuation rows
      if(!x[5]) return false;                               // otherwise drop blank-signal rows
      return true;                                          // any other signal: keep
    });
    if(!h.length) return '<div class="mmhcap">No stage history rows (after filters).</div>';
    const rows=h.slice().reverse();
    // The window clause is dropped when the host did not supply hist_sessions, rather than printed
    // as "within last undefined" — which is what the Company page showed, because it initialises the
    // lib with an empty meta. A caption that states a number it does not have is worse than a
    // caption that says less.
    const _win = (META && META.hist_sessions) ? ` &middot; within last ${META.hist_sessions}` : '';
    let t=`<div class="mmhcap">${rows.length} sessions (all Dur=1 rows + signals, excl. Advancing (S2)/Repeat${_win})</div><div class="mmhwrap"><table class="mmhist">`+
      '<tr><th>Date</th><th>Close</th><th>Stage</th><th>Dur</th><th>Transition</th><th>Signal</th></tr>';
    for(const x of rows) t+=`<tr><td>${esc(x[0])}</td><td>${x[1]==null?'—':Number(x[1]).toFixed(2)}</td><td>${x[2]==null?'—':esc(STG[x[2]]||x[2])}</td><td>${x[3]==null?'—':x[3]}</td><td>${x[4]?esc(x[4]):'—'}</td><td>${sigCell(x[5],x[3])}</td></tr>`;
    return t+'</table></div>';
  }

  // ---- the per-company file: ONE fetch, three consumers ----
  // The picker reaches ~2,131 stocks while the inline payload carries only the 195 members, so for
  // everything else the record, its price and its stage history all come from this file. One promise
  // per symbol, cached, so selecting a stock does not fetch the same file three times.
  const COMP={}, COMPQ={};
  function fetchCompany(sym){
    if(COMP[sym]) return Promise.resolve(COMP[sym]);
    if(COMPQ[sym]) return COMPQ[sym];
    COMPQ[sym]=fetch(DATADIR+'/company/'+encodeURIComponent(fileOf(sym)))
      .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(c=>{const m=(c&&c.momentum)||{}; COMP[sym]=m; PRICE[sym]=m.price||[]; return m;})
      .catch(e=>{delete COMPQ[sym]; throw e;});
    return COMPQ[sym];
  }
  // A record for ANY pickable symbol: members come from the inline payload, everyone else from the
  // per-company file once it has landed.
  function recOf(sym){ return STK.find(x=>x.s===sym) || (COMP[sym]&&COMP[sym].stock) || null; }

  // ---- SVG price+volume chart ----
  const yrAgo=(iso,n)=>{const y=+iso.slice(0,4),m=+iso.slice(5,7),d=+iso.slice(8,10);return new Date(y-n,m-1,d);};
  const toDate=iso=>new Date(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10));
  function chart(sym){
    const box=document.getElementById('m2-chart'), hov=document.getElementById('m2-hover');
    if(!PRICE[sym]){                                  // Phase-1 split: fetch this symbol's price on demand
      box.innerHTML='<div class="m2empty">Loading price&hellip;</div>'; hov.textContent='';
      fetchCompany(sym).then(()=>chart(sym))
        // Reader-facing: no repo paths, no run-this-command, no raw fetch error. The serving hint is
        // true only for a page opened off the file system, so it is shown only there (2026-08-15).
        .catch(()=>{box.innerHTML='<div class="m2empty">Price unavailable'+(location.protocol==='file:'?' &mdash; opened from the file system, so the browser blocks the data fetch':'')+'.</div>'; hov.textContent='';});
      return;
    }
    const all=PRICE[sym]||[];
    if(all.length<2){box.innerHTML='<div class="m2empty">No NSE price history for this symbol.</div>';hov.textContent='';return;}
    let data=all;
    if(tf>0){const cut=yrAgo(all[all.length-1][0],tf); data=all.filter(p=>toDate(p[0])>=cut); if(data.length<2)data=all.slice(-2);}
    const W=860,H=330,pL=58,pR=14,pT=12,pB=46,volH=62;
    const closes=data.map(p=>p[1]),vols=data.map(p=>p[2]);
    const cmin=Math.min(...closes),cmax=Math.max(...closes),vmax=Math.max(...vols,1),n=data.length;
    const plotB=H-pB-volH,plotT=pT;
    const X=i=>pL+(W-pL-pR)*(n<2?0:i/(n-1));
    const Y=v=>plotB-(plotB-plotT)*((v-cmin)/((cmax-cmin)||1));
    const VY=v=>(H-pB)-volH*(v/vmax);
    const fmtP=v=> v>=1000?Math.round(v).toLocaleString('en-IN'):(v>=100?v.toFixed(0):v.toFixed(1));
    const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const fmtD=iso=>MON[+iso.slice(5,7)-1]+" '"+iso.slice(2,4);
    let gr='';                                                     // gridlines + axis labels
    const NY=4;
    for(let k=0;k<=NY;k++){const v=cmin+(cmax-cmin)*k/NY,y=Y(v);
      gr+=`<line class="m2grid" x1="${pL}" y1="${y.toFixed(1)}" x2="${W-pR}" y2="${y.toFixed(1)}"/>`+
          `<text class="m2lbl" x="${pL-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${fmtP(v)}</text>`;}
    const NX=Math.min(5,n-1);
    for(let k=0;k<=NX;k++){const i=Math.round((n-1)*k/NX),x=X(i);
      gr+=`<line class="m2grid" x1="${x.toFixed(1)}" y1="${plotT}" x2="${x.toFixed(1)}" y2="${plotB}"/>`+
          `<text class="m2lbl" x="${x.toFixed(1)}" y="${H-8}" text-anchor="${k===0?'start':(k===NX?'end':'middle')}">${fmtD(data[i][0])}</text>`;}
    const line=data.map((p,i)=>X(i).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
    const bars=data.map((p,i)=>`<rect class="m2vol" x="${(X(i)-1).toFixed(1)}" y="${VY(p[2]).toFixed(1)}" width="2" height="${((H-pB)-VY(p[2])).toFixed(1)}"/>`).join('');
    box.innerHTML=`<svg viewBox="0 0 ${W} ${H}">`+gr+
      `<line class="m2axis" x1="${pL}" y1="${plotB}" x2="${W-pR}" y2="${plotB}"/>`+
      bars+`<polyline class="m2price" points="${line}"/>`+
      `<line id="m2cl" class="m2cross" x1="0" y1="${plotT}" x2="0" y2="${plotB}" style="display:none"/>`+
      `<line id="m2clh" class="m2crossh" x1="${pL}" y1="0" x2="${W-pR}" y2="0" style="display:none"/>`+
      `<circle id="m2dot" r="3.5" fill="var(--good)" stroke="var(--bg)" stroke-width="1" style="display:none"/>`+
      `<rect id="m2ov" x="${pL}" y="${plotT}" width="${W-pL-pR}" height="${(H-pB)-plotT}" fill="transparent"/></svg>`+
      `<div class="m2tip" id="m2-tip"></div>`;
    const last=data[n-1]; hov.innerHTML=`Latest ${esc(last[0])} &nbsp; <b>${last[1].toFixed(2)}</b>`;
    const svgEl=box.querySelector('svg'),ov=box.querySelector('#m2ov'),cl=box.querySelector('#m2cl'),clh=box.querySelector('#m2clh'),dot=box.querySelector('#m2dot'),tip=box.querySelector('#m2-tip');
    ov.onmousemove=e=>{const r=svgEl.getBoundingClientRect(),br=box.getBoundingClientRect();
      const fx=(e.clientX-r.left)/r.width*W; let i=Math.round((fx-pL)/((W-pL-pR)||1)*(n-1)); i=Math.max(0,Math.min(n-1,i));
      const p=data[i],gx=X(i),gy=Y(p[1]);
      cl.setAttribute('x1',gx);cl.setAttribute('x2',gx);cl.style.display='';
      clh.setAttribute('y1',gy);clh.setAttribute('y2',gy);clh.style.display='';
      dot.setAttribute('cx',gx);dot.setAttribute('cy',gy);dot.style.display='';
      const px=(gx/W)*r.width+(r.left-br.left),py=(gy/H)*r.height+(r.top-br.top);
      tip.innerHTML=`${esc(p[0])}<br><b>${p[1].toFixed(2)}</b> &middot; vol ${p[2].toLocaleString()}`;
      tip.style.display='block';
      const tw=tip.offsetWidth,th=tip.offsetHeight,below=py<th+16;
      tip.style.left=Math.max(tw/2+2,Math.min(px,r.width-tw/2-2))+'px';
      tip.style.top=(below?py+14:py-th-12)+'px';
      tip.style.transform='translateX(-50%)';};
    ov.onmouseleave=()=>{cl.style.display='none';clh.style.display='none';dot.style.display='none';tip.style.display='none';};
  }

  // ---- select ----
  // ₹cr, grouped Indian-style. Replaces the return-since-trigger that used to sit in the head —
  // that number runs to four figures on long-held names (CUPID showed 8902.1%), which says more
  // about how long ago it triggered than about the stock (owner 2026-08-15).
  function mcapCell(v){
    if(v==null||v==='') return '';
    const n=Number(v); if(!isFinite(n)) return '';
    return `<span class="mcap"><i>mcap</i>₹${Math.round(n).toLocaleString('en-IN')} cr</span>`;
  }


  // ---- Volume analysis collapsible table ----
  let DELVOL={}, delvolLoaded=false, delvolLatch=false;
  function renderVolAnalysis(sym){
    const tb=document.getElementById('m2-vol-table');
    if(!tb) return;
    if(!delvolLoaded){
      tb.innerHTML='<div class="m2empty">Loading volume analysis&hellip;</div>';
      return;
    }
    const data=DELVOL[sym]||[];
    if(!data.length){
      tb.innerHTML='<div class="m2empty">No volume analysis data for '+esc(sym)+'</div>';
      return;
    }
    const rows=data.slice().reverse();
    // No caption row and no .mmhwrap scroll box (owner 2026-08-15): the month count was restating
    // what the table shows, and an inner scroller inside an already-collapsible card gave the page
    // two nested scrolls. Same .mmhist table as Stage history, so the type matches the panes above.
    let t='<table class="mmhist">'+
      '<tr><th>Date</th><th>Volume (cr)</th><th>MCap (cr)</th><th>% MCap</th></tr>';
    for(const r of rows){
      const d=r[0];
      const vol=r[1]!=null?Number(r[1]).toFixed(1):'—';
      const mc=r[2]!=null?Number(r[2]).toFixed(0):'—';
      const pct=r[3]!=null?Number(r[3]).toFixed(2)+'%':'—';
      t+=`<tr><td>${esc(d)}</td><td>${vol}</td><td>${mc}</td><td>${pct}</td></tr>`;
    }
    tb.innerHTML=t+'</table>';
  }

  function loadDelVol(){
    if(delvolLatch) return; delvolLatch=true;
    const tb=document.getElementById('m2-vol-table');
    if(tb)tb.innerHTML='<div class="m2empty">Loading volume analysis&hellip;</div>';
    fetch(DATADIR+'/momentum2_delvol.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(d=>{ DELVOL=d||{}; delvolLoaded=true; if(cur) renderVolAnalysis(cur); })
      .catch(e=>{ delvolLatch=false;
        const m='<div class="m2empty">Volume analysis unavailable &mdash; serve the dashboard over HTTP. '+esc(e.message)+'</div>';
        if(tb)tb.innerHTML=m; });
  }

  function _set(id,h){var e=document.getElementById(id); if(e) e.innerHTML=h;}
  function select_detail(sym){
    cur=sym;
    var r=recOf(sym);
    if(!r){
      // ALREADY FETCHED AND STILL NOTHING -> STOP. Without this the retry recurses forever: no
      // record, so fetch; the fetch resolves from cache instantly; still no record, so fetch again.
      // A company file can legitimately carry research but no momentum record (it is not in the
      // stage universe), and every one of those froze the tab in a tight loop — no error, no
      // network traffic, just a page that never responds. `COMP[sym]` is set by fetchCompany even
      // when the file has no momentum section, so it is the honest "we have looked" flag.
      if(COMP[sym]){
        _set('m2-head','<span class="sym">'+esc(sym)+'</span>');
        _set('m2-insights','<div class="m2empty">No stage analysis for '+esc(sym)+
             ' &mdash; it is not in the stage universe.</div>');
        _set('m2-data',''); _set('m2-data-ext',''); _set('m2-hist','');
        _set('m2-chart',''); _set('m2-vol-table','');
        return;
      }
      _set('m2-head','<span class="sym">'+esc(sym)+'</span>');
      _set('m2-insights','<div class="m2empty">Loading&hellip;</div>');
      fetchCompany(sym).then(function(){ if(cur===sym) select_detail(sym); })
        .catch(function(e){ _set('m2-insights','<div class="m2empty">No data for '+esc(sym)+
                                 ' &mdash; '+esc((e&&e.message)||e)+'</div>'); });
      return;
    }
    _set('m2-head','<span class="sym">'+esc(r.s)+'</span>'+stg(r.g)+
         (r.c?'<span class="chip">'+esc(catLabel(r.c))+'</span>':'')+mcapCell(r.m));
    _set('m2-insights',insights(r));
    _set('m2-data',kv(r));
    _set('m2-data-ext',kvExt(r));
    _set('m2-hist',histTbl(sym));
    renderVolAnalysis(sym);
    try{ chart(sym); }
    catch(e){ _set('m2-chart','<div class="m2empty">Chart unavailable for '+esc(sym)+'.</div>'); }
  }

  return {init:function(o){o=o||{};STK=o.stocks||[];META=o.meta||{};DATADIR=o.datadir||'data';},
          setHist:function(h){HIST=h||{};histLoaded=true;},
          select:select_detail, chart:chart, recOf:recOf, fetchCompany:fetchCompany,
          histTbl:histTbl, renderVol:renderVolAnalysis, loadDelVol:loadDelVol,
          insights:insights, kv:kv, kvExt:kvExt, mcapCell:mcapCell,
          esc:esc, stg:stg, catLabel:catLabel, sigCell:sigCell, pc:pc, f:f,
          chips:chips, fileOf:fileOf,
          cur:function(){return cur;}, setCur:function(s){cur=s;},
          setTf:function(n){tf=n;if(cur)chart(cur);}};
})();}
</script>

(function(){
  // SHOWING IS `display:block`, NOT `display:''`. The stylesheet's default for .cosl is display:none,
  // so clearing the INLINE value hands control back to that rule and the dropdown stays hidden — it
  // built the right options every time and never appeared. Browser-verified 2026-08-17; the Node
  // harness could not catch it because it reads innerHTML and does not evaluate CSS.
  var q=document.getElementById('cos-q'), list=document.getElementById('cos-list');
  if(!q||!list) return;
  var ALL=[], loaded=false, MAX=6, loadErr='';
  function load(){
    if(loaded) return; loaded=true;
    fetch('../data/index.json')
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(j){
        ALL=(j.companies||[]).map(function(c){return {s:c.s, co:c.co||''};});
        if(!ALL.length) loadErr='the company index is empty';
      })
      .catch(function(e){
        // SAY SO. This used to swallow the failure and leave ALL empty, so typing produced nothing
        // and the box looked broken rather than unable to load. The common case is the page opened
        // from the file system, where the browser blocks the fetch outright.
        ALL=[];
        loadErr = (location.protocol==='file:')
          ? 'opened from the file system — serve the folder over HTTP for search to work'
          : ('could not load the company index (' + ((e && e.message) || e) + ')');
      });
  }
  q.addEventListener('focus', load);
  q.addEventListener('input', function(){
    var t=(q.value||'').trim().toUpperCase();
    if(!t){ list.style.display='none'; list.innerHTML=''; return; }
    var hits=[], i;
    for(i=0;i<ALL.length && hits.length<=MAX;i++){
      var r=ALL[i];
      if(r.s.toUpperCase().indexOf(t)>=0 || r.co.toUpperCase().indexOf(t)>=0) hits.push(r);
    }
    // count the rest without building them: the reader needs to know the list is TRUNCATED, not that
    // these six are everything.
    var more=0;
    if(hits.length>MAX){ for(;i<ALL.length;i++){ var x=ALL[i];
        if(x.s.toUpperCase().indexOf(t)>=0 || x.co.toUpperCase().indexOf(t)>=0) more++; }
      more+=hits.length-MAX; hits=hits.slice(0,MAX); }
    if(!hits.length){
      list.innerHTML='<div class="cosmore">'+(loadErr || 'No match.')+'</div>';
      list.style.display='block'; return;
    }
    list.innerHTML=hits.map(function(r){
      return '<div class="cosr" role="option" data-cos="'+r.s+'"><span class="co">'+
             r.co.replace(/[&<>]/g,'')+'</span><span class="sy">'+r.s+'</span></div>';
    }).join('')+(more?'<div class="cosmore">+'+more+' more &mdash; keep typing</div>':'');
    list.style.display='block';
  });
  function go(sym){ if(sym) location.href='./?sym='+encodeURIComponent(sym); }
  list.addEventListener('click', function(e){
    var row=e.target&&e.target.closest?e.target.closest('[data-cos]'):null;
    if(row) go(row.getAttribute('data-cos'));
  });
  // Enter picks the first match, which is what a keyboard user expects after typing a ticker.
  q.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ var first=list.querySelector('[data-cos]');
      if(first){ e.preventDefault(); go(first.getAttribute('data-cos')); } }
    if(e.key==='Escape'){ list.style.display='none'; }
  });
  document.addEventListener('click', function(e){
    if(!document.getElementById('cosearch').contains(e.target)) list.style.display='none';
  });
})();
</script><script id="co-js">
(function(){
  var D=window.M2D;
  var box=document.getElementById('co-sec-stage');
  function die(msg){ if(box) box.innerHTML='<div class="co-miss">'+msg+'</div>'; }
  if(!D){ die('The shared detail renderers did not load.'); return; }

  // THE SYMBOL COMES FROM THE URL, and the URL is kept in step with what is on screen. Both
  // directions matter (owner): a link lands directly on its company, and editing the symbol in the
  // address bar navigates. `popstate` covers the back button, which would otherwise leave the
  // address bar and the page disagreeing.
  function symFromUrl(){
    var m=/[?&]sym=([^&#]+)/.exec(location.search||'');
    return m ? decodeURIComponent(m[1]).trim().toUpperCase() : '';
  }
  D.init({stocks:[], meta:{hist_sessions:130}, datadir:'../data'});

  // THE SUB-NAV IS BUILT FROM WHAT ACTUALLY RENDERED, never from a fixed list. Only 136 of 2,202
  // companies carry deep-dive research, so a fixed bar would offer six empty sections to 19 out of
  // 20 visitors — and an empty section is indistinguishable from a fetch that failed. Absence has to
  // read as absence. Same rule the Deep-Dive tab already uses for its own zone nav.
  // ONE ROW OF TABS (owner 2026-08-16): Stage analysis sits beside the deep-dive's OWN sections
  // rather than behind a "Research" tab. The nesting was a level the reader had to learn — click
  // Research, then pick a section — for no gain. The deep-dive sections are still discovered rather
  // than listed: DDV.buildNav() writes one button per zone it ACTUALLY rendered into #dd-nav, and
  // those are hoisted here verbatim, so a company missing a zone simply has no tab for it.
  function ddTabs(){
    var n=document.getElementById('dd-nav');
    return n ? Array.prototype.slice.call(n.querySelectorAll('[data-dda]')) : [];
  }
  function hoistHero(){
    var hero=document.getElementById('dd-a-summary');
    var slot=document.getElementById('co-hero');
    if(!hero||!slot||hero.parentNode===slot) return;
    slot.appendChild(hero);
    // The momentum head repeats what the hero already says — symbol and market cap — but it also
    // carries two things the hero does NOT: the stage chip and the accumulation category. Move
    // those into the hero's chip row and drop the rest, rather than hiding a head that holds the
    // only copy of something.
    var head=document.getElementById('m2-head');
    if(head){
      // Move the two chips the hero does NOT carry (stage, accumulation category) into its chip row,
      // then hide the head unconditionally. It used to be hidden only if that move succeeded, so a
      // hero without a .dd-idchips row left the head on screen — repeating "HFCL  mcap ₹34,149 cr"
      // a few pixels under the hero that already says both (owner 2026-08-17). Identity belongs in
      // ONE place on the page, and the hero is it; the chips are moved rather than dropped because
      // the hero never carried them.
      var chips=hero.querySelector ? hero.querySelector('.dd-idchips') : null;
      if(chips && head.querySelectorAll){
        var keep=head.querySelectorAll('.stg, .chip');
        for(var i=keep.length-1;i>=0;i--) chips.insertBefore(keep[i], chips.firstChild);
      }
      head.hidden=true;
      head.style.display='none';     // `hidden` alone loses to a display rule; belt and braces
    }
  }

  function watchZones(){
    var nav=document.getElementById('dd-nav'); if(!nav) return;
    var done=false;
    var settle=function(){ if(done) return; if(!ddTabs().length) return; done=true; hoistHero(); buildSubnav('stage'); };
    if(window.MutationObserver){
      var mo=new MutationObserver(function(){ settle(); if(done) mo.disconnect(); });
      mo.observe(nav, {childList:true, subtree:true});
      setTimeout(function(){ settle(); mo.disconnect(); }, 8000);   // never observe forever
    }
    // poll as well: a renderer that writes the nav in one go before the observer attaches would
    // otherwise leave the row permanently one tab short.
    var tries=0;
    var iv=setInterval(function(){ settle(); if(done || ++tries>40) clearInterval(iv); }, 150);
    settle();
  }

  function buildSubnav(active){
    var nav=document.getElementById('co-sub'); if(!nav) return;
    var research=document.getElementById('co-sec-research');
    var hasRes = research && research.getAttribute('data-co-live')==='1';
    var tabs=[{go:'stage', label:'Stage analysis'}];
    if(hasRes) ddTabs().forEach(function(b){
      tabs.push({dda:b.getAttribute('data-dda'), label:b.textContent||'Section'});
    });
    // one tab is not a choice — draw nothing rather than a bar the reader cannot use
    nav.innerHTML = tabs.length<2 ? '' : tabs.map(function(t){
      var on=(t.go && t.go===active)||(t.dda && t.dda===active);
      return '<button '+(t.go?'data-co-go="'+t.go+'"':'data-co-dd="'+t.dda+'"')+
             (on?' class="on"':'')+'>'+t.label+'</button>';
    }).join('');
    // ONE RUNNING PAGE (owner 2026-08-17): every section stays on screen, stacked, and the tabs are
    // ANCHORS into it — not a switcher. Nothing is hidden, so a reader can scroll straight from the
    // chart into the research without going back to a tab bar, and Ctrl+F finds the whole company.
    var stage=document.getElementById('co-sec-stage');
    if(stage) stage.hidden=false;
    if(research) research.hidden = !hasRes;
  }
  document.getElementById('co-sub').onclick=function(e){
    var t=e.target&&e.target.closest?e.target.closest('[data-co-go],[data-co-dd]'):null;
    if(!t) return;
    var go=t.getAttribute('data-co-go'), dda=t.getAttribute('data-co-dd');
    buildSubnav(go||dda);
    if(go==='stage'){
      var st=document.getElementById('co-sec-stage');
      if(st && st.scrollIntoView) st.scrollIntoView({behavior:'smooth', block:'start'});
      return;
    }
    // the deep-dive's own nav owns where its zones are — reuse its scroll rather than re-deriving it
    var src=ddTabs().filter(function(b){return b.getAttribute('data-dda')===dda;})[0];
    if(src && src.click) src.click();
  };

  function show(sym, push){
    if(!sym){ die('No company selected. Search for one above.'); return; }
    document.title=sym+' — Arth Insight';
    D.select(sym);
    document.getElementById('co-sec-stage').setAttribute('data-co-live','1');

    // Research renders only when this company HAS it. window.DDV is the Deep-Dive tab's own
    // renderer, exported rather than copied, so a zone looks the same on both surfaces.
    var res=document.getElementById('co-sec-research');
    var live = !!(window.DDV && window.DDV.has(sym));
    res.setAttribute('data-co-live', live?'1':'0');
    res.hidden = !live;
    if(live){ window.DDV.setBase('../data'); window.DDV.render(sym); }
    buildSubnav('stage');

    // THE ZONES ARRIVE LATER. DDV.render() fetches the company file, so #dd-nav is still empty when
    // the line above runs — the row was therefore built with ONE tab (Stage analysis), and one tab
    // draws no bar at all. The deep-dive tabs then appeared only if something else rebuilt it.
    // Watch for the zone buttons and rebuild the row once they land. My own probe seeded #dd-nav
    // synchronously, which is exactly why it never caught this: the harness removed the race it was
    // meant to test.
    if(live) watchZones();

    if(push && window.history && history.pushState){
      history.pushState({sym:sym}, '', '?sym='+encodeURIComponent(sym));
    }
  }
  window.coShow=function(sym){ show(String(sym||'').trim().toUpperCase(), true); };
  window.addEventListener('popstate', function(){ show(symFromUrl(), false); });

  // timeframe buttons drive the shared chart
  var tfs=document.querySelectorAll('#m2-tf button');
  Array.prototype.forEach.call(tfs,function(b){
    b.onclick=function(){
      Array.prototype.forEach.call(tfs,function(x){x.classList.toggle('active',x===b);});
      D.setTf(+b.dataset.tf);
    };
  });
  // volume analysis is collapsible here too, and needs its bulk file
  var vh=document.getElementById('m2-vol-h');
  if(vh) vh.onclick=function(){
    var c=document.getElementById('m2-vol-collapse'), open=c.classList.toggle('open');
    var t=document.getElementById('m2-vol-tw'); if(t) t.textContent=open?'−':'+';
    var b=document.getElementById('m2-vol-body'); if(b) b.style.display=open?'block':'none';
  };
  D.loadDelVol();

  show(symFromUrl(), false);
})();
</script>
